<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tra điểm học phần</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Parkinsans:wght@700&display=swap">
<style>

:root{--bg:#F8F6F3;--card:#fff;--fg:#1A1310;--body:#3A2E26;--mut:#6B5D52;--line:#E5DFD0;--soft:#F3EEE3;--red:#A81C24;--gold:#C9A24E;--goldt:#86661C;--teal:#0E8C71;--tealt:#0A7860;--cam:#C9622A;--camt:#B04E18;--blu:#3A7A9A;--blut:#2E6683;--pur:#6A4A9A;--purt:#5C3E8A;--bad:#9A3412;--onbtn:#fff;--hbg:#0B2A5B;--hfg:#F2E6D8;--hsub:#D9CCC0;--ring:#3A7A9A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A2150;--card:#12315F;--fg:#F2E6D8;--body:#D9CCC0;--mut:#A89A8C;--line:#2A4A7C;--soft:#183B6E;--red:#E0525A;--gold:#D8B565;--goldt:#D8B565;--teal:#3BBE9E;--tealt:#3BBE9E;--cam:#E58A52;--camt:#E58A52;--blu:#6FB0D0;--blut:#6FB0D0;--pur:#A98BD8;--purt:#A98BD8;--bad:#F0A27A;--onbtn:#0B2A5B;--ring:#6FB0D0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A2150;--card:#12315F;--fg:#F2E6D8;--body:#D9CCC0;--mut:#A89A8C;--line:#2A4A7C;--soft:#183B6E;--red:#E0525A;--gold:#D8B565;--goldt:#D8B565;--teal:#3BBE9E;--tealt:#3BBE9E;--cam:#E58A52;--camt:#E58A52;--blu:#6FB0D0;--blut:#6FB0D0;--pur:#A98BD8;--purt:#A98BD8;--bad:#F0A27A;--onbtn:#0B2A5B;--ring:#6FB0D0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 0}
h1,h2,h3,.hd{font-family:Parkinsans,"1FTV VIP Parkinsans",Montserrat,sans-serif;font-weight:700;color:var(--fg)}
.band{margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));background:var(--hbg);border-bottom:4px solid #CD181D}
.band>div{max-width:860px;margin:0 auto;padding:18px 0;display:flex;align-items:center;gap:16px}
.band img{width:58px;height:auto;flex:none}
.band .tx{min-width:0}
.badge{display:inline-block;background:var(--gold);color:#1A1310;font-weight:700;font-size:.7rem;letter-spacing:.06em;padding:2px 10px;border-radius:5px;margin-bottom:4px}
.band h1{margin:0;color:var(--hfg);font-size:1.45rem;line-height:1.25;text-wrap:balance}
.band p{margin:2px 0 0;color:var(--hsub);font-size:.82rem}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-block:20px 24px}
.search{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:10px;padding:16px 18px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.search .f{flex:1 1 240px;min-width:0}.search label{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px;color:var(--fg)}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px}
button{font:inherit;font-weight:600;padding:10px 24px;background:var(--red);color:#fff;border:0;cursor:pointer;border-radius:8px}
:root[data-theme="dark"] button.go{color:#0B2A5B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.go{color:#0B2A5B}}
button:hover{opacity:.9}input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.msg{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:14px 18px;color:var(--mut)}
.pick{display:flex;flex-direction:column;gap:6px;margin-top:6px}.pick button{text-align:left;background:var(--bg);color:var(--fg);border:1px solid var(--line);font-weight:500}
.who{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px}
.who h2{margin:0;font-size:1.3rem}.who p{margin:2px 0 0;color:var(--mut);font-size:.85rem}
.two{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rubc.ck li{grid-template-columns:5rem minmax(0,1fr)}.rubc.ck li u{text-decoration:none;font-weight:700;color:var(--fg)}
.col{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:10px;padding:14px 16px;min-width:0;color:var(--body);font-family:inherit}
.col:hover{border-color:var(--c)}
.col:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.col.on{box-shadow:0 0 0 2px var(--c);background:var(--card)}
.col .lb{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.85rem;color:var(--ct)}
.col svg{width:20px;height:20px;flex:none}
.col .num{font-family:Parkinsans,"1FTV VIP Parkinsans",Montserrat,sans-serif;font-weight:700;font-size:2.7rem;line-height:1.1;color:var(--fg);font-variant-numeric:tabular-nums;margin-top:6px}
.col .num span{font-family:Montserrat,sans-serif;font-weight:500;font-size:1rem;color:var(--mut)}
.col .sub{font-size:.78rem;color:var(--mut)}
.col .see{display:block;margin-top:6px;font-size:.78rem;font-weight:600;color:var(--ct)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:10px 14px}
.tile small{display:flex;align-items:center;gap:6px;color:var(--ct);font-weight:600;font-size:.78rem}
.tile svg{width:16px;height:16px;flex:none}
.tile b{font-family:Parkinsans,"1FTV VIP Parkinsans",Montserrat,sans-serif;font-size:1.5rem;color:var(--fg);font-variant-numeric:tabular-nums}.tile span{color:var(--mut);font-size:.85rem}
.sec{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;overflow:hidden}
.sec>h3{margin:0;padding:12px 18px;display:flex;justify-content:space-between;gap:12px;font-size:1rem;border-bottom:1px solid var(--line)}
.sec>h3 em{font-style:normal;color:var(--ct);font-variant-numeric:tabular-nums;white-space:nowrap}
.it{padding:12px 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:2.8rem minmax(0,1fr) auto;gap:3px 10px;align-items:baseline}
.it:first-of-type{border-top:0}
.it .cd{font-weight:700;color:var(--ct)}.it .nm{font-weight:600;color:var(--fg)}.it .sc{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--fg)}
.it .ds,.it .q{display:block;font-weight:400;font-size:.8rem;color:var(--mut);margin-top:2px}
.it .q{grid-column:2/4;font-style:italic;margin:0}.it .q b{font-style:normal;color:var(--body)}
.it .fb{grid-column:2/4;font-size:.88rem;color:var(--body)}.it.lost .fb{color:var(--bad)}.it.lost .sc{font-weight:700}
.it .cap{grid-column:2/4;font-size:.8rem;color:var(--bad)}
details{grid-column:2/4;font-size:.8rem;color:var(--mut)}details summary{cursor:pointer;font-weight:600;color:var(--ct)}
details ol{margin:6px 0 0;padding-left:1.2rem}details li{margin:3px 0}details li.on{color:var(--fg);font-weight:700}
.cm{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:16px 20px}
.cm h3{margin:0 0 8px;font-size:1rem}.cm p{margin:0;text-wrap:pretty}
.topic{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:14px 20px;font-size:.9rem}.topic ul{margin:6px 0 0;padding-left:1.2rem}
.pres{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--cam);border-radius:10px;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.pres b{font-family:Parkinsans,"1FTV VIP Parkinsans",Montserrat,sans-serif;font-size:1.5rem;color:var(--fg);font-variant-numeric:tabular-nums}.pres small{display:block;color:var(--mut);font-size:.8rem}
.sum{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:14px 20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums;color:var(--fg)}
.legend{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 20px;font-size:.82rem;color:var(--mut)}.legend b{color:var(--fg)}
.note{font-size:.78rem;color:var(--mut);text-align:center;margin:0}
.foot{margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:6px max(16px,env(safe-area-inset-left,0px));background:#CD181D;color:#fff;font-size:.7rem;text-align:left}
.foot div{max-width:860px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:16px}
@media (max-width:560px){.two{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}.it{grid-template-columns:2.4rem minmax(0,1fr) auto}.col .num{font-size:2.2rem}.band h1{font-size:1.2rem}.band img{width:48px}}

.frame{position:relative}
.frame::after{content:"";position:absolute;inset:5px;border:1px solid var(--gold);border-radius:6px;opacity:.55;pointer-events:none}
.one{display:block}
.one .num{font-size:3rem}
.one .sub{display:block}
.adjrow{padding:12px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:baseline}
.adjrow .nm{font-weight:600;color:var(--fg)}.adjrow .sc{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:700;white-space:nowrap}
.adjrow .fb{grid-column:1/3;font-size:.85rem;color:var(--mut)}
.rubhead{margin:0;font-size:1.05rem}
.rubnote{margin:0;padding:10px 18px;font-size:.74rem;color:var(--mut);border-bottom:1px solid var(--line)}
.rubc{padding:12px 18px;border-top:1px solid var(--line)}
.rubc:first-of-type{border-top:0}
.rubc h4{margin:0 0 5px;font-size:.84rem;display:flex;justify-content:space-between;gap:12px;color:var(--fg);font-family:Parkinsans,Montserrat,sans-serif}
.rubc h4 em{font-style:normal;color:var(--ct);white-space:nowrap}
.rubc ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.rubc li{display:grid;grid-template-columns:3.2rem minmax(0,1fr);gap:8px;font-size:.72rem;line-height:1.45;color:var(--mut);padding:5px 8px;border-radius:6px;border-left:3px solid transparent}
.rubc li b{font-variant-numeric:tabular-nums;color:var(--fg)}
.rubc li.on{background:var(--soft);border-left-color:var(--c);color:var(--fg)}
.rubc li.on span{font-weight:600}
.rubc .tag{display:block;font-size:.72rem;color:var(--camt);font-weight:700;margin-top:2px}
.conv{margin:0;padding:12px 18px 14px 36px;font-size:.82rem;color:var(--mut)}.conv li{margin:4px 0}.conv b{color:var(--fg)}
@media (max-width:560px){.one .num{font-size:2.5rem}}
</style>
</head><body>

var D={"215062749":{"name":"Đỗ Ngọc Quyên","it":[{"s":1,"f":"3 đối tượng, 3 loại hình (điêu khắc gốm, kiến trúc kính màu, ký họa màu nước), nêu lý do chọn."},{"s":1,"f":"Mỗi đối tượng có mục \"Quan sát\" cụ thể: tượng gốm nâu ánh đồng, đầu nhỏ cổ thon, đầu gối nâng đỡ con; ô cửa vòm cong, vàng cam nâu xen xanh lá tím, vệt sáng trên nền gạch."},{"s":1.5,"f":"Mỗi chương có mục \"Liên hệ và cảm nhận\", chi tiết hình khối giản lược gợi dịu dàng là tốt; nhiều chỗ nghiêng về ý nghĩa văn hóa hơn là cảm nhận riêng."},{"s":2,"f":"Nhiều thông tin bối cảnh (tác giả, Rivera, Hứa Bổn Hòa, Lê Lam)."},{"s":1,"f":"Danh mục chuẩn APA, đầy đủ đường dẫn, có cả mục trích dẫn hình ảnh."},{"s":1.5,"f":"Cấu trúc rất đầy đủ nhưng khoảng 2.900 từ, vượt xa 1.210 nên tiêu chí này tối đa 1,5."},{"s":1,"f":"Hình tự chụp và hình ngoài có ghi nguồn."}],"b":0,"adj":0,"fin":9.0,"fb":"Bài có cấu trúc chương mục rõ, lời mở đầu rất tốt khi giới thiệu trước các tác phẩm ở phần sau, quan sát tỉ mỉ và danh mục nguồn chuẩn. Em nên rút gọn bài về khoảng 1.100 từ, bớt thông tin xa tác phẩm, và ở phần cảm nhận nên viết thêm điều riêng mà từng tác phẩm gợi cho em."},"225200738":{"name":"Lê Nguyễn Thanh Giác","it":[{"s":0.75,"f":"Ba tranh sơn mài, sơn dầu, tranh (cùng nhóm hội họa), có ghi nơi lưu giữ; chưa có điêu khắc."},{"s":0.5,"f":"Công binh xưởng chỉ nêu màu xanh lá, nâu đậm; Khát tả vật (ống nước, thau, tường rêu) nhưng thiếu màu và bố cục; Không đề có xanh dương, đầu không mặt. Không có bố cục, chất liệu hay khối."},{"s":1,"f":"Chỉ Không đề đạt cả 3 phép thử (đầu không mặt, bàn tay mờ, liên hệ bản thân); Công binh xưởng và Khát chỉ chung chung."},{"s":1,"f":"Có tác giả, kích thước, chất liệu, bối cảnh năm 2005 cho Khát; còn lại ít bối cảnh."},{"s":0.5,"f":"Chỉ ghi ký hiệu (BTMTTPHCM), không có danh mục tài liệu."},{"s":1.5,"f":"Khoảng 1.100 từ, đủ phần; phần mở đầu giới thiệu sai thông tin bảo tàng đã tham quan (ghi Bảo tàng Mỹ thuật Việt Nam, trong khi tác phẩm ở Bảo tàng Mỹ thuật TP.HCM)."},{"s":0.5,"f":"Không rõ nguồn ảnh."}],"b":0,"adj":1.5,"fin":7.25,"fb":"Em chọn thêm tượng hoặc điêu khắc, mô tả bố cục, màu và chất liệu thay vì chỉ nêu ý nghĩa, và ghi nguồn ảnh."},"265027385":{"name":"Nguyễn Đăng Khoa","it":[{"s":1,"f":"4 đối tượng, 2 loại hình (tượng và tranh), có nêu lý do chung (thích tranh lụa, tác phẩm thời chiến)."},{"s":1,"f":"4/4 đối tượng có chi tiết cụ thể: nâu đồng trầm và ánh đèn lên mắt kính; nền xanh dương, xám tôn da hồng, áo dài trắng; đồng có lớp patina xanh rêu, dáng khom lưng, tay đan chặt; mặt người cam đất trên nền đen."},{"s":1,"f":"Có cảm nhận từng tác phẩm (khom lưng mệt mỏi, tương phản sáng tối gợi cô độc) nhưng nhiều câu chỉ là \"nhẹ nhàng, hoài niệm\", thiếu lý do và liên hệ riêng."},{"s":1,"f":"Chủ yếu chất liệu và chủ đề; chỉ 1/4 tác phẩm có tên, tác giả, năm; không có bối cảnh."},{"s":0.5,"f":"Danh mục chung chung (bảo tàng, hướng dẫn viên, \"Google\"), không có đường dẫn cụ thể."},{"s":1.5,"f":"Đủ phần, mạch lạc nhưng khoảng 700 từ, thấp hơn 720 nên tiêu chí này tối đa 1,5."},{"s":0.5,"f":"Ảnh tự chụp nhưng 3/4 tác phẩm thiếu tên, tác giả trong chú thích."}],"b":0,"adj":1.25,"fin":7.75,"fb":"Em quan sát chọn lọc và tả tốt màu, chất liệu, dáng tượng. Em nên ghi đủ tên, tác giả từng tác phẩm, tìm hiểu bối cảnh, ghi nguồn cụ thể và viết thêm cho đủ số từ."},"265022970":{"name":"Tăng Kim Liên","it":[{"s":0.75,"f":"3 tác phẩm đều là tranh (Vườn xuân, Thanh niên thành đồng, Cấy đêm) nên mức 0,75; mục \"Một vài tác phẩm khác\" nói chung về gốm, đồng, gỗ, không chọn hiện vật cụ thể."},{"s":0,"f":"0/3 tác phẩm có chi tiết nhìn thấy: mỗi mục chỉ có tác giả, thời kỳ, chất liệu và tiểu sử; Cấy đêm chỉ nói \"gợi sự chú ý đến cuộc sống người lao động\"."},{"s":0.5,"f":"Cảm nhận chung (\"hồi hộp\", \"mở mang tầm mắt\", \"cần tìm hiểu tác giả\"); không gắn tác phẩm cụ thể."},{"s":1,"f":"Có tác giả, năm, chất liệu, tiểu sử ngắn nhưng chủ yếu liệt kê, chưa giải thích giúp hiểu tác phẩm."},{"s":1,"f":"Danh mục 3 mục có đường dẫn đến website bảo tàng, tìm lại được."},{"s":1.5,"f":"Đủ phần, khoảng 1.000 từ; nhiều đường dẫn dài chen giữa nội dung gây rối; nên hạn chế gạch đầu dòng, trình bày theo đoạn văn."},{"s":0.5,"f":"Toàn bộ hình lấy từ internet (có link), không có ảnh tự chụp."}],"b":0,"adj":1.25,"fin":6.5,"fb":"Em làm tốt phần tìm hiểu và khai thác thông tin, có danh mục nguồn rõ ràng. Nếu đã ghi lý do chọn tham quan bảo tàng thì em nên có ảnh tự chụp; nếu em không đi thật, hãy ghi rõ lý do (bận lịch học, thời tiết...). Em cũng nên mô tả cụ thể hình ảnh từng tác phẩm (màu, bố cục, nhân vật), thêm loại hình khác ngoài tranh, cảm nhận riêng gắn với tác phẩm và hạn chế gạch đầu dòng."},"265040862":{"name":"Đinh Vũ Huyền Trang","it":[{"s":1,"f":"4 đối tượng, 4 loại hình (lụa, sơn dầu, điêu khắc, nền gạch), mỗi mục nêu lý do chọn theo sở thích."},{"s":0.75,"f":"Nền gạch tả cụ thể; ba tác phẩm còn lại mới có vài chi tiết (ghi nhận 0,75 vì bài đã gần giới hạn số từ)."},{"s":2,"f":"Đạt cả 3: nhớ tượng Thần vệ nữ, hoa văn gốm Việt, nền gạch gợi nhà em; chi tiết gồ ghề, nhẵn mượt được dùng để giải thích quyết định của nghệ nhân."},{"s":1.5,"f":"Sơn nữ và nền gạch tìm hiểu kỹ (bồi trước và vẽ trước, so với Kim Bạch, gốm Việt); Thôn quê và Chân dung gần như không có thông tin tác giả hay bối cảnh."},{"s":0.5,"f":"Danh mục có nguồn cho 2/4 tác phẩm; em nên bổ sung nguồn cho hai tác phẩm còn lại."},{"s":1.75,"f":"Đủ cấu trúc, khoảng 1.150 từ, mạch lạc; phần mở đầu chưa giới thiệu các tác phẩm sẽ phân tích ở phần sau (trừ nhẹ 0,25)."},{"s":1,"f":"Hình kèm nhãn chuẩn (tên, tác giả, năm, chất liệu, nơi lưu)."}],"b":0,"adj":0,"fin":8.5,"fb":"Em chọn đối tượng theo sở thích, nêu lý do rõ và tìm hiểu kỹ kỹ thuật bồi giấy của tranh lụa. Với ba tác phẩm còn lại, em nên tả thêm điều nhìn thấy (vẽ gì, màu nào, bố cục ra sao, tượng có đặc điểm khuôn mặt thế nào), tìm thêm thông tin tác giả và bối cảnh cho Thôn quê và Chân dung, và bổ sung nguồn cho hai tác phẩm còn lại. Ở phần mở đầu, em nên giới thiệu ngắn gọn các tác phẩm sẽ phân tích."},"265054031":{"name":"Hoàng Hạo Quân","it":[{"s":0.5,"f":"3 tác phẩm, 3 loại hình (sơn mài, tượng đồng, lụa); mục \"Lý do chọn\" chỉ liệt kê tên, không nêu lý do."},{"s":0.5,"f":"Câu tả Vườn xuân (\"Bức tranh của bạn…\") và các đoạn tả có văn phong như dán từ nguồn khác, nên không tính là quan sát của em; tượng chỉ nói \"hình khối mạnh mẽ\"; Tuổi mười bốn có áo dài trắng, màu vàng nâu nhưng ngắn."},{"s":0.5,"f":"Cảm nhận chung (\"rung cảm mạnh mẽ\") ở kết luận, không gắn chi tiết tác phẩm."},{"s":1,"f":"Có tác giả, kích thước, năm, danh hiệu Vườn xuân; chủ yếu số liệu."},{"s":0,"f":"Không có mục tài liệu tham khảo nên TC5 được 0 điểm. Chỉ ghi \"Wikipedia\", \"Google\" dưới ảnh, không danh mục."},{"s":1,"f":"Trình bày nhiều chỗ khó đọc chữ (chữ in hoa toàn bài), có câu viết như hướng dẫn; khoảng 800 từ, hợp lệ nhưng bố cục sơ sài."},{"s":0.5,"f":"Phần lớn hình lấy từ nguồn ngoài (Wikipedia, Google), chỉ ảnh bảo tàng tự chụp."}],"b":0,"adj":2.25,"fin":6.25,"fb":"Em chọn được 3 tác phẩm đủ loại hình. Em nên nêu lý do chọn, tự tả những gì em nhìn thấy trên từng tác phẩm bằng lời của mình, ghi nguồn cụ thể, dùng ảnh tự chụp và viết chữ thường. Em nên lập mục Tài liệu tham khảo ở cuối bài (tên tài liệu, tác giả, đường dẫn)."},"265010812":{"name":"Nguyễn Lê Thủy Tiên","it":[{"s":1,"f":"Đủ số tác phẩm, đa dạng, có lý do chọn."},{"s":1,"f":"Phần Quan sát tả bảng thông báo, thang máy... khá cụ thể, nhưng một vài tác phẩm chỉ tả màu hoặc đề tài, thiếu bố cục hoặc chất liệu."},{"s":1.5,"f":"Cảm nhận gắn chi tiết ở nhiều mục nhưng ít lý do và ít liên hệ trải nghiệm riêng."},{"s":2,"f":"Có bối cảnh, ý nghĩa và tìm hiểu thêm thông tin ngoài phần thuyết minh (được ghi nhận 2đ)."},{"s":1,"f":"Có danh sách đường dẫn, rõ ràng."},{"s":1.5,"f":"Khoảng 2.400 từ, vượt quá giới hạn nên tiêu chí này tối đa 1,5."},{"s":1,"f":"Ảnh tự chụp, có chú thích."}],"b":0,"adj":0,"fin":9.0,"fb":"Bài của em có nhiều ảnh tự chụp, phần quan sát khá cụ thể (bảng thông báo, thang máy, kiến trúc) và có danh sách đường dẫn rõ ràng. Em cũng tìm hiểu thêm thông tin ngoài phần thuyết minh, đó là điểm đáng ghi nhận. Phần cảm nhận hiện còn khá chung, có thể áp vào nhiều tác phẩm khác; em nên chỉ rõ chi tiết nào trong tác phẩm khiến em có cảm xúc đó, vì sao, và gắn với trải nghiệm hay ngành học của em để bài có dấu ấn riêng hơn. Em cũng nên bổ sung bố cục, chất liệu cho các tác phẩm còn thiếu và rút gọn bài về 800 đến 1.100 từ. Em đã khai báo công cụ hỗ trợ, hãy tiếp tục ghi rõ như vậy ở các bài sau. Nhìn chung đây là một bài làm nghiêm túc và có đầu tư."},"265034390":{"name":"Phan Nguyễn Bích Trâm","it":[{"s":1,"f":"4 đối tượng (gò nhôm, sơn dầu, đá, kính màu), 3 loại hình, mỗi mục nêu điều thu hút em."},{"s":1,"f":"4/4 đối tượng có chi tiết cụ thể: vàng đồng và mảng nổi của gò nhôm; 6 cô gái, hoa lan tím, hai nửa ánh sáng trong Đồng đội; vòm đá, nếp sóng, bóng đổ ở Hạnh phúc; khung gỗ, ô kính màu, hoa hồng ở cửa vòm."},{"s":2,"f":"Đạt cả 3 phép thử ở nhiều tác phẩm: hoa lan tím làm điểm hy vọng, vòm đá gợi mái nhà che chở, nhôm cứng mà diễn tả sóng mềm; có so sánh xem qua điện thoại với xem trực tiếp."},{"s":1,"f":"Chủ yếu tên tác giả, chất liệu, kích thước; gần như không có bối cảnh sáng tác hay vị trí trong lịch sử mỹ thuật."},{"s":0,"f":"Không có mục tài liệu tham khảo nên TC5 được 0 điểm; chỉ ghi nguồn iVIVU dưới ảnh phần giới thiệu bảo tàng."},{"s":1.5,"f":"Bố cục đủ nhưng khoảng 1.830 từ, vượt 1.210 nên tiêu chí này tối đa 1,5; bìa ghi nhầm \"Giữa kỳ\"."},{"s":1,"f":"Hình tự chụp cho từng đối tượng, chú thích có tên tác phẩm, tác giả, chất liệu."}],"b":0,"adj":0,"fin":7.5,"fb":"Em quan sát rất kỹ và có chọn lọc: màu, mảng khối, ánh sáng và cách trưng bày đều được mô tả cụ thể, cảm nhận riêng rõ ràng. Em nên tìm thêm bối cảnh sáng tác của từng tác phẩm, lập mục Tài liệu tham khảo ở cuối bài, rút gọn bài về khoảng 1.100 từ và sửa lại bìa (không ghi \"Giữa kỳ\")."},"265154073":{"name":"Lê Thanh Khiết","it":[{"s":0.5,"f":"Mới có 1 tác phẩm phù hợp rõ ràng (Vườn xuân Trung Nam Bắc); em nên chọn thêm tranh, tượng để đủ 3–4 đối tượng."},{"s":0.5,"f":"Chủ yếu tiểu sử; mô tả tác phẩm chỉ có câu chung (\"màu sắc rực rỡ, đường nét tinh xảo\") và nội dung hai bài thơ."},{"s":0.5,"f":"Cảm nhận chung (\"vô cùng xúc động\", \"mở mang tầm mắt\"), không nêu chi tiết nhìn thấy và lý do."},{"s":1,"f":"Tiểu sử ba tác giả khá đầy đủ nhưng gần như không có thông tin về bản thân tác phẩm."},{"s":0.5,"f":"Chỉ ghi \"Google\", không đường dẫn."},{"s":1.5,"f":"Khoảng 1.650 từ, vượt 1.210; font chữ lộn xộn, màu sắc chưa đồng nhất, còn link tham khảo nằm trong chữ."},{"s":0.75,"f":"Có hình tự chụp, chú thích ghi \"ảnh tự chụp\", thiếu tên tác phẩm ở một số hình."}],"b":0,"adj":1.25,"fin":6.5,"fb":"Em nên chọn thêm tranh, tượng để đủ 3–4 tác phẩm và tả hình ảnh Vườn xuân bằng chi tiết em thấy. Em nên giảm tiểu sử, viết phần mở đầu, kết luận bằng lời của riêng mình, ghi nguồn cụ thể (không để link trong chữ), và thống nhất font chữ, màu sắc."},"265046372":{"name":"Lê Nguyễn Huy","it":[{"s":1,"f":"Tranh, tượng, bảng chỉ dẫn, kiến trúc (kính màu), có nêu lý do chọn bảo tàng."},{"s":0.5,"f":"Bảng chỉ dẫn (đỏ, tím, hình học) và khung cửa kính màu hoa hồng có chi tiết; ba bức tranh chỉ nói \"màu tươi sáng\", \"đường nét tự do\", \"sắc vàng\"; Đêm giao liên không tả hình ảnh."},{"s":1,"f":"Chỉ Ra khỏi nỗi buồn gắn cảm xúc với sắc vàng và liên hệ riêng; hai tranh còn lại là xúc động chung."},{"s":0.5,"f":"Gần như không có thông tin tìm hiểu: chỉ có tên tác giả và một năm; thiếu chất liệu, bối cảnh."},{"s":0,"f":"Không có mục tài liệu tham khảo nên TC5 được 0 điểm. Chỉ có link thô, không gắn với nội dung nào; không có danh mục tài liệu."},{"s":1.5,"f":"Khoảng 1.100 từ, đủ phần; một vài trang bị mất hình."},{"s":0.75,"f":"Ảnh lấy ngoài (Vinwonders, Sivicmc) xen ảnh tự chụp; nguồn chỉ ghi tên miền hoặc link."}],"b":0,"adj":1.75,"fin":7.0,"fb":"Em bổ sung tác giả, chất liệu, bối cảnh cho từng tranh; tả cụ thể màu, bố cục thay vì cảm nhận chung; ghi nguồn đầy đủ. Em nên lập mục Tài liệu tham khảo ở cuối bài và kiểm tra lại các trang bị mất hình."},"265043440":{"name":"Nguyễn Hùng Vĩ","it":[{"s":1,"f":"Đủ 4 đối tượng, 3 loại hình (điêu khắc, sơn mài, tranh lụa), có nêu lý do chọn bảo tàng."},{"s":1,"f":"Giao Điểm và Tiên Đông tả thép mảnh, đan chéo, khối nổi chìm; Vườn xuân mới tả kỹ thuật và đề tài; Nương ngô chỉ kể ruộng ngô và người dân tộc, chưa tả màu hay bố cục."},{"s":1.5,"f":"Có chi tiết và cách giải thích riêng (khoảng trống như \"nhịp thở\"), nhưng nhiều câu cảm nhận mang giọng chung (\"tình yêu quê hương tha thiết\") và thiếu liên hệ cá nhân."},{"s":1.5,"f":"Có bối cảnh sáng tác, kỹ thuật, nguồn cảm hứng; còn vài nhận định chưa giải thích (\"tầm vóc thế giới\") và Nương ngô chưa nêu kỹ thuật lụa."},{"s":1,"f":"Danh mục theo từng tác phẩm, gồm báo, hồ sơ di sản, sách có NXB."},{"s":1.75,"f":"Đủ phần, khoảng 1.090 từ, mạch lạc; phần mở đầu chưa giới thiệu các tác phẩm sẽ phân tích ở phần sau (trừ nhẹ 0,25)."},{"s":0.5,"f":"Hình rõ, có tên tác phẩm, tác giả, loại hình nhưng thiếu chú thích đầy đủ và địa điểm chụp (trừ nhẹ 0,5)."}],"b":0,"adj":0,"fin":8.25,"fb":"Bài có cấu trúc tốt, nguồn tài liệu theo từng tác phẩm rõ ràng và nhiều thông tin bối cảnh. Em nên giải thích lý do chọn từng tác phẩm, mô tả Nương ngô và Vườn xuân bằng chi tiết nhìn thấy (màu, bố cục), chú thích hình đủ tên, tác giả, loại hình và địa điểm chụp, và giới thiệu ngắn gọn các tác phẩm ở phần mở đầu."},"265043454":{"name":"Trần Yến Vy","it":[{"s":0.75,"f":"4 đối tượng đều là hội họa (một mục chỉ là bảng thông tin Vườn xuân) nên mức 0,75; lý do chọn có ghi (\"thu hút mắt em\")."},{"s":1,"f":"Không đề và Giặc đốt làng tả rất cụ thể (3 tầng xanh dương, khung vuông, bàn tay mờ; mẹ cõng con, mảng trắng như màu sáp); Cậu bé tóc vàng còn chung; Vườn xuân chỉ tả tấm bảng, không tả tranh."},{"s":1.5,"f":"Chi tiết và lý do rõ ở khung vuông đầu người cô lập, đôi mắt; ở bảng thông báo chỉ nói \"ấn tượng\"; góc nhìn riêng chỉ có ở kết luận."},{"s":1,"f":"Chủ yếu tiểu sử tác giả và kích thước, chưa kết nối với việc hiểu tranh; Giặc đốt làng 1954 chưa nêu bối cảnh."},{"s":0.5,"f":"Chỉ ghi \"Gemini\", \"VNExpress\", \"Studocu\" chung chung, không thể biết thông tin nào lấy từ đâu."},{"s":1.5,"f":"Đủ phần, khoảng 1.400 từ, vượt 1.210 nên tiêu chí này tối đa 1,5."},{"s":0.75,"f":"Hình tự chụp có chú thích, riêng Hình 10 lấy từ nguồn ngoài (ghi nguồn) nên mức 0,75."}],"b":0,"adj":1.75,"fin":8.75,"fb":"Phần tả Không đề và Giặc đốt làng rất cụ thể, và em có cảm nhận riêng cho từng tranh. Em nên chọn thêm loại hình khác ngoài tranh, tả trực tiếp bức Vườn xuân, và ghi nguồn rõ từng thông tin."},"265042760":{"name":"Võ Xuân Hiếu","it":[{"s":1,"f":"3 đối tượng (kiến trúc cửa kính màu, 2 tranh), 2 loại hình; có nêu lý do chọn tranh (con mắt lạ, trái ổi có bóng đổ)."},{"s":0.5,"f":"Mỗi đối tượng chỉ có một chi tiết ngắn (ô kính màu, con mắt giữa tranh, bóng đổ trái ổi); chưa tả màu cụ thể, bố cục hay hình khối nên chỉ đạt khoảng 1/2 mức cụ thể."},{"s":0.5,"f":"Chỉ dừng ở \"thú vị\", \"độc lạ\", \"bắt mắt\"; không nói chi tiết nào gợi suy nghĩ gì, không có lý do."},{"s":0.5,"f":"Gần như không có thông tin tác giả, năm, chất liệu hay bối cảnh ngoài tên tác phẩm."},{"s":0.5,"f":"Chỉ ghi nguồn cho phần mở đầu; thông tin về tác phẩm không ghi nguồn."},{"s":1,"f":"Chỉ khoảng 590 từ, thiếu so với 720; mở đầu và kết luận ngắn; nên hạn chế gạch đầu dòng, trình bày theo đoạn văn."},{"s":0.5,"f":"Có ảnh tự chụp nhưng chú thích chưa đủ tên tác phẩm, tác giả theo từng hình."}],"b":0,"adj":2.0,"fin":6.5,"fb":"Em chọn được 3 đối tượng thuộc 2 loại hình và có ảnh tự chụp. Em nên mô tả cụ thể hơn (màu gì, bố cục ra sao), tìm hiểu tác giả và bối cảnh, ghi nguồn cho từng thông tin và viết dài hơn. Em cũng nên hạn chế gạch đầu dòng, trình bày theo đoạn văn."},"265045369":{"name":"Nguyễn Đào Thu Linh","it":[{"s":1,"f":"Kiến trúc, hội họa, điêu khắc; có nêu lý do chọn bảo tàng."},{"s":1,"f":"Mô tả khá cụ thể: vàng kem, cửa vòm, ban công sắt, ngói âm dương đỏ cam, kỹ thuật thếp vàng, vỏ trứng ở Vườn xuân. Nhưng đây là mô tả qua ảnh và tư liệu, chưa tả bố cục chi tiết."},{"s":0.5,"f":"Phần \"Cảm nhận và liên hệ\" chung (\"dung hợp Đông - Tây tinh tế\"); không phải trải nghiệm trước tác phẩm."},{"s":1.5,"f":"Mục \"Tìm hiểu\" có năm, kiến trúc sư, vật liệu, kỹ thuật cho từng đối tượng."},{"s":0.5,"f":"Danh mục chỉ ghi tên miền, không có bài hoặc trang cụ thể."},{"s":1.5,"f":"Khoảng 1.700 từ, vượt quy định nên tiêu chí này tối đa 1,5; cấu trúc rõ."},{"s":0.75,"f":"Toàn bộ ảnh lấy ngoài, có ghi nguồn (VnExpress, GTrip, Artlive...)."}],"b":0,"adj":1.75,"fin":8.5,"fb":"Đề yêu cầu tham quan trực tiếp và dùng ảnh tự chụp. Em nên đến bảo tàng, quan sát tác phẩm thật và ghi lại cảm nhận của riêng mình."},"265013465":{"name":"Trần Châu Thanh Lam","none":1},"265043398":{"name":"Lâm Trần Gia Hân","it":[{"s":1,"f":"4 đối tượng, 4 loại hình (tranh, tem đồ họa, tượng, kiến trúc), có mục \"Lý do chọn các tác phẩm\"."},{"s":0.75,"f":"Mỗi đối tượng mới có vài chi tiết ngắn; em nên mô tả thêm chất liệu, cách vẽ (ghi nhận 0,75)."},{"s":1.5,"f":"Mỗi tác phẩm có \"Ấn tượng ban đầu\" và \"Cảm nhận sau cùng\": đôi mắt Bác, xanh trầm, dáng hiên ngang; lý do chưa sâu và chưa có liên hệ bản thân."},{"s":1.5,"f":"Chân dung Bác (dựa ảnh của Vũ Năng An) và tem Nguyễn Sáng (1946) có thông tin kết nối rõ; tượng Biên giới và cửa kính màu không có thông tin."},{"s":1,"f":"Danh mục 3 đường dẫn cụ thể, tìm lại được."},{"s":1.75,"f":"Đủ phần, khoảng 1.000 từ, mạch lạc nhưng dùng nhiều gạch đầu dòng, nên trình bày theo đoạn văn (còn 1,75)."},{"s":0.75,"f":"Hình đánh số, chú thích tên, tác giả; Hình 9, 10 (ảnh tập thể) lấy từ UEF có ghi nguồn nên mức 0,75."}],"b":0.25,"adj":0,"fin":8.5,"fb":"Bài gọn, đủ cấu trúc, nguồn rõ và cảm nhận chân thật. Em nên mô tả nhiều hơn điều nhìn thấy trong tranh, tượng và cửa kính (màu cụ thể, bố cục, đường nét, chất liệu, cách vẽ) ngoài đối tượng chính. Em cũng nên tìm thêm thông tin về tượng Biên giới và cửa kính màu, trình bày theo đoạn văn thay vì gạch đầu dòng, và giới thiệu ngắn gọn các tác phẩm ở phần mở đầu."},"265048167":{"name":"Phan Tô Thiện Duyên","it":[{"s":1,"f":"Nhiều đối tượng đa dạng: kiến trúc, hoa sắt, phù điêu, gốm trừu tượng; có nêu lý do chọn bảo tàng."},{"s":1,"f":"Tả cụ thể ánh đèn hắt lên tường vàng, mảng sáng tối, chữ H.B.H lồng vào đường uốn; phù điêu màu nâu trầm, nét đục; Bầu trời xanh tả bề mặt như đất sét, vệt cọ bản to."},{"s":2,"f":"Đạt cả 3: đường cong hòa chữ H.B.H, ánh đèn hắt lên tường, vết chai trên bàn chân; có câu hỏi riêng về cách nghệ nhân làm; liên hệ Byzantine và kỷ niệm riêng."},{"s":1,"f":"Có thông tin từ thuyết minh (Hứa Bổn Hòa), liên hệ Byzantine, nguyên thủy; ít kiến thức ngoài, nhiều chỗ chỉ nêu cảm giác."},{"s":0,"f":"Không có mục tài liệu tham khảo nên TC5 được 0 điểm; chưa ghi rõ nguồn thuyết minh."},{"s":1.75,"f":"Khoảng 2.000 từ nhưng trình bày chỉn chu, liên kết tốt (không áp trần số từ); còn gạch đầu dòng, nên trình bày theo đoạn văn (còn 1,75)."},{"s":1,"f":"Ảnh tự chụp rõ."}],"b":0.25,"adj":0,"fin":8.0,"fb":"Quan sát tinh tế, hình chụp đẹp, trình bày chỉn chu, có sự đầu tư và các phần liên kết với nhau. Em nên tìm thêm thông tin ngoài phần thuyết minh (tác giả, bối cảnh sáng tác, ý nghĩa), lập mục Tài liệu tham khảo, hạn chế gạch đầu dòng mà trình bày theo đoạn văn, và rút gọn bài về khoảng 1.100 từ."},"265027600":{"name":"Ngô Quang Tử Trực","it":[{"s":1,"f":"5 đối tượng, 3 loại (điêu khắc, tranh, tĩnh vật), có mục \"Lý do chọn\" và nêu ấn tượng cho từng tác phẩm."},{"s":1,"f":"3 tranh tả cụ thể (nếp nhăn người cha ở giữa không gian trống; giỏ tre, cá, rau chồng lớp; nền tối, ánh sáng rọi vào siêu thuốc, gốm thô sần); 2 tượng Tâm và Giao Điểm chỉ nói \"tối giản\", \"kim loại cứng cáp\", chung chung."},{"s":1.5,"f":"Siêu thuốc và chén đá (vuông tròn đan xen) gợi cảm giác vững chãi, hoài niệm: đủ chi tiết, lý do, góc nhìn riêng; các tác phẩm khác chỉ mới \"bình yên pha suy tư\"; kết luận viết chung."},{"s":1,"f":"Chủ yếu tên tác giả, năm, ý niệm Thiên - Địa - Nhân; mô tả hai tượng nghe như thuyết minh bảo tàng nên chưa tính là bằng chứng."},{"s":0.5,"f":"Có trang nguồn ảnh nhưng thông tin về tác phẩm không ghi nguồn."},{"s":1.5,"f":"Đủ phần, khoảng 880 từ, trình bày hấp dẫn; còn vài lỗi chính tả."},{"s":0.75,"f":"Hình tự chụp có chú thích, hình tranh sơn dầu và logo lấy từ website bảo tàng (ghi nguồn) nên mức 0,75."}],"b":0,"adj":0,"fin":7.25,"fb":"Bài trình bày đẹp, hấp dẫn, có sự đầu tư nghiêm túc: hình chụp thu hút và cách trình bày dẫn dắt người xem đi từ không gian bảo tàng đến từng tác phẩm. Em tả ba bức tranh rất cụ thể về bố cục và ánh sáng. Em nên tả hai bức tượng bằng cái nhìn của riêng mình thay vì theo lời thuyết minh, ghi nguồn cho thông tin và soát lại chính tả."},"265144983":{"name":"Đinh Bảo Ngọc","it":[{"s":1,"f":"Nhiều đối tượng đủ loại hình (tượng, kiến trúc, tranh sơn mài, đồ họa, đồ thờ), có nêu lý do chọn bảo tàng."},{"s":0.5,"f":"Kể tên khoảng 10 đối tượng nhưng chỉ cửa vòm sắt (chữ HBH, câu đối đá đỏ) và Người mẹ miền Nam (màu rực lửa ở giữa, vệt sáng vàng, trắng, xanh ở đỉnh) tả cụ thể; các mục còn lại là câu văn hoa như \"uyển chuyển\", \"thoát tục\", \"mềm mại\"."},{"s":1,"f":"Có chi tiết ở vàng bạc vỏ trứng, tượng nai đồng; lý do mỏng và nặng văn hoa (\"rung cảm mạnh mẽ\", \"lịch sử sống lại\"); thiếu liên hệ riêng."},{"s":1,"f":"Có kỹ thuật mài sơn mài, HBH và câu đối, khảm xà cừ nhưng nhiều đối tượng chỉ có tên; tên \"Quách Đàm\" và năm 1930 cần kiểm tra."},{"s":0,"f":"Không ghi nguồn cho thông tin đã tham khảo."},{"s":1,"f":"Khoảng 1.300 từ, vượt 1.210 nên tiêu chí này tối đa 1,5; nhiều lỗi chính tả, mục lục lặp \"II\", bố cục rối."},{"s":0.5,"f":"Hình thiếu chú thích tên tác phẩm, tác giả."}],"b":0,"adj":2.25,"fin":7.25,"fb":"Em quan sát được nhiều thứ trong bảo tàng, và phần cửa vòm sắt, Người mẹ miền Nam tả rất tốt. Em nên chọn ít đối tượng hơn (3–4) để tả kỹ, bỏ bớt câu văn hoa, ghi nguồn và kiểm tra chính tả."},"265038326":{"name":"Mạc Trần Bảo Trâm","it":[{"s":1,"f":"3 tác phẩm (tranh lụa, khắc gỗ, in thạch bản), 2 loại hình (hội họa, đồ họa), có nêu lý do."},{"s":0.5,"f":"Mỗi mục \"Quan sát\" ngắn và dùng tính từ (\"màu mềm mại, mờ ảo như sương mai\", \"nét khắc mạnh mẽ\", \"đường nét đơn giản, đen trắng\"); chỉ có nội dung (cô gái dân tộc, người vợ tiễn chồng, ba người nghe radio), chưa tả màu, bố cục cụ thể."},{"s":1,"f":"Mỗi mục có một câu cảm nhận ngắn (\"giản dị, trong sáng\", \"hy sinh thầm lặng\"), chưa nêu chi tiết nào gây ra và vì sao."},{"s":1.5,"f":"Có năm, kỹ thuật in thạch bản, vai trò Tú Duyên với khắc gỗ, bối cảnh 1954; Sơn Nữ còn chung."},{"s":0.5,"f":"Danh mục chung chung (\"thông tin tại bảo tàng\", \"google, Wikipedia\")."},{"s":1.5,"f":"Đủ phần, khoảng 1.000 từ; có đoạn nhắc \"Mẹ địu con\" không khớp tác phẩm trình bày."},{"s":0.75,"f":"Ảnh tác phẩm tự chụp, ảnh tác giả lấy từ Google có ghi nguồn nên mức 0,75."}],"b":0,"adj":0.75,"fin":7.5,"fb":"Bài có cấu trúc Quan sát, Tìm hiểu, Cảm nhận rõ và cảm nhận chân thành. Em nên tả cụ thể hơn (màu nào, nét ra sao, bố cục thế nào), sửa đoạn \"Mẹ địu con\" cho khớp và ghi nguồn rõ."},"265054486":{"name":"Nguyễn Thành Tài","it":[{"s":0.5,"f":"3 tác phẩm (tranh, tượng cổ) và kiến trúc, nhưng bài không nêu lý do chọn bảo tàng hay từng tác phẩm."},{"s":0.5,"f":"Tượng Phật Champa (đầu mất, kiết già, tay chắp ấn) và kiến trúc (đối xứng, gạch bông, đèn chùm) tả cụ thể; Thanh niên thành đồng chỉ nói tinh thần; chú thích \"Người mẹ - Vũ Lăng\" nhưng lời tả ghi \"Mẹ\" của Nguyễn Sáng nên chưa xác nhận được."},{"s":0.5,"f":"Dùng chung một kết (biết ơn thế hệ đi trước) cho nhiều tác phẩm; thay tên tác phẩm khác vào vẫn đúng."},{"s":0.5,"f":"Chỉ có tên tác phẩm, tác giả (có chỗ nhầm) và niên đại tượng Champa; không có bối cảnh hay kỹ thuật."},{"s":0,"f":"Không có nguồn tham khảo."},{"s":1.5,"f":"Đủ mục lục, mở, thân, kết nhưng bìa ghi \"Giữa kỳ\", nhiều lỗi chính tả (\"en hiểu\"), chữ trên slide rời rạc."},{"s":0.5,"f":"Chú thích chỉ ghi tên tác phẩm, tác giả; chưa rõ nguồn hình."}],"b":0,"adj":3.0,"fin":7.0,"fb":"Em tả tượng Phật Champa và kiến trúc bảo tàng rất tốt. Em nên kiểm tra lại tên tác phẩm và tác giả, nêu lý do chọn, tìm hiểu bối cảnh và ghi nguồn tham khảo."},"265034449":{"name":"Hoàng Ngọc Minh Quân","it":[{"s":1,"f":"Kiến trúc, 3 tranh và 3 tượng đồng của Diệp Minh Châu, đủ loại hình, có nêu lý do chọn bảo tàng."},{"s":1,"f":"Kiến trúc tả cụ thể (vàng kem, nâu đỏ, gạch lát hình học, hành lang khung cửa lặp); ba tranh và ba tượng chỉ tả chung theo nhóm (\"mảng màu trầm ấm, tương phản sáng tối\", \"đồng nâu trầm, thô ráp\")."},{"s":1,"f":"Cảm nhận ngôi \"tôi\" về yên bình trước tượng, ánh sáng trưng bày là riêng, nhưng ít gắn với chi tiết và lý do cụ thể; phần lớn nhận xét chung."},{"s":1,"f":"Ít thông tin về từng tranh (tên, tác giả); thông tin nằm ở phần kiến trúc."},{"s":0.5,"f":"Trích nguồn ngay trong bài, không có danh mục tài liệu."},{"s":1.5,"f":"Đủ phần nhưng khoảng 1.500 từ, vượt 1.210 nên tiêu chí này tối đa 1,5."},{"s":0.75,"f":"3 tranh tự chụp, một số hình ngoài có ghi nguồn nên mức 0,75."}],"b":0,"adj":0.75,"fin":7.5,"fb":"Phần tả kiến trúc rất tốt và em có cảm nhận riêng. Với tranh và tượng, em nên tả riêng từng tác phẩm thay vì gộp nhóm, thêm thông tin tác giả và lập danh mục nguồn."},"265041267":{"name":"Dương Tấn Phát","it":[{"s":1,"f":"4 tác phẩm (tranh, tượng, chân dung chì, ký họa) cùng kiến trúc, đủ loại hình, có nêu lý do chọn."},{"s":1,"f":"Thôn quê (xanh rêu, vàng đất, điểm tụ ở hàng cây, con trâu, mái tranh), chân dung Guinée (chì trên giấy kraft, gò má, môi, áo trắng) và ký họa (tỉ lệ 6 đầu, nâu xanh lá) tả cụ thể; tượng Tardieu chỉ nói \"khối đồng trang trọng, mặt tỉ mỉ\"."},{"s":1,"f":"Mục \"Liên hệ bản thân\" nêu điều đã hiểu thêm (kiến thức), chưa nói cảm nhận riêng từ chi tiết nhìn thấy."},{"s":1,"f":"Có thông tin họa sĩ (Wikipedia) và Victor Tardieu (VnExpress) nhưng chủ yếu liệt kê, ít nối với việc hiểu tác phẩm."},{"s":0.5,"f":"Chỉ ghi tên \"Wikipedia\", \"vnexpress, miavn\", \"AI Gemini\", không đường dẫn."},{"s":1.5,"f":"Đủ phần nhưng khoảng 1.330 từ, vượt 1.210 nên tiêu chí này tối đa 1,5; có lỗi chính tả."},{"s":0.75,"f":"Hình tự chụp, riêng một số hình ngoài có ghi nguồn nên mức 0,75."}],"b":0,"adj":1.25,"fin":8.0,"fb":"Em chia mục màu sắc, bố cục, đường nét rất rõ và tả tranh Thôn quê tốt. Em nên tả tượng Tardieu bằng chi tiết gương mặt, ghi nguồn cụ thể và rút gọn bài."},"265053285":{"name":"Nguyễn Khánh Như","it":[{"s":1,"f":"Nhiều đối tượng đủ loại hình (tranh, hiện vật gốm, poster đồ họa, kiến trúc), có mục \"Lý do chọn\"."},{"s":1,"f":"Morning, poster giữ xe và bình vôi đều tả cụ thể bằng mục Đặc điểm tạo hình và Màu sắc (vàng cam trên, nâu đỏ dưới, bò mờ; tông đỏ nâu, khung chữ nhật, loa; thân phình, miệng nhỏ, quai cong, bề mặt thô)."},{"s":2,"f":"Mỗi đối tượng đều có cảm nhận gắn chi tiết (mảng vàng cam, con bò, quai bình, hoa văn gạch), có lý do và góc nhìn riêng (tranh trừu tượng vẫn truyền cảm xúc; thiết kế tốt phải truyền thông tin rõ)."},{"s":1.5,"f":"Có tác tác giả, năm, chất liệu cho từng đối tượng; em nên tìm thêm bối cảnh sáng tác."},{"s":1,"f":"Có danh mục đường dẫn (website bảo tàng, Facebook, Wikipedia) tìm lại được, nhưng chưa chỉ rõ thông tin nào từ nguồn nào."},{"s":2,"f":"Thiết kế đẹp, chỉn chu; khoảng 1.400 từ vượt nhẹ nhưng được du di nên đạt 2."},{"s":1,"f":"14 hình tự chụp, chú thích đủ \"Hình n. tên (tự chụp)\"."}],"b":0,"adj":0,"fin":9.5,"fb":"Bài trình bày đẹp, chỉn chu và bắt mắt, hình chụp rất đẹp và rõ, thể hiện sự đầu tư và tâm huyết của em. Phần quan sát chia rõ hình ảnh, tạo hình, màu sắc nên rất dễ theo dõi. Em nên tìm thêm bối cảnh sáng tác và thông tin giải thích cho từng tác phẩm, đồng thời ghi rõ thông tin nào lấy từ nguồn nào."},"265400187":{"name":"Võ Ngọc Tố Trinh","it":[{"s":1,"f":"3 tác phẩm, 3 loại hình (tượng đồng, tranh lụa, sơn mài), mỗi tác phẩm có lý do chọn."},{"s":0.5,"f":"Mỗi tác phẩm chỉ có một vài chi tiết chung (\"màu nhẹ nhàng\", \"màu nổi bật, vui tươi\", Bác ngồi xem báo); chưa tả màu cụ thể, bố cục, chất liệu hiện ra thế nào; phần lớn dung lượng là tiểu sử họa sĩ."},{"s":1.5,"f":"Tượng Bác và Mẹ địu con có góc nhìn riêng (đặt mình vào bé thiếu nhi); chi tiết gây cảm xúc còn chung (\"màu nhẹ nhàng\", \"nổi bật vui tươi\"); phần còn lại là tiểu sử."},{"s":1,"f":"Chủ yếu tiểu sử, giải thưởng họa sĩ; chỉ Vườn xuân có kết nối (20 năm sáng tác, ba miền)."},{"s":0.5,"f":"Chỉ ghi \"Google\", \"Wikipedia\", không đường dẫn."},{"s":1.5,"f":"Đủ phần nhưng khoảng 1.400 từ, vượt 1.210 nên tiêu chí này tối đa 1,5."},{"s":0.75,"f":"Hình tự chụp xen hình lấy từ Google, Wikipedia (có ghi nguồn) nên mức 0,75."}],"b":0,"adj":1.25,"fin":8.0,"fb":"Em chọn 3 tác phẩm thuộc 3 loại hình và nói được cảm xúc thật của mình. Em nên giảm phần tiểu sử, dùng thời gian tả màu, bố cục từng tác phẩm và ghi nguồn bằng đường dẫn cụ thể."},"265143423":{"name":"Đặng Quốc Phục","it":[{"s":1,"f":"Điêu khắc (Mùa săn, Suy tư), kiến trúc (cánh cửa) và bảng giới thiệu họa sĩ; nêu lý do ấn tượng."},{"s":1,"f":"Mùa săn, Suy tư, cánh cửa đều tả cụ thể: trục dọc, đục đẽo thô ráp giữ vân đá, người thợ đứng trên đầu thú; người ngồi thu mình, tay đan chặt, khăn vắt vai; hoa đan dây leo đối xứng."},{"s":1,"f":"Tay siết chặt như kìm nén, hoài niệm trước cánh cửa có chi tiết và lý do, nhưng số tác phẩm ít và chưa có góc nhìn riêng."},{"s":1.5,"f":"Có ý nghĩa, bối cảnh tạo hình (liên hệ tượng nhà mồ Tây Nguyên); nhận định chưa ghi nguồn."},{"s":0,"f":"Không có mục tài liệu tham khảo nên TC5 được 0 điểm. Không có danh mục; chỉ có bảng giới thiệu họa sĩ được nhắc là của bảo tàng."},{"s":1.75,"f":"Đủ phần, khoảng 950 từ, mạch lạc; còn vài lỗi chính tả nhỏ. Phần mở đầu chưa giới thiệu các tác phẩm sẽ phân tích ở phần sau (trừ nhẹ 0,25)."},{"s":0.5,"f":"Ảnh rõ nhưng không có chú thích tên tác phẩm, tác giả."}],"b":0,"adj":1.25,"fin":8.0,"fb":"Em quan sát kỹ và tả tượng rất cụ thể về tư thế, đường nét. Em nên chú thích tên tác phẩm, tác giả dưới mỗi hình, lập danh mục nguồn, và nói rõ thông tin tác giả của chính hai tượng em chọn. Em nên lập mục Tài liệu tham khảo ở cuối bài (tên tài liệu, tác giả, đường dẫn). Phần mở đầu, em nên giới thiệu ngắn gọn các tác phẩm sẽ phân tích."},"265021619":{"name":"Lê Tùng Dương","it":[{"s":1,"f":"Đủ 5 đối tượng, có điêu khắc/sơn mài/tranh, nêu lý do chọn."},{"s":0.5,"f":"Cảnh chiều và Mơ có tả màu, bố cục cụ thể; Ký ức Mậu Thân chủ yếu kể nội dung; Phật Khmer, Champa chỉ tả khái quát; Chân dung Bác chung chung. Chỉ khoảng 2/5 tác phẩm tả đủ chi tiết."},{"s":1,"f":"Cảm nhận gắn hình ảnh ở một số tranh nhưng thiếu lý do và liên hệ riêng; Chân dung Bác, Phật Khmer chỉ chung chung."},{"s":1,"f":"Có bối cảnh và ý nghĩa nhưng nhiều nhận định ngắn, chưa giải thích."},{"s":0.5,"f":"Nguồn chỉ nêu một lần ở phần mở đầu, không gắn với từng tác phẩm nên khó đối chiếu."},{"s":1.5,"f":"Đủ phần, khoảng 900 từ, trình bày gọn."},{"s":1,"f":"Ảnh tự chụp, rõ, có chú thích."}],"b":0,"adj":1.25,"fin":7.75,"fb":"Em nên tả thêm màu, bố cục, chất liệu cho Phật Khmer, Champa và Chân dung Bác (hiện chỉ nêu khái quát) và ghi nguồn gắn với từng tác phẩm."},"265045023":{"name":"Trần Thị Mộng Tuyền","it":[{"s":1,"f":"4 đối tượng, 3 loại hình (tranh phấn, sơn dầu, tượng đồng, kiến trúc), có nêu lý do chọn."},{"s":1,"f":"Thiếu Nữ, tượng Phụ nữ Nam Bộ (gò má, chân mày, mắt nghiêng, khăn rằn thắt nút) và cầu thang xoắn tả rất cụ thể; Tâm Sự còn chung (\"đường nét uyển chuyển, tông màu nhấn nhá\"), chưa nói màu nào, dáng ra sao."},{"s":1.5,"f":"Dáng ngồi bó gối gợi sự rụt rè, xoắn ốc tăng chiều sâu thị giác có chi tiết và lý do; còn thiếu liên hệ với trải nghiệm riêng và có chỗ phỏng đoán (khăn rằn)."},{"s":0.5,"f":"Chỉ có tên tác giả và năm; không có bối cảnh, tiểu sử hay kỹ thuật. Nhận định \"gần tỉ lệ vàng\" chưa có căn cứ."},{"s":0,"f":"Không có mục tài liệu tham khảo nên TC5 được 0 điểm. Chỉ ghi nguồn vntrip.vn dưới Hình 1; không có danh mục tài liệu."},{"s":1.5,"f":"Đủ phần, khoảng 1.130 từ; câu dài, nhiều lỗi chính tả (\"xoắn óc\"), kết luận chung chung."},{"s":0.75,"f":"Chú thích theo mẫu tên, tác giả, năm; Hình 1 lấy từ nguồn ngoài có ghi nguồn nên mức 0,75."}],"b":0,"adj":1.75,"fin":8.0,"fb":"Em quan sát tượng đồng và tranh Thiếu Nữ rất tỉ mỉ. Em nên tìm hiểu thêm tác giả và bối cảnh, ghi nguồn đầy đủ, và rút gọn câu cho dễ đọc. Em nên lập mục Tài liệu tham khảo ở cuối bài (tên tài liệu, tác giả, đường dẫn)."},"265043836":{"name":"Trần Nguyễn Thanh Khoa","it":[{"s":1,"f":"Chọn 9 đối tượng (nhiều hơn 3–4), thuộc 3 loại hình (kiến trúc, trang trí, ấn phẩm đồ họa); chưa nêu lý do chọn từng đối tượng. Nhiều tác phẩm cùng loại ấn phẩm đồ họa nên em chỉ cần chọn lọc 1–2 tác phẩm để trình bày chi tiết."},{"s":0.5,"f":"Chỉ 3/9 đối tượng (khung cửa kính màu, đèn chùm, mặt tiền) được tả bằng chi tiết hình ảnh; 6 mục còn lại là bảng, biển, nội dung chủ yếu nói công dụng thông tin."},{"s":0.5,"f":"Mỗi mục có phần \"Cảm nhận\" nhưng xoay quanh sự tiện lợi hoặc \"sang trọng\" chung, không nêu chi tiết cụ thể và lý do."},{"s":0.5,"f":"Gần như không có thông tin về tác giả, bối cảnh hay lịch sử; chỉ có phần \"Công dụng\"."},{"s":0,"f":"Không có nguồn tham khảo."},{"s":1.5,"f":"Đủ bìa, mục lục, mở đầu, bốn phần, kết luận; bìa ghi nhầm \"Giữa kỳ\" và MSSV 256043836."},{"s":1,"f":"Ảnh tự chụp cho từng đối tượng, chú thích mô tả rõ vị trí."}],"b":0,"adj":1.25,"fin":6.25,"fb":"Em chụp ảnh đầy đủ và có bố cục bài rõ. Với nhóm ấn phẩm đồ họa, em nên chọn lọc 1–2 tác phẩm để trình bày chi tiết thay vì liệt kê nhiều; em nên thêm tranh, tượng, tả chi tiết nhìn thấy, tìm hiểu tác giả và bối cảnh, đồng thời ghi nguồn."},"265047918":{"name":"Nguyễn Lê Ngọc Diệp","it":[{"s":1,"f":"Ba loại hình (hội họa, đồ họa thông tin, kiến trúc) và có nêu lý do ở phần mở đầu."},{"s":1,"f":"Nhị Kiều tả cụ thể (tay đặt lên vai, nét mảnh, nền xanh nhạt, áo tím, trắng ngà); đồ họa và kiến trúc tả màu và hoa văn ở mức vừa, chưa rõ bố cục. Một tác phẩm rõ, hai tác phẩm trung bình."},{"s":1,"f":"Chỉ Nhị Kiều có cảm nhận gắn ánh mắt, nét vẽ; phần đồ họa và kiến trúc là cảm giác chung (\"cổ kính\", \"hiện đại\")."},{"s":1.5,"f":"Có tác giả, năm, chất liệu, kích thước, cảm hứng Truyện Kiều; kiến trúc có năm xây dựng. Chưa có bối cảnh trường phái."},{"s":0,"f":"Phần trích dẫn chỉ ghi ChatGPT, Google, Pinterest: là công cụ, không tìm lại được nguồn."},{"s":1,"f":"Khoảng 1.150 từ, đủ phần nhưng nhiều lỗi chính tả, diễn đạt; kích cỡ chữ chưa đồng nhất, còn nhiều gạch đầu dòng."},{"s":0.75,"f":"Phần lớn ảnh tự chụp có ghi chú; Hình 5 lấy ngoài, nguồn chỉ ghi \"Pictures\"."}],"b":0,"adj":1.75,"fin":8.0,"fb":"Em ghi nguồn cụ thể (tên tài liệu, tác giả, link) và soát lỗi chính tả. Với đồ họa và kiến trúc, em nên tả thêm bố cục, chất liệu. Em cũng nên cân chỉnh kích cỡ chữ cho đồng nhất, hạn chế gạch đầu dòng và trình bày theo đoạn văn."},"265021062":{"name":"Trần Bảo Trâm","it":[{"s":1,"f":"Đủ 3 đối tượng, 3 loại hình (tranh, điêu khắc hiện đại, điêu khắc Champa), có nêu lý do chọn; Champa là cả nhóm hiện vật chứ không phải một tác phẩm cụ thể."},{"s":0,"f":"0/3 đối tượng có chi tiết cụ thể: Cây cầu chỉ nói cây cầu \"dẫn mắt\", Giao Điểm chỉ suy từ tên gọi, Champa chỉ nêu cần chú ý đường nét, tư thế. Bài tự ghi chưa xem tận mắt."},{"s":1,"f":"Có suy nghĩ riêng về khoảng trống, màu tạo không khí (đạt phép thử góc nhìn) nhưng không chỉ ra chi tiết nhìn thấy nào gây ra cảm nhận, vì bài chưa xem tận mắt."},{"s":0.5,"f":"Chỉ có năm tiếp nhận của Giao Điểm và vài câu giới thiệu chung; không có bối cảnh sáng tác hay thông tin giúp hiểu tác phẩm."},{"s":0.5,"f":"Mỗi mục chỉ ghi nguồn ảnh (link), thiếu phần tài liệu tham khảo cho nội dung."},{"s":1.5,"f":"Đủ các phần, diễn đạt mạch lạc nhưng khoảng 1.350 từ, vượt 1.210 nên tiêu chí này tối đa 1,5."},{"s":0.5,"f":"Hình lấy từ nguồn ngoài (không tự chụp), chú thích chỉ ghi nguồn, chưa có tên tác phẩm, tác giả."}],"b":0,"adj":2.5,"fin":7.5,"fb":"Em trung thực khi nói mình chưa đến bảo tàng, và phần suy nghĩ về thiết kế rất đáng ghi nhận. Bài nên có thêm mô tả chi tiết cụ thể từng tác phẩm (màu nào, hình khối ra sao) và hình tự chụp có chú thích; em nên đến bảo tàng quan sát trực tiếp."},"265018728":{"name":"Lê Thị Ngọc Huyền","it":[{"s":1,"f":"Kiến trúc, hội họa, điêu khắc, gốm; có nêu lý do chọn họa sĩ Lê Thị Lựu."},{"s":0.75,"f":"Nhiều chỗ dùng từ chung (\"màu nhẹ nhàng\", \"bố cục hài hòa\") cho Nhị Kiều, Sơn nữ; chỉ Vườn xuân và gốm Biên Hòa có chi tiết về màu, men, hoa văn rồng. Phần kiến trúc là đoạn từ Gemini."},{"s":0.5,"f":"Chủ yếu \"bình yên\", \"dễ chịu\", \"hài hòa\"; thay tên tác phẩm khác vào vẫn đúng."},{"s":1.5,"f":"Có tiểu sử họa sĩ, năm, chất liệu lụa và thông tin từ hướng dẫn viên; một số tác phẩm chỉ nêu năm."},{"s":0,"f":"Không có mục tài liệu tham khảo nên TC5 được 0 điểm. Không có danh mục; nguồn rải rác (Wikipedia, Gemini, Pinterest) ghi ở cuối từng đoạn."},{"s":1.5,"f":"Khoảng 1.550 từ, vượt quy định nên tiêu chí này tối đa 1,5."},{"s":0.75,"f":"Ảnh tự chụp xen ảnh Pinterest, có ghi nguồn."}],"b":0,"adj":1.75,"fin":7.75,"fb":"Em thay các nhận xét chung (\"hài hòa\", \"nhẹ nhàng\") bằng chi tiết nhìn thấy: màu nào, đặt ở đâu, nét ra sao; thêm danh mục tài liệu. Em nên lập mục Tài liệu tham khảo ở cuối bài (tên tài liệu, tác giả, đường dẫn)."},"265025450":{"name":"Nguyễn Trần Hồng Hân","it":[{"s":0.75,"f":"Đủ 4–5 tác phẩm, có lý do chọn từng tác phẩm, nhưng tất cả đều thuộc hội họa (tranh sơn mài, sơn dầu), chưa có điêu khắc, kiến trúc hoặc đồ họa."},{"s":1,"f":"Mục Quan sát của Vì sự bình yên và Vườn xuân tả gam màu tương phản, bố cục ba tấm, vị trí nhân vật, nhịp điệu; các tác phẩm còn lại cũng cụ thể."},{"s":2,"f":"Đạt cả 3: sắc đỏ giữa tranh, người thương binh, tờ giấy như lá thư, khung cửa; có lý do và liên hệ bản thân (\"bình yên chưa bao giờ miễn phí\", sống có trách nhiệm hơn)."},{"s":1.75,"f":"Có tác giả, chất liệu, kích thước, bối cảnh, ý nghĩa và giá trị (Bảo vật quốc gia) cho từng tác phẩm; thông tin phong phú nhất lớp, còn thiếu một chút giải thích kỹ thuật tạo hiệu quả."},{"s":1,"f":"Tài liệu tham khảo đầy đủ, có đường dẫn, gắn với bài."},{"s":1.5,"f":"Bài khoảng 3.000 từ, vượt xa giới hạn 1.100 từ (+-10%) nên tiêu chí này tối đa 1,5."},{"s":1,"f":"Ảnh tự chụp, có chú thích từng hình."}],"b":0,"adj":0,"fin":9.0,"fb":"Đây là một trong những bài tốt nhất lớp: quan sát chi tiết, cảm nhận sâu, thông tin phong phú và nguồn rõ ràng. Em nên rút gọn bài về 800 đến 1.100 từ, giữ những chi tiết quan trọng nhất, và thử thêm tác phẩm điêu khắc hoặc kiến trúc để bài đa dạng loại hình hơn."},"265020449":{"name":"Trần Trọng Hiệp","it":[{"s":1,"f":"Hai tranh sơn mài và một tượng điêu khắc, có nêu lý do chọn bảo tàng."},{"s":1,"f":"Vườn xuân tả màu (đỏ, đen, vàng, trắng) và vị trí ba nhóm thiếu nữ; Thanh niên Thành đồng tả nhóm người và hai lính nhưng không nêu màu, bố cục; Bến Đợi nêu chất liệu, dáng ngồi. Một tác phẩm rõ, hai ở mức vừa."},{"s":1,"f":"Chỉ Thanh niên Thành đồng gắn cảm nhận với dáng đứng nhân vật; Vườn xuân (\"màu hài hòa\") và Bến Đợi là nhận xét chung."},{"s":1.5,"f":"Có tác giả, năm, chất liệu, kích thước, nội dung; chưa có bối cảnh trường phái hay kỹ thuật."},{"s":0,"f":"Không có mục tài liệu tham khảo nên TC5 được 0 điểm. Không có danh mục; chỉ có tên trang web trong chú thích ảnh, không tìm lại được bài cụ thể."},{"s":1.5,"f":"Khoảng 1.250 từ, vượt nhẹ giới hạn 1.210 nên tiêu chí này tối đa 1,5; bố cục rõ."},{"s":0.75,"f":"Hình tác phẩm lấy từ web bảo tàng và tạp chí, có ghi nguồn ở chú thích."}],"b":0,"adj":0.75,"fin":7.5,"fb":"Em nên dùng ảnh tự chụp khi tham quan, tả thêm bố cục, màu, chất liệu cho Thanh niên Thành đồng và Bến Đợi, và lập danh mục tài liệu. Em nên lập mục Tài liệu tham khảo ở cuối bài (tên tài liệu, tác giả, đường dẫn)."},"265036839":{"name":"Nguyễn An Ngọc Vi","it":[{"s":1,"f":"5 đối tượng, 4 loại hình (tranh sơn mài, sơn dầu, cửa chạm, tượng, kiến trúc), có lý do chọn nơi và đối tượng."},{"s":1,"f":"5/5 đối tượng có chi tiết nhìn thấy: Bác Hồ chiếm 1/3 tranh, hai mảng xanh và vàng; rèm tre, hoa hồng trắng, áo vàng, kẹp tóc hồng; đao mác, rồng ngậm ngọc, sư tử; 42 tay, bệ lục giác."},{"s":1.5,"f":"Chi tiết và lý do rõ ở Bác chiếm 1/3 tranh, Phật Bà; góc nhìn riêng (đổi cách nhìn mỹ thuật truyền thống) chỉ ở kết luận; vài chỗ chung (\"khó tả\", \"cảm phục\")."},{"s":1.25,"f":"Cánh cửa chạm rồng chưa ghi rõ thông tin nổi bật của hiện vật (tên và địa điểm, niên đại, chất liệu và kích thước, đề tài trang trí, danh hiệu)."},{"s":0.5,"f":"Chỉ ghi tên website (Vnfam, Wikipedia, VnExpress…), không có đường dẫn hay chỗ lấy thông tin cụ thể."},{"s":1.25,"f":"Đủ các phần, khoảng 1.480 từ; chưa đánh số tác phẩm 1, 2, 3 nên khó theo dõi (còn 1,25)."},{"s":0.75,"f":"Hình lấy từ nguồn ngoài, có ghi nguồn ở chú thích nhưng không tự chụp."}],"b":0,"adj":0,"fin":7.25,"fb":"Phần mô tả tranh và tượng của em rất cụ thể, nhìn là hình dung được tác phẩm. Em nên tìm hiểu và ghi rõ thông tin nổi bật của từng hiện vật (ví dụ Cánh cửa chạm rồng: tên tác phẩm và địa điểm, niên đại, chất liệu và kích thước, đề tài trang trí, danh hiệu), ghi nguồn bằng đường dẫn cụ thể, đánh số tác phẩm 1, 2, 3 để dễ theo dõi, dùng hình tự chụp tại bảo tàng và rút gọn bài."},"265041469":{"name":"Trần Đặng Anh Tuấn","it":[{"s":1,"f":"4 tác phẩm và kiến trúc, đủ loại hình, có mục lý do chọn bảo tàng."},{"s":0.5,"f":"Chỉ tượng Tâm linh (ngồi xếp bằng, tay chắp, vòm khối uốn lượn, đồng bắt sáng) tả cụ thể; Thanh niên thành đồng, Vườn xuân, Nghỉ đêm trong làng chủ yếu kể đề tài; mục \"Tây Nguyên (hoặc cụm tượng…)\" cho thấy chưa chắc tác phẩm nào."},{"s":0.5,"f":"Phần tác phẩm gần như không có phản ứng riêng; chỉ có kết luận chung (tự hào, biết ơn)."},{"s":1,"f":"Có tác giả, chất liệu, chủ đề, năm (Thanh niên thành đồng 1967-1978) nhưng chủ yếu liệt kê."},{"s":0,"f":"Không có mục tài liệu tham khảo nên TC5 được 0 điểm. Chỉ ghi \"Ảnh: sưu tầm\", \"VTV.vn\" dưới ảnh, không có danh mục."},{"s":1,"f":"Nộp .pptx dạng slide; kết luận ghi nhầm \"Bảo tàng Lịch sử TP.HCM\"."},{"s":0.75,"f":"Một vài ảnh ở slide cuối chưa có chú thích; nhiều hình sưu tầm, chỉ một hình ghi \"tự chụp\"."}],"b":0,"adj":1.5,"fin":6.25,"fb":"Em chọn được 4 tác phẩm và phần tả tượng Tâm linh rất tốt. Em nên tả hình ảnh các tranh, thêm cảm nhận riêng, dùng ảnh tự chụp, ghi nguồn đầy đủ và nộp đúng định dạng, đúng tên bảo tàng. Em nên lập mục Tài liệu tham khảo ở cuối bài (tên tài liệu, tác giả, đường dẫn)."},"265143254":{"name":"Trịnh Thị Thanh Huyền","it":[{"s":1,"f":"4 tác phẩm (tranh, tượng) và nhiều chi tiết kiến trúc, đủ loại hình, có mục lý do chọn."},{"s":0.5,"f":"4 tác phẩm chỉ có năm, kích thước, chất liệu và cảm xúc cá nhân (Trung thu, Bác Hồ, Vườn xuân hầu như không tả hình ảnh); phần tả cụ thể nằm ở kiến trúc (logo H-B-H, nội quy nền tối chữ trắng, cột Ionic, Corinth)."},{"s":1.5,"f":"Có liên hệ trải nghiệm riêng (nhớ rước đèn, tình mẹ con) nhưng ở kiến trúc và Vườn xuân chỉ có nhận xét chung (\"hài hòa\", \"nhiệt huyết\")."},{"s":1.5,"f":"Có kết nối: lịch sử Hui Bon Hoa với logo HBH, kỹ thuật lụa bồi, 20 năm sáng tác Vườn xuân; một số chi tiết còn nêu mà chưa giải thích."},{"s":0,"f":"Không có mục tài liệu tham khảo nên TC5 được 0 điểm. Chỉ ghi nguồn dưới từng hình (VinWonders, VTV, MIAvn), không có danh mục và không ghi nguồn thông tin tác phẩm."},{"s":1.75,"f":"Đủ bìa, mục lục, mở đầu, nội dung, kết luận; bố cục rõ, số từ hợp lệ. Phần mở đầu chưa giới thiệu các tác phẩm sẽ phân tích ở phần sau (trừ nhẹ 0,25)."},{"s":0.75,"f":"Hình tác phẩm tự chụp, 4 hình giới thiệu bảo tàng lấy từ nguồn ngoài (có ghi) nên mức 0,75."}],"b":0,"adj":1.25,"fin":8.25,"fb":"Bài trình bày đẹp, có ảnh tự chụp phong phú và nhiều chi tiết kiến trúc thú vị. Với 4 tác phẩm, em nên tả hình ảnh (màu, bố cục, nhân vật) thay vì chỉ nêu năm, kích thước, cảm xúc, và lập danh mục nguồn. Em nên lập mục Tài liệu tham khảo ở cuối bài (tên tài liệu, tác giả, đường dẫn). Phần mở đầu, em nên giới thiệu ngắn gọn các tác phẩm sẽ phân tích."},"265030097":{"name":"Lê Ngọc Tú","it":[{"s":1,"f":"Nhiều đối tượng đủ loại hình (gạch, bảng chỉ dẫn, tem, tượng, tranh); có nêu lý do chọn bảo tàng."},{"s":1,"f":"Gạch (đỏ nâu, xanh nhạt, trắng kem), bảng chỉ dẫn (đỏ đen, tam giác, đường chéo), tranh Hòa bình (trực thăng đối lập hình người, chữ PEACE) tả cụ thể; các tượng chỉ nói \"đường nét uốn lượn, hình khối lạ mắt\"."},{"s":2,"f":"Đạt cả 3 phép thử: nền gạch, bảng chỉ dẫn (hình tam giác, đường chéo), tem; có lý do và liên hệ với thiết kế đồ họa của chính em."},{"s":1,"f":"Có ý nghĩa tranh Hòa bình, tem Nguyễn Sáng; các tượng chưa có thông tin tác giả, bối cảnh (bảng chỉ dẫn là đồ họa nên không tính)."},{"s":0.5,"f":"Chỉ ghi \"Oxalisadventure.com\" cho một hình, không có danh mục tài liệu."},{"s":1.75,"f":"Khoảng 1.250 từ, vượt nhẹ nên không trừ; còn gạch đầu dòng và chưa đánh số tác phẩm 1–4 cho dễ theo dõi (còn 1,75)."},{"s":0.75,"f":"Hầu hết ảnh tự chụp, riêng ảnh giới thiệu bảo tàng lấy từ Oxalisadventure.com nên mức 0,75."}],"b":0,"adj":0,"fin":8.0,"fb":"Em nhìn bằng mắt thiết kế nên phần tả bảng chỉ dẫn, nền gạch và tem rất hay. Em nên tả cụ thể hơn các tượng và tìm thêm thông tin tác giả, bối cảnh của tượng; lập mục Tài liệu tham khảo; hạn chế gạch đầu dòng và nên liệt kê rõ tác phẩm 1, 2, 3, 4 cho dễ theo dõi."},"265400623":{"name":"Phan Diệu Tiến","it":[{"s":1,"f":"6 đối tượng, 4 loại hình (tượng, họa tiết, kính màu, tranh), có lý do chọn bảo tàng."},{"s":0.5,"f":"Chỉ tượng Yêu đời tả cụ thể (đồng xanh sẫm, bề mặt không nhẵn, đội mũ, tay cầm nhạc cụ gần miệng); lan can, chân dung Bác, Vườn xuân chỉ có nhận xét chung (\"tinh tế, đa dạng\", \"chạm khắc tinh xảo\")."},{"s":1,"f":"Chỉ tượng Yêu đời có chi tiết và lý do; các mục còn lại là câu chung (\"lạc vào thế giới khác\", \"lòng biết ơn\")."},{"s":1,"f":"Có tác giả, năm, ý nghĩa Vườn xuân (1969-1989, ba miền), nhưng chủ yếu liệt kê, ít liên hệ quan sát."},{"s":0,"f":"Không có mục tài liệu tham khảo nên TC5 được 0 điểm. Chỉ ghi \"Wikipedia\" và \"Facebook UEF\" dưới ảnh, không có danh mục."},{"s":1.5,"f":"Đủ phần, khoảng 900 từ, trộn \"em\" và \"tôi\", vài lỗi diễn đạt."},{"s":0.75,"f":"Hình bảo tàng ghi nguồn Wikipedia, Facebook UEF nên mức 0,75; một số hình thiếu tên tác phẩm."}],"b":0,"adj":1.75,"fin":7.5,"fb":"Em tả tượng Yêu đời rất tốt và chọn được nhiều đối tượng. Các mục còn lại nên chi tiết nhìn thấy (hoa văn dạng gì, màu nào) thay vì tính từ chung, cảm nhận nên gắn với chi tiết, và nên ghi nguồn đầy đủ. Em nên lập mục Tài liệu tham khảo ở cuối bài (tên tài liệu, tác giả, đường dẫn)."},"265035325":{"name":"Đinh Võ Anh Tuấn","it":[{"s":1,"f":"4 đối tượng, 4 loại (gốm, đồ họa khắc gỗ, trang trí kiến trúc, tượng đồng), có nêu lý do chung."},{"s":1,"f":"4/4 tả cụ thể: cột mốc gốm men xanh màu áo lính; rễ cây cuộn, khuôn mặt người ẩn trong mắt cây; cột đỉnh mái nhiều tầng hoa sen, men đỏ nâu, xanh, vàng; tượng mặc vest, cà vạt, mắt nhìn lên."},{"s":0.5,"f":"Không có cảm nhận riêng của từng tác phẩm; cảm nhận chỉ ở mở đầu và kết luận."},{"s":1,"f":"Chủ yếu liệt kê thông tin; ít kết nối với quan sát và suy nghĩ."},{"s":0,"f":"Chưa có danh mục tài liệu tham khảo."},{"s":1.75,"f":"Đủ phần, khoảng 900 từ, gọn, mạch lạc. Phần mở đầu chưa giới thiệu các tác phẩm sẽ phân tích ở phần sau (trừ nhẹ 0,25)."},{"s":0.5,"f":"Hình ảnh từ phần 2 trở đi chưa có chú thích."}],"b":0,"adj":2.0,"fin":7.75,"fb":"Em quan sát chọn lọc, tả rõ chất liệu, hình khối và có khai báo dùng AI minh bạch. Em nên thêm cảm nhận riêng cho từng tác phẩm và tìm hiểu bối cảnh sáng tác để hiểu tác phẩm sâu hơn. Phần mở đầu, em nên giới thiệu ngắn gọn các tác phẩm sẽ phân tích. Em cũng nên lập danh mục tài liệu tham khảo và chú thích cho các hình từ phần 2 trở đi."},"265388128":{"name":"Nguyễn Ngọc Tú Anh","it":[{"s":1,"f":"5–6 đối tượng gồm kiến trúc, thang máy, ký họa, sơn dầu, sơn mài; có lý do chọn từng thể loại."},{"s":1,"f":"Mọi mục tả cụ thể: người phụ nữ nằm trên khăn rằn gấp làm gối, ánh nến trong hầm; nhát cọ dứt khoát, ánh đèn đối lập đêm; lan can như hai con rắn đan; Vườn xuân màu đỏ, thếp vàng bạc, không có nhân vật chính."},{"s":1.5,"f":"Thang máy cổ, ký họa người lính có chi tiết, lý do và cảm giác riêng (mệt mỏi, những phút nghỉ quý giá); ở Vườn xuân chỉ nói ấm áp; thiếu liên hệ sâu hơn."},{"s":1.5,"f":"Có bối cảnh, giai đoạn, kỹ thuật và ý nghĩa từng tác phẩm; một số chỗ chưa giải thích rõ và chi tiết số liệu chưa kiểm chứng."},{"s":0.5,"f":"Nêu tên Báo Tuổi Trẻ, Studocu, Mỹ Thuật Sống trong lời văn nhưng không có danh mục hay đường dẫn."},{"s":1.5,"f":"Đủ phần nhưng khoảng 2.100 từ, gần gấp đôi 1.210 nên tiêu chí này tối đa 1,5; nền tối chữ nhỏ khó đọc."},{"s":0.5,"f":"Hình tự chụp, nhưng chú thích chỉ ghi \"Ảnh tự chụp\", chưa có tên tác phẩm, tác giả."}],"b":0,"adj":1.5,"fin":9.0,"fb":"Em quan sát rất kỹ, viết cảm nhận chân thật và ảnh đầy đủ. Bài trình bày chỉn chu, sạch đẹp, dễ theo dõi, giọng văn dẫn dắt người đọc tốt. Em nên rút gọn về khoảng 1.100 từ, lập danh mục tài liệu và chú thích hình có tên tác phẩm, tác giả."}};

var PGR={"g1":{"n":"Nhóm 3","t":"Đề 5 · Biểu đạt cảm xúc","fin":7.5,"sum":7.2,"adj":0.3,"pts":[1,1.2,0.9,1.6,0.6,1.2,0.4,0.3],"lv":[0,1,2,1,2,1,1,3],"fb":["Bốn tác phẩm thuộc bốn loại hình (hội họa, kiến trúc, điêu khắc, gốm), thông tin cơ bản đầy đủ (Rembrandt, Taj Mahal, The Waltz, Goat's Head của Picasso), có giải thích lý do chọn tác phẩm thuộc giai đoạn XVII–XX.","Phân tích tư thế, biểu cảm, ánh sáng, bố cục khá cụ thể ở các tác phẩm hội họa. Taj Mahal và phần Picasso còn thiên về mô tả, cần nối thêm với bối cảnh.","Có phần so sánh giống và khác và có kết luận, nhưng chưa nêu bật được cảm xúc các tác phẩm gợi ra nên phần giải thích còn hạn chế.","Nền tối nhất quán, hình lớn, mạch rõ; vài slide điêu khắc (The Waltz) chữ dày và nhỏ.","Có tài liệu tham khảo theo từng tác phẩm; chưa có mục lục.","Bạn thuyết trình thứ nhất rất tốt, không nhìn slide, có giải thích tên tiếng Việt và nhắc lại đề tài; bạn thứ hai nói to rõ nhưng còn nhìn slide.","Hai bạn thuyết trình phối hợp ổn; slide không có phân công nên chưa đối chiếu được vai trò của từng thành viên.","Nhóm trình bày khoảng 34 phút (13h40 đến 14h14), vượt xa 15 phút quy định (video ngắn không tính)."],"cm":"Nhóm có phần mở đầu tốt: video giới thiệu, nhắc lại đề tài, giải thích khái niệm và lý do chọn tác phẩm. Bốn tác phẩm đa dạng loại hình, thông tin cơ bản đầy đủ, có dấu hiệu tìm tòi từ nhiều nguồn. Bạn thuyết trình thứ nhất rất tốt. Nhóm cần chú ý phần phân tích Taj Mahal và Picasso còn thiên về mô tả, phần so sánh chưa nêu bật cảm xúc và nguyên nhân khác biệt, và thời lượng vượt khá nhiều."},"g2":{"n":"Nhóm 4","t":"Đề 4 · Đời sống thường nhật","fin":7.25,"sum":6.8,"adj":0.45,"pts":[0.6,0.9,0.9,1.2,0.6,1.2,0.4,1],"lv":[2,2,2,2,2,1,1,0],"fb":["Đủ bốn tác phẩm nhưng nhà phố ven kênh và Lofi Girl khó xem là tác phẩm có tác giả; thiếu năm và tác giả, thông tin chung của tác phẩm còn thiếu.","Mỗi tác phẩm có vài gạch đầu dòng, có một số chi tiết kỹ thuật (Cassatt) nhưng phần lớn còn mô tả chung; hình về kiến trúc giao thương chưa chỉ ra hoạt động của con người.","Có bảng so sánh nhưng chưa giải thích được nguyên nhân của những khác biệt; nội dung chưa sâu.","Chữ nghiêng đậm nhỏ trên nền nâu đỏ nên nhiều slide khó đọc, hình tác phẩm còn nhỏ.","Có thành viên, nhiệm vụ, tài liệu, cảm ơn, khai báo Gemini và Canva; nguồn của hai tác phẩm chỉ ghi \"Internet\", hình không ghi nguồn.","Có chào lớp, mở đầu giới thiệu lý do chọn đề tài và hướng khai thác; thuyết trình ổn, phần câu hỏi kết nối sôi nổi, thu hút khán giả nhưng chưa liên quan trực tiếp tới chủ đề; nội dung chưa sâu.","Phần mini game kết nối tốt giữa các bạn; có bạn đi trễ.","Nhóm trình bày khoảng 15 phút (14h40 đến 14h55), đúng thời lượng quy định."],"cm":"Nhóm mở đầu chuyên nghiệp, có chào lớp, giới thiệu lý do chọn đề tài, hướng khai thác và bối cảnh đời sống thường nhật. Thuyết trình ổn định, phần kết nối sôi nổi, thu hút khán giả. Nội dung phân tích còn chưa sâu: mỗi tác phẩm chủ yếu dừng ở mô tả chung, bảng so sánh chưa giải thích được nguyên nhân khác biệt. Nhóm nên chọn tác phẩm có tác giả và năm rõ ràng, bám sát hơn vào hoạt động của con người trong hình, tăng cỡ chữ và hình, ghi nguồn cho từng hình."},"g3":{"n":"Nhóm 5","t":"Đề 1 · Tôn giáo","fin":7.0,"sum":5.95,"adj":1.05,"pts":[0.6,0.9,0.9,1.6,0.8,0.45,0.4,0.3],"lv":[2,2,2,1,1,3,1,3],"fb":["Có năm tác phẩm nhưng cùng một thời kỳ; phần tác phẩm không có thông tin chung (tên, tác giả, năm, chất liệu).","Hai bạn thuyết trình đều nhìn slide; khi được hỏi thêm chưa giải thích được nên mức phân tích chưa vững.","Có tương đồng, khác biệt, nhận xét chung nhưng nội dung chung chung; phần liên hệ cuối bài chưa đúng với nội dung.","Mạch mục I–VIII rõ ràng nhưng chữ rất nhỏ trên nền tối, có slide gần như không đọc được; có slide ngoài đề.","Có thành viên, nhiệm vụ, mục lục, tài liệu tham khảo; nguồn ChatGPT chỉ ghi ở một slide, hình không ghi nguồn.","Cả hai bạn đều nhìn slide, nội dung dài; khi được hỏi thêm chưa trả lời được nội dung đã trình bày.","Nhóm lên chào trước khi thuyết trình, phân công hai bạn trình bày.","Nhóm trình bày khoảng 25 phút (14h15 đến lúc nhóm kế bắt đầu 14h40), vượt 15 phút quy định."],"cm":"Nhóm có mục lục rõ ràng, mạch bài từ mục I đến VIII, có thành viên, nhiệm vụ và tài liệu tham khảo; hai bạn có lên chào trước khi thuyết trình. Tuy nhiên hai bạn thuyết trình đều nhìn slide, phần tác phẩm chưa có thông tin chung, và khi được hỏi thêm chưa giải thích được nội dung mình trình bày. Phần liên hệ cuối bài chưa đúng nội dung; có slide ngoài đề; chữ trên slide rất nhỏ. Nhóm nên tập trung hiểu và giải thích từng tác phẩm bằng lời của mình và chọn lọc nội dung để gọn thời lượng."},"g4":{"n":"Nhóm 6","t":"Đề 3 · Quyền lực chính trị","fin":6.75,"sum":5.7,"adj":1.05,"pts":[0.6,0.45,0.45,1.6,0.8,0.9,0.3,0.6],"lv":[2,3,3,1,1,2,2,2],"fb":["Mỗi thời kỳ chỉ nêu một đến hai hình; thiếu tác giả và năm; mục \"Hy Lạp - Thời Phục Hưng\" gộp sai hai thời kỳ.","Nội dung trình bày theo thời kỳ chứ không theo từng tác phẩm; chưa chỉ ra quyền lực chính trị thể hiện ở đâu và chưa phân tích chi tiết tạo hình.","Thiếu phần so sánh giống và khác giữa các tác phẩm; phần tổng kết có quan điểm nhóm nhưng còn chung chung, chưa nói rõ về quyền lực chính trị.","Mạch bốn phần rõ ràng nhưng hình và chữ nhỏ trên nền tối, mỗi slide gom nhiều tác phẩm.","Có thành viên, nhiệm vụ, mục lục, nguồn và khai báo ChatGPT, Gemini, Canva; nguồn hình là đường dẫn ảnh Google, khó đối chiếu.","Chỉ một bạn thuyết trình và còn nhìn slide; phần đầu nói chủ đề chung khá lâu trước khi vào tác phẩm; nhóm chưa lên chào đầu giờ.","Phần nói chủ yếu do một bạn đảm nhiệm, chưa thấy phân bố lượt nói giữa các thành viên.","Nhóm trình bày khoảng 21 phút (13h19 đến 13h40), hơi vượt 15 phút quy định."],"cm":"Nhóm có bố cục bốn phần rõ ràng, có thành viên, nhiệm vụ, mục lục, nguồn và khai báo công cụ AI; phần tổng kết có liên hệ và quan điểm của nhóm. Điểm cần cải thiện nhiều nhất là cách trình bày: nội dung đi theo thời kỳ thay vì theo từng tác phẩm, chưa chỉ ra quyền lực chính trị thể hiện ở đâu, thiếu so sánh giống và khác. Chỉ một bạn thuyết trình và còn nhìn slide. Nhóm nên chọn tác phẩm cụ thể và phân tích chi tiết gắn với đề tài."},"g5":{"n":"Nhóm 7","t":"Đề 6 · Vai trò của phụ nữ","fin":8.0,"sum":7.9,"adj":0.1,"pts":[0.8,1.2,1.2,2,0.8,1.2,0.4,0.3],"lv":[1,1,1,0,1,1,1,3],"fb":["Bốn tác phẩm trải bốn thời kỳ, thông tin cơ bản đầy đủ; tên gốc chưa nhất quán (ba tác phẩm để tên gốc, một tác phẩm dịch).","Mỗi tác phẩm có đặc điểm nghệ thuật (bố cục tam giác, tương phản ánh sáng, màu) gắn với bối cảnh; phần bối cảnh hơi dài trong khi trọng tâm là hình tượng người phụ nữ trong tranh.","So sánh nêu được khác biệt (vẻ đẹp bên trong, bên ngoài, chức năng, đa dạng) và có kết luận; phần giải thích nguyên nhân khác biệt còn ngắn.","Thiết kế nhất quán, khung tranh lớn, ít chữ, mỗi tác phẩm có slide riêng nên rất dễ đối chiếu.","Có đủ thành viên, nhiệm vụ, mục lục, tài liệu, cảm ơn; liên kết nguồn ẩn dưới tên tác phẩm, hình không ghi nguồn; chưa thấy khai báo AI.","Bạn thứ nhất giọng rõ, không nhìn slide nhưng khúc sau hơi nhanh; bạn thứ hai nói theo hiểu biết, có phần mở rộng ngoài slide.","Đến sớm, chào lớp, giới thiệu đủ thành viên và công việc; hai bạn nói đúng theo phân công trên slide.","Nhóm trình bày khoảng 26 phút (12h53 đến lúc nhóm kế bắt đầu 13h19), vượt thời lượng quy định; phần bối cảnh nên rút gọn."],"cm":"Nhóm đến sớm, chào lớp, giới thiệu thành viên và phân công rõ ràng. Hai bạn thuyết trình nói theo sự hiểu biết, không đọc slide, có phần mở rộng ngoài nội dung trên slide. Slide nhất quán, ít chữ, mỗi tác phẩm có một slide riêng nên dễ đối chiếu. Nhóm nên thống nhất cách ghi tên tác phẩm, rút gọn phần bối cảnh để dành thời gian cho trọng tâm là hình tượng người phụ nữ trong tranh, giải thích sâu hơn nguyên nhân của những khác biệt, ghi nguồn rõ ở từng hình và kiểm soát thời lượng."},"g6":{"n":"Nhóm 8","t":"Đề 2 · Hình tượng con người","fin":7.0,"sum":5.85,"adj":1.15,"pts":[0.8,0.9,0.45,1.2,0.6,0.9,0.4,0.6],"lv":[1,2,3,2,2,2,1,2],"fb":["Bốn tác phẩm từ bốn thời kỳ (Khafre, David, Tiếng thét, Những cô nàng Avignon), thông tin cơ bản có nhưng thiếu vài chi tiết phụ.","Slide nhiều chữ, phần phân tích chủ yếu kể thông tin và còn ngắn.","Chưa có phần so sánh tương đồng và đối lập giữa các loại hình; kết luận chưa nêu được quan điểm của nhóm.","Slide vẫn còn nhiều chữ; đề tài chưa được nhắc lại xuyên suốt.","Có thành viên, nhiệm vụ, cảm ơn; tài liệu chỉ là tên rút gọn, hình không ghi nguồn; có biểu tượng AI nhưng chưa khai báo.","Giọng to rõ, dễ tiếp thu nhưng còn phụ thuộc nội dung slide; bạn thuyết trình thứ hai tự nhiên hơn.","Các bạn phối hợp tốt, có giới thiệu thành viên.","Nhóm trình bày khoảng 9 phút (12h55 đến 13h04), ngắn hơn nhiều so với 15 phút và bỏ phần so sánh, kết luận."],"cm":"Nhóm chọn bốn tác phẩm từ bốn thời kỳ (Khafre, David, Tiếng thét, Những cô nàng Avignon) và giới thiệu thành viên đầy đủ. Các bạn nói giọng to rõ, dễ tiếp thu, phối hợp tốt, bạn thuyết trình thứ hai nói tự nhiên hơn. Nhóm còn thiếu phần so sánh sự tương đồng và đối lập giữa các loại hình, kết luận chưa nêu được quan điểm riêng, và đề tài chưa được nhắc lại xuyên suốt. Phần phân tích ngắn, slide còn nhiều chữ và các bạn còn phụ thuộc vào slide. Thời lượng ngắn hơn nhiều so với 15 phút quy định, nhóm có thể dùng thêm thời gian để đào sâu phân tích. Tài liệu tham khảo cần ghi đầy đủ nguồn và khai báo việc dùng AI."},"g7":{"n":"Nhóm có \"Tài\"","t":"Đề 3 · Quyền lực chính trị","fin":7.75,"sum":7.4,"adj":0.35,"pts":[0.8,1.2,1.2,1.2,0.8,1.2,0.4,0.6],"lv":[1,1,1,2,1,1,1,2],"fb":["Bốn tác phẩm (Augustus Prima Porta, Khải hoàn môn Constantine, Louis XIV, Guernica) đúng đề tài; tác phẩm Louis XIV thiếu tác giả.","Augustus và Khải hoàn môn phân tích rõ chi tiết gắn với quyền lực (Cupid, giáp ngực, chi tiết tái sử dụng); Louis XIV còn thiên về mô tả.","Có bảng so sánh hai nhóm tác phẩm, đúc kết rõ ràng và quan điểm của nhóm; liên hệ thực tiễn khá tốt.","Có mục lục, nhắc đề tài, câu hỏi mở đầu gợi tò mò; nhiều slide vẫn còn nhiều chữ.","Có tài liệu từ sách, bảo tàng và ghi ChatGPT; slide thành viên chỉ có ảnh và tên gọi tắt, chưa ghi nhiệm vụ.","Hai bạn còn phụ thuộc vào slide, bạn thứ hai giọng to rõ hơn; phần trả lời câu hỏi bám nội dung và nhấn mạnh được hiểu biết của nhóm về quyền lực chính trị.","Nhóm giới thiệu thành viên và phối hợp ổn.","Nhóm trình bày khoảng 24 phút (13h10 đến 13h34), vượt thời lượng quy định."],"cm":"Nhóm chọn tác phẩm đúng đề tài và phân tích tốt những chi tiết gắn với quyền lực. Phần so sánh có bảng đối chiếu và kết luận rõ ràng, có góc nhìn riêng của nhóm; phần trả lời câu hỏi cho thấy các bạn hiểu về quyền lực chính trị. Nhóm cần cải thiện việc thuyết trình còn phụ thuộc slide, nhiều slide dày chữ, tác phẩm Louis XIV thiếu tác giả, slide thành viên chưa ghi nhiệm vụ."},"g8":{"n":"Nhóm Five Aura","t":"Đề 1 · Tôn giáo","fin":8.5,"sum":8.1,"adj":0.4,"pts":[0.8,1.2,1.2,2,0.6,1.5,0.5,0.3],"lv":[1,1,1,0,2,0,0,3],"fb":["Bốn tác phẩm từ bốn bối cảnh (Bastet, Parthenon, Cửa kính hoa hồng, Đám cưới ở Cana), thông tin cơ bản có; Bastet và Parthenon thiếu tác giả hoặc năm cụ thể.","Chỉ ra được bố cục, chất liệu, ánh sáng, màu và ý nghĩa (tỉ lệ Doric, vòng tròn đồng tâm); một vài nhận định còn ngắn.","Phần so sánh phân tích tương đồng và khác biệt khá tốt, có chiều sâu; kết luận nêu cảm nhận và quan điểm của nhóm cho từng tác phẩm.","Slide đẹp, có chuyển động và bản đồ, nội dung chắt lọc rồi mở rộng khi thuyết trình.","Có thành viên, nhiệm vụ, mục lục; nhiều nguồn chỉ ghi \"Gemini google.com\" hoặc Facebook, khó truy tìm.","Tự tin, có nhấn nhá, hạn chế đọc slide, có câu hỏi mở đầu và mini game, mở rộng thêm ngoài slide.","Phối hợp rất tốt giữa người thuyết trình và người điều khiển slide, có giới thiệu thành viên.","Nhóm trình bày khoảng 45 phút (13h37 đến 14h22) gồm cả mini game, vượt xa 15 phút quy định."],"cm":"Phần trình bày của nhóm rất thuyết phục: các bạn tự tin, có nhấn nhá, hạn chế đọc slide và mở rộng nhiều hơn những gì trên slide. Bài có câu hỏi mở đầu khơi gợi tò mò, slide đẹp với chuyển động và bản đồ, phối hợp giữa người nói và người điều khiển slide rất ăn ý. Phần so sánh phân tích được cả tương đồng lẫn khác biệt, kết luận nêu rõ cảm nhận và quan điểm của nhóm. Để bài hoàn thiện hơn, nhóm nên ghi nguồn cụ thể hơn, bổ sung đủ tác giả và năm cho Bastet và Parthenon, và kiểm soát thời lượng khi có thêm mini game."}};
var CRT=[{"k":"TC1","n":"Lựa chọn tác phẩm và thông tin cơ bản","max":1,"g":0,"lv":[[1,"Đủ ≥4 tác phẩm phù hợp đề tài, đa dạng về loại hình, thời kỳ hoặc bối cảnh văn hóa, tạo cơ sở tốt để so sánh; thông tin cơ bản đầy đủ, chính xác."],[0.8,"Đủ ≥4 tác phẩm phù hợp; thiếu hoặc sai nhẹ một vài thông tin phụ."],[0.6,"Đủ số lượng nhưng một số tác phẩm liên quan yếu đến đề tài; thiếu nhiều thông tin cơ bản."],[0.3,"Thiếu số lượng; nhiều tác phẩm lệch đề tài hoặc nhầm thông tin cốt lõi."]]},{"k":"TC2","n":"Phân tích và liên hệ bối cảnh","max":1.5,"g":0,"lv":[[1.5,"Chỉ ra chi tiết tạo hình cụ thể ở từng tác phẩm, giải thích cách chúng thể hiện đề tài và mối liên hệ với bối cảnh."],[1.2,"Có phân tích nghệ thuật và liên hệ bối cảnh, nhưng một số nhận định thiếu dẫn chứng cụ thể."],[0.9,"Chủ yếu mô tả hình ảnh, kể tiểu sử hoặc lịch sử; ít giải thích ý nghĩa của đặc điểm nghệ thuật."],[0.45,"Hầu như chỉ liệt kê; diễn giải thiếu căn cứ hoặc sai kiến thức trọng tâm."]]},{"k":"TC3","n":"So sánh và kết luận","max":1.5,"g":0,"lv":[[1.5,"So sánh trực tiếp theo tiêu chí rõ; giải thích tương đồng, khác biệt; kết luận thể hiện góc nhìn của nhóm, được hỗ trợ bởi kết quả phân tích và so sánh."],[1.2,"Có so sánh và kết luận phù hợp; giải thích nguyên nhân khác biệt còn hạn chế."],[0.9,"So sánh chung chung, rời rạc; kết luận chủ yếu nhắc lại nội dung."],[0.45,"Trình bày từng tác phẩm riêng lẻ, hầu như không so sánh; thiếu kết luận hoặc kết luận thiếu căn cứ."]]},{"k":"TC4","n":"Tổ chức nội dung và thiết kế slide","max":2,"g":1,"lv":[[2,"Mạch nội dung rõ, phân cấp tốt; chữ dễ đọc, hình rõ và đủ lớn; bố trí hỗ trợ hiệu quả việc phân tích, so sánh."],[1.6,"Dễ theo dõi, chữ và hình phù hợp; còn vài slide dày chữ hoặc bố trí chưa hợp lý."],[1.2,"Mạch nội dung có chỗ đứt đoạn; nhiều slide dày chữ, hình nhỏ hoặc khó đối chiếu."],[0.6,"Nội dung rời rạc; chữ khó đọc, thiếu hình hoặc hình mờ, cản trở việc hiểu bài."]]},{"k":"TC5","n":"Nguồn tư liệu và yêu cầu hình thức","max":1,"g":1,"lv":[[1,"Nguồn nội dung và hình ảnh truy tìm được; đủ thành phần theo đề (trang đầu, thành viên và nhiệm vụ, tài liệu tham khảo, trang cảm ơn); khai báo AI nếu có sử dụng."],[0.8,"Có tài liệu tham khảo và nguồn hình; vài chỗ ghi thiếu hoặc chưa nhất quán."],[0.6,"Có danh mục nguồn nhưng khó đối chiếu với nội dung, hình ảnh; thiếu một số thành phần bắt buộc."],[0.3,"Hầu như không ghi nguồn hoặc nguồn không truy tìm được; thiếu nhiều thành phần bắt buộc."]]},{"k":"TC6","n":"Diễn đạt, giao tiếp và trả lời câu hỏi","max":1.5,"g":2,"lv":[[1.5,"Trình bày rõ, có trọng tâm, chủ động giải thích và chỉ dẫn hình ảnh; ngôn ngữ cơ thể tốt, tương tác với lớp (câu hỏi quan sát, mời lớp so sánh…); ít lệ thuộc tài liệu; khi được hỏi, trả lời đúng trọng tâm bằng chi tiết tác phẩm."],[1.2,"Phần lớn trình bày rõ, tương đối tự nhiên; đôi lúc đọc slide nhưng vẫn giải thích được ý; trả lời đúng ý chính khi được hỏi."],[0.9,"Nhiều phần đọc nguyên văn, dài dòng hoặc ngắt quãng; ít giao tiếp với lớp; trả lời được một phần, cần gợi mở."],[0.45,"Phần lớn chỉ đọc tài liệu; diễn đạt khó theo dõi, không làm rõ được ý chính; không giải thích được nội dung đã trình bày khi được hỏi."]]},{"k":"TC8a","n":"Phối hợp nhóm","max":0.5,"g":2,"lv":[[0.5,"Phân công hợp lý, các thành viên tham gia cân đối theo vai trò; chuyển tiếp liền mạch."],[0.4,"Phối hợp tương đối tốt; đôi chỗ chuyển tiếp chưa trôi chảy."],[0.3,"Phân chia chưa hợp lý, chuyển tiếp lúng túng."],[0.15,"Phối hợp rời rạc, phụ thuộc quá nhiều vào một người."]]},{"k":"TC8b","n":"Quản lý thời gian","max":1,"g":2,"lv":[[1,"Hoàn thành đủ nội dung trong thời gian quy định (15 phút trình bày, tối đa 20 phút kể cả Q&A); phân bổ thời gian hợp lý giữa các phần."],[0.8,"Hoàn thành nội dung trong thời gian quy định; một vài phần dài hoặc ngắn hơn cần thiết."],[0.6,"Phải nhắc giờ hoặc cắt vội một số phần."],[0.3,"Mất kiểm soát thời gian, không hoàn thành phần nội dung chính."]]}];
var CR=[{"n":"1. Lựa chọn tác phẩm/đối tượng","max":1,"lv":[[1,"Đủ 3–4 đối tượng phù hợp, có giải thích lý do lựa chọn, và đa dạng loại hình (từ 2 loại hình trở lên: hội họa, điêu khắc, kiến trúc, đồ họa)."],[0.75,"Đủ 3–4 đối tượng phù hợp, có giải thích lý do, nhưng chỉ thuộc một loại hình."],[0.5,"Chỉ có 1–2 đối tượng phù hợp hoặc đủ số lượng nhưng chưa giải thích lý do."],[0,"Không có đối tượng phù hợp với yêu cầu."]]},{"n":"2. Quan sát (mô tả điều nhìn thấy)","max":1,"lv":[[1,"Phần lớn tác phẩm được mô tả bằng điều nhìn thấy, chỉ ra được ít nhất 2 trong 3 yếu tố: màu sắc; bố cục/vị trí nhân vật, hình khối; chất liệu/bề mặt. Không đòi hỏi thuật ngữ tạo hình."],[0.5,"Có mô tả nhưng chủ yếu kể đề tài hoặc dùng từ chung (“màu hài hòa, nhẹ nhàng”); chỉ một vài tác phẩm có chi tiết nhìn thấy."],[0,"Không có mô tả điều nhìn thấy (chỉ tiểu sử, nội dung, ý nghĩa)."]]},{"n":"3. Cảm nhận và suy nghĩ cá nhân","max":2,"lv":[[2,"Phần lớn tác phẩm đạt cả 3 phép thử: (1) chỉ đích danh chi tiết gây cảm xúc; (2) có lý do “vì… nên em thấy…”; (3) có góc nhìn riêng (liên hệ trải nghiệm, ngành học, cuộc sống), không chỉ lặp lại thuyết minh."],[1.5,"Khoảng một nửa số tác phẩm đạt cả 3 phép thử; phần còn lại đạt 1–2 phép thử."],[1,"Có chi tiết nhưng thiếu lý do hoặc thiếu góc nhìn riêng; hoặc chỉ 1 tác phẩm đạt đủ."],[0.5,"Cảm nhận chung chung (“bình yên”, “xúc động”, “ấn tượng”, “mở mang tầm mắt”); thay tên tác phẩm khác vào vẫn đúng."],[0,"Không thể hiện cảm nhận hoặc suy nghĩ cá nhân."]]},{"n":"4. Tìm hiểu và khai thác thông tin","max":2,"lv":[[2,"Thông tin phù hợp, không có sai sót rõ ràng; giải thích được thông tin ấy giúp hiểu tác phẩm như thế nào."],[1.5,"Có tìm hiểu và kết nối với tác phẩm, nhưng một số nội dung chưa được giải thích rõ."],[1,"Chủ yếu liệt kê thông tin; ít kết nối với quan sát và suy nghĩ."],[0.5,"Thông tin rất ít, ít liên quan hoặc có nhiều sai sót cơ bản."],[0,"Không có nội dung tìm hiểu."]]},{"n":"5. Ghi nguồn tham khảo","max":1,"lv":[[1,"Nguồn thông tin được var CKS={"265041267":{"g":"G15","s":[1.25,2.25,1.25,2.5],"b":0.0,"t":7.25,"fb":"Bài làm của em có một số điểm đáng ghi nhận. Bản tái hiện đúng bố cục, bảng màu gần với bản gốc và chuyển được nét cọ xoáy đặc trưng; slide nhất quán, dễ theo dõi.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần giới thiệu thiếu năm sáng tác và bối cảnh. Thứ hai, phần trường phái và ý nghĩa cần chỉ ra trên tranh, và bài chưa có cảm nhận cá nhân. Cuối cùng, số slide dưới mức, nhật ký thiếu mô tả công cụ, lý do và giải pháp.","f":["Em có phân tích bố cục, màu, ánh sáng và liên hệ được bối cảnh xã hội công nghiệp cuối thế kỷ 19. Tuy nhiên, phần giới thiệu chưa ghi năm sáng tác và bối cảnh chỉ một câu; đặc điểm Hậu Ấn tượng chưa được chỉ ra trên tranh (nét cọ uốn lượn ở nền, sắc xanh trên áo); phần ý nghĩa còn chung, mới nhắc cành hoa và nỗi u sầu; bài chưa có phần cảm nhận cá nhân, em nên viết điều em ấn tượng nhất và bài học cho việc vẽ của em.","Bản tái hiện của em đúng bố cục, bảng màu gần với bản gốc, chuyển được nét cọ xoáy ở nền và áo bằng brush digital và giữ đủ cành mao địa hoàng, cuốn sách, bàn tay; nhật ký có ảnh các mốc 20, 50, 80%. Tuy nhiên, bài chỉ có ảnh tiến trình tới 80% nên chưa thấy bản hoàn chỉnh, màu còn lệch; nhật ký chưa nêu công cụ và lý do chọn, phần khó khăn về màu chưa có giải pháp.","Slide của em nhất quán, dễ theo dõi, đúng tỉ lệ và có ghi nguồn tham khảo. Tuy nhiên, bài chỉ có 8 slide nội dung (dưới mức 9).","Em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; phong thái rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"265143423":{"g":"G05","s":[3.0,2.5,1.0,2.25],"b":0.0,"t":8.75,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần phân tích rất tốt, chỉ ra rõ sự bóp méo thực tại qua nhân vật, bầu trời và giải thích đầy đủ các biểu tượng; bản tái hiện trên ibisPaint gần như nguyên mẫu; slide nhất quán.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, nhật ký cần ghi
