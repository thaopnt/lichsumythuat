đúng khó khăn khi vẽ digital thay vì bột màu, sơn dầu. Thứ hai, nhóm cần tự đối chiếu bản tái hiện với bản gốc và ghi phân công. Cuối cùng, slide cần bổ sung ý tưởng tái hiện, sắp đúng thứ tự theo đề và ghi chú thích cho ảnh.","f":["Phần phân tích của nhóm em rất tốt: đủ thông tin tác phẩm, xác định đúng Biểu hiện và chỉ ra sự bóp méo thực tại qua nhân vật, bầu trời; phân tích màu đối lập tạo căng thẳng, cây cầu chạy xéo dẫn hướng nhìn, nét cong đối lập nét thẳng; giải thích được biểu tượng nhân vật, bầu trời, cầu và bóng người phía sau. Phần xã hội liên hệ đúng bối cảnh công nghiệp hóa cuối thế kỷ 19 và phần cảm nhận có bài học riêng.","Bản tái hiện trên ibisPaint của nhóm em gần như nguyên mẫu: đúng bố cục, bảng màu, đặc trưng nét và hoàn thiện; nhật ký có ảnh các mốc và nêu công cụ. Tuy nhiên, phần khó khăn ghi cách khắc phục bằng bột màu, sơn dầu trong khi nhóm vẽ trên máy, nên chưa phản ánh đúng khó khăn thật khi vẽ digital; nhóm cũng chưa đối chiếu bản tái hiện với bản gốc và chưa ghi phân công giữa hai bạn.","Slide của nhóm em nhất quán, đúng tỉ lệ và đủ số lượng slide. Tuy nhiên, bài thiếu slide ý tưởng tái hiện và slide sản phẩm hoàn chỉnh đặt trước nhật ký, chưa đúng thứ tự đề yêu cầu; nhiều ảnh trong slide chưa có chú thích tên tác phẩm và nguồn, em nên ghi ngắn dưới mỗi hình.","Thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu. Tuy nhiên, phần trình bày chung của nhóm còn rời rạc, chưa đủ các phần theo đề."]},"265144983":{"g":"G04","s":[1.75,2.5,1.25,2.5],"b":0.0,"t":8.0,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần ngôn ngữ nghệ thuật và ý nghĩa được phân tích tốt; bản tái hiện digital đúng bố cục, màu, hoàn thiện và nhật ký tự chỉ ra chỗ chưa giống kèm cách khắc phục cụ thể; slide đẹp, nhất quán.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, thông tin về tác giả và niên đại còn mâu thuẫn, cần kiểm tra lại nguồn. Thứ hai, phần giao thoa Đông Tây cần chỉ ra trên tranh. Thứ ba, nhật ký cần lý do chọn công cụ và phân công. Cuối cùng, số slide vượt mức.","f":["Nhóm em phân tích tốt màu, đường nét và bố cục hai nhân vật kèm tác dụng, giải thích rõ chủ đề dâng cúng, biểu tượng bó hoa và thông điệp hoài niệm của người nghệ sĩ xa xứ. Tuy nhiên, thông tin còn mâu thuẫn: trang 4 ghi tác giả tốt nghiệp khóa đầu tiên trong khi trang 6 ghi Khóa II, và phần xã hội liên hệ thập niên 1960 trong khi tranh ghi sáng tác 1930 đến 1940; nhóm cần kiểm tra lại nguồn. Phần \"giao thoa Đông Tây\" nên chỉ ra trên tranh chỗ nào là kỹ thuật phương Tây, chỗ nào là tinh thần phương Đông, và phần cảm nhận nên có bài học cụ thể cho việc vẽ của nhóm.","Bản tái hiện digital của nhóm em đúng bố cục, bảng màu, hoàn thiện và chuyển được chất sơn mềm của bản gốc; nhật ký có ảnh các mốc 20, 50, 70, 100%, tự chỉ ra các chỗ còn khác bản gốc (vân brush lặp, nét ngũ quan, màu nền) kèm cách khắc phục cụ thể. Tuy nhiên, nhật ký nêu app, cọ, bảng màu nhưng chưa nói lý do chọn và chưa ghi phân công giữa hai bạn.","Slide của nhóm em đẹp, nhất quán, chữ dễ đọc, đúng tỉ lệ và các hình có chú thích. Tuy nhiên, bài có khoảng 16 slide nội dung, vượt mức 9 đến 13 slide.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"265035325":{"g":"G14","s":[3.0,2.25,1.25,2.25],"b":0.0,"t":8.75,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần phân tích rất tốt, chỉ ra rõ đặc điểm Siêu thực, đo trục đối xứng, trích bảng màu và có bài học sáng tạo cụ thể; nhật ký tự đối chiếu với bản gốc và phân công rõ.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, bản tái hiện tự đổi sang phong cách hoạt họa, bỏ chi tiết khuỷu tay và màu còn lệch. Thứ hai, ảnh tiến trình cần thấy giao diện Procreate, brush và bảng màu. Cuối cùng, một số slide trình bày khối chữ còn lộn xộn.","f":["Phần phân tích của nhóm em rất tốt: đủ thông tin tác phẩm, xác định đúng Siêu thực và chỉ ra qua quả táo, con mắt sau lá; phân tích bố cục, ánh sáng, màu có đo trục đối xứng và trích bảng màu; giải thích rõ quả táo, con mắt và thông điệp che giấu; liên hệ châu Âu 1960; phần cảm nhận có bài học sáng tạo cụ thể về việc che giấu để gợi tò mò.","Bản tái hiện tác phẩm của nhóm em đúng bố cục và hoàn thiện; nhật ký nêu lý do chọn Procreate, có khó khăn, cách xử lý và tự chỉ ra chi tiết khuỷu tay chưa giống bản gốc, phân công rõ giữa hai bạn. Tuy nhiên, nhóm tự đổi sang phong cách hoạt họa và bỏ chi tiết khuỷu tay bẻ ngược, màu còn lệch so với bản gốc.","Slide của nhóm em rõ, dễ đọc, đúng tỉ lệ, đủ cấu trúc và các hình có chú thích. Tuy nhiên, các khối chữ ở trang 7, 8, 11 chia cột không đều, mũi tên rời rạc nên trình bày còn lộn xộn.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời đúng các câu hỏi. Tuy nhiên, một vài câu trả lời còn thiếu độ sâu."]},"265040862":{"g":"G06","s":[2.25,2.0,1.25,2.5],"b":0.0,"t":8.0,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Nhóm phân tích được bố cục và ánh mắt làm điểm nhấn, liên hệ bối cảnh Âu hóa có dẫn chứng; bản tái hiện acrylic đúng màu, đắp nhiều lớp; slide nhất quán.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, mảng đen ghi tên làm lệch bố cục và khuôn mặt còn khác bản gốc. Thứ hai, phần màu sắc và cảm nhận cần gắn với chi tiết cụ thể. Thứ ba, nhật ký cần phần đối chiếu và phân công rõ ai làm gì. Cuối cùng, ảnh trong slide cần có chú thích.","f":["Nhóm em giới thiệu đủ năm, kích thước, chất liệu và bối cảnh vẽ cháu gái; phân tích được bố cục lệch trục cân bằng nhờ ghế mây và ánh mắt làm điểm nhấn; giải thích tình cảm gia đình, vẻ đẹp thuần khiết qua váy trắng, ghế mây, và liên hệ được bối cảnh Âu hóa qua nhận định của Thái Bá Vân. Tuy nhiên, phần trường phái nên giải thích rõ hơn vì sao xếp vào hiện thực; phần màu sắc mới nói \"đơn giản, dịu mắt\" mà chưa chỉ mảng màu nào ở đâu; phần cảm nhận còn chung, nên gắn với một chi tiết cụ thể của tranh và rút ra bài học cho việc vẽ của nhóm.","Bản tái hiện acrylic của nhóm em đúng bảng màu, hoàn thiện và đắp nhiều lớp màu; nhật ký có 5 giai đoạn đánh số và nêu rõ lý do chọn acrylic vì khô nhanh. Tuy nhiên, mảng đen ghi tên ở phía dưới làm lệch bố cục so với bản gốc và khuôn mặt nhân vật còn khác bản gốc; phần khó khăn chưa nhắc chuyện canh chỉnh bố cục và chưa tự đối chiếu với bản gốc, phần phân công chỉ ghi \"phù hợp khả năng\" mà chưa nói ai làm gì.","Slide của nhóm em nhất quán, dễ đọc, đúng tỉ lệ và đủ cấu trúc. Tuy nhiên, các ảnh trong slide chưa có chú thích tên tác phẩm và nguồn.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"215062749":{"g":"G07","s":[2.25,2.25,1.5,2.5],"b":0.0,"t":8.5,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Nhóm phân biệt rõ Ấn tượng và Hậu Ấn tượng, liên hệ Japonisme và thư Van Gogh; phần cảm nhận rút ra được bài học phối màu cho thiết kế đồ họa; nhật ký đầy đủ, phân công rõ; slide thanh lịch, nhất quán.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, slide ngôn ngữ nghệ thuật bị dán nhầm nội dung nên phần này còn thiếu. Thứ hai, phần ý nghĩa cần giải thích biểu tượng hoa diên vĩ. Cuối cùng, bản mosaic còn lệch bố cục mặt bàn, sắc độ màu và mất chi tiết lá, cánh hoa.","f":["Nhóm em giới thiệu đầy đủ năm, nơi vẽ, chất liệu, kích thước, nơi lưu giữ; phân biệt rõ Ấn tượng và Hậu Ấn tượng, chỉ ra trên tranh qua tương phản tím và vàng chanh, nét cọ ngắn dày; phần xã hội liên hệ được Japonisme và thư Van Gogh gửi Theo; phần cảm nhận gắn với sắc tím tương phản nền vàng và rút ra bài học phối màu, tổ chức hình có chủ đích cho thiết kế đồ họa. Tuy nhiên, slide ngôn ngữ nghệ thuật bị dán nhầm nội dung bối cảnh nên mới mô tả sắc tím, chưa phân tích bố cục, ánh sáng, đường nét; phần ý nghĩa chưa giải thích biểu tượng hoa diên vĩ.","Bản mosaic giấy kiếng của nhóm em hoàn thiện, đều tay; nhật ký đầy đủ ảnh các mốc, lý do chọn giấy kiếng, khó khăn và cách xử lý, có đối chiếu việc lược bỏ mảnh nhỏ, và phân công công việc rõ ràng giữa các thành viên. Tuy nhiên, ở tác phẩm tái hiện mặt bàn cao hơn bản gốc làm lệch bố cục, sắc độ màu chưa đúng nên bình hoa chìm vào nền, và việc lược bỏ mảnh nhỏ làm mất chi tiết lá, cánh hoa; nhóm có thể chồng thêm lớp giấy để ra đúng sắc độ thay vì đơn giản hóa mảng.","Slide của nhóm em thanh lịch, nhất quán, đúng tỉ lệ, đủ cấu trúc và các hình đều có chú thích. Đây là phần nhóm em làm rất tốt.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin."]},"265054031":{"g":"G16","none":1},"265034449":{"g":"G09","s":[1.5,2.25,1.25,2.5],"b":0.0,"t":7.5,"fb":"Bài làm của nhóm em có một số điểm đáng ghi nhận. Bản tái hiện trên ibisPaint rất sát ánh sáng và không gian của bản gốc; phần phân tích khung cửa, khoảng trống và chiếc ghế trắng cho thấy nhóm quan sát kỹ; phần cảm nhận rút ra bài học thiết kế về tối giản, không gian âm; slide có thiết kế mạnh.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, bài chưa xác định thời kỳ, khuynh hướng của tranh và còn thiếu chất liệu, bối cảnh. Thứ hai, phần ý nghĩa còn chung, chưa có căn cứ. Thứ ba, nhật ký thiếu lý do chọn công cụ, khó khăn, giải pháp và phân công. Cuối cùng, bài còn thiếu slide vị trí trong lịch sử mỹ thuật và ý tưởng tái hiện.","f":["Nhóm em phân tích được khung cửa nối tiếp tạo chiều sâu, khoảng trống và chiếc ghế trắng làm tiêu điểm, cho thấy nhóm quan sát tranh kỹ; nhóm liên hệ được bối cảnh đô thị hóa và quan niệm cái đẹp tối giản; phần cảm nhận gắn với bóng lưng, chiếc ghế trắng và rút ra bài học thiết kế về tối giản, không gian âm. Tuy nhiên, phần giới thiệu còn thiếu chất liệu và bối cảnh sáng tác; bài chưa xác định tranh thuộc thời kỳ, khuynh hướng nào (tranh nội thất Bắc Âu cuối thế kỷ 19, đầu thế kỷ 20) nên phần ngôn ngữ nghệ thuật cũng bị giới hạn điểm; phần ý nghĩa còn chung, chưa giải thích các chi tiết kèm căn cứ.","Bản tái hiện trên ibisPaint của nhóm em rất sát ánh sáng và không gian của bản gốc, đúng bố cục, bảng màu và hoàn thiện cao; nhật ký có ảnh các mốc kèm mô tả từng bước. Tuy nhiên, nhật ký mới nêu app, cọ, bảng màu mà chưa nói lý do chọn, chưa có phần khó khăn và giải pháp, và chưa ghi phân công giữa hai bạn.","Slide của nhóm em có thiết kế mạnh, nhất quán, đúng tỉ lệ và các hình có chú thích. Tuy nhiên, bài còn thiếu slide vị trí trong lịch sử mỹ thuật và slide ý tưởng tái hiện, mục lục có phần chuẩn bị bối cảnh và đạo cụ nhưng không có nội dung.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin."]},"265043398":{"g":"G08","s":[2.5,2.75,1.25,2.25],"b":0.0,"t":8.75,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần phân tích ngôn ngữ nghệ thuật, ý nghĩa ba bông hoa và bài học phối màu rất tốt; bản đính len sáng tạo về chất liệu nhưng vẫn giữ được bố cục và hướng nét cọ; nhật ký đầy đủ, phân công rõ.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần trường phái cần chỉ ra đặc điểm trên tranh qua chi tiết, màu cụ thể. Thứ hai, ba bông hoa chưa thể hiện được ba sắc độ héo khác nhau. Cuối cùng, hình trong slide cần có chú thích.","f":["Nhóm em giới thiệu đủ thời gian, địa điểm Arles và chuỗi tranh trang trí Ngôi nhà vàng; phân tích tốt bố cục, màu bổ túc, nét cọ dày tạo khối; giải thích ba bông hoa ở ba giai đoạn và ý nghĩa biểu tượng hoa hướng dương; phần xã hội liên hệ Japonisme và phần cảm nhận có bài học rõ về phá quy chuẩn phối màu, tạo điểm nhấn trong thiết kế. Tuy nhiên, phần trường phái mới nêu đặc điểm Hậu Ấn tượng chung, chưa chỉ ra trên tranh qua chi tiết, màu cụ thể (ví dụ nền xanh ngọc làm nổi sắc vàng, nhát cọ dày trên cánh hoa).","Bản đính len của nhóm em đúng bố cục, len cuộn theo hướng nét cọ, đủ ba bông ở ba giai đoạn và hoàn thiện; nhật ký đầy đủ, phân công công việc rõ ràng. Tuy nhiên, màu ba bông hoa còn đều nhau, chưa lột tả được ba sắc độ như bản gốc.","Slide của nhóm em nhất quán, dễ đọc, đúng tỉ lệ và đủ cấu trúc. Tuy nhiên, các hình trong slide chưa có chú thích tên tác phẩm và nguồn.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin. Tuy nhiên, một câu trả lời còn thiếu độ sâu/chưa đúng thông tin."]},"265030097":{"g":"G11","s":[2.0,2.25,0.5,2.5],"b":0.0,"t":7.25,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần ngôn ngữ nghệ thuật phân tích tốt bố cục tam giác và điểm nhìn; bản tái hiện trên ibisPaint rất sát bố cục và màu; phần xã hội liên hệ đúng thời kỳ.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần giao thoa Đông Tây, ý nghĩa và cảm nhận cần gắn với chi tiết cụ thể trên tranh. Thứ hai, slide 5 dùng nhầm hình tranh khác. Thứ ba, nhật ký cần lý do chọn công cụ, cách khắc phục cụ thể và phân công. Cuối cùng, slide chưa đủ cấu trúc theo đề, quá dày chữ và ảnh chưa có chú thích.","f":["Nhóm em giới thiệu đủ năm, chất liệu, kích thước, nơi lưu giữ và nơi sáng tác; phần ngôn ngữ nghệ thuật phân tích tốt bố cục tam giác, đường cong và thẳng, điểm nhìn dẫn qua màu áo, mỗi yếu tố đều chỉ rõ vị trí và tác dụng; phần xã hội liên hệ đúng thời thuộc địa và đời sống thị dân Hà Nội. Tuy nhiên, phần \"giao thoa Đông Tây\" chưa chỉ ra trên tranh; phần ý nghĩa mới có một chi tiết là ba nhân vật nhìn các hướng khác nhau; phần cảm nhận còn chung, nên gắn với chi tiết tranh và bài học cho việc vẽ của nhóm.","Bản tái hiện trên ibisPaint của nhóm em rất sát bố cục và màu, hoàn thiện; nhật ký có ảnh các mốc. Tuy nhiên, nhật ký mới nêu app, cọ, bảng màu mà chưa nói lý do chọn; phần khó khăn khi phối màu nền chỉ ghi cách khắc phục là \"học thêm cách pha màu\", chưa có cách làm cụ thể; nhóm chưa đối chiếu với bản gốc và chưa ghi phân công giữa hai bạn.","Slide của nhóm em đúng tỉ lệ và đủ số lượng slide. Tuy nhiên, bài chưa tách slide Tác phẩm và xã hội theo cấu trúc đề, slide tái hiện mới nêu công cụ mà chưa nêu ý tưởng; hầu hết slide là đoạn văn rất dày, chữ nhỏ, khó theo dõi khi đọc, nên rút thành ý chính và tăng hình; các ảnh trong slide chưa có chú thích.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin."]},"265046372":{"g":"G22","s":[1.5,2.5,1.0,2.5],"b":0.25,"t":7.75,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Bản tái hiện bằng acrylic khá sát với tác phẩm gốc; phần phân tích tương phản kích thước có tác dụng; slide rõ, hình có chú thích.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần trường phái cần nêu dòng tranh ukiyo-e và chỉ ra trên tranh. Thứ hai, phần ý nghĩa, xã hội và cảm nhận còn ngắn, chung. Thứ ba, nhật ký cần ghi rõ phân công công việc của các thành viên. Cuối cùng, slide chưa đủ cấu trúc theo đề và một vài slide còn dày chữ.","f":["Nhóm em giới thiệu đủ niên đại, chất liệu khắc gỗ và bộ 36 cảnh núi Phú Sĩ; phân tích được sóng tiền cảnh, tương phản kích thước và màu có tác dụng. Tuy nhiên, phần trường phái mới nêu thời kỳ Edo, cần nêu dòng tranh khắc gỗ ukiyo-e và chỉ ra đặc điểm đó trên tranh; phần ý nghĩa về sức mạnh thiên nhiên còn ngắn; bài chưa có phần tác phẩm và xã hội; phần cảm nhận có chi tiết sóng và núi Phú Sĩ nhưng phần bài học liên hệ còn chung.","Bản tái hiện bằng acrylic của nhóm em gần giống với tác phẩm gốc, đúng bố cục, màu và hoàn thiện; nhật ký có ảnh các mốc và lý do vẽ tay. Tuy nhiên, phần nhật ký chưa ghi phân công công việc cụ thể giữa hai bạn.","Slide của nhóm em rõ, đọc được, đúng tỉ lệ và các hình có chú thích. Tuy nhiên, bài chưa có slide riêng cho Vị trí trong lịch sử mỹ thuật, Tác phẩm và xã hội; slide 5 và 6 còn dày chữ.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."],"bn":"Điểm cộng khuyến khích do tham gia hỗ trợ sự kiện."},"225200738":{"g":"G13","s":[1.75,2.25,0.75,2.5],"b":0.0,"t":7.25,"fb":"Bài làm của em có một số điểm đáng ghi nhận. Phần giải thích phương pháp paranoiac-critical và các biểu tượng kiến, ruồi, đồng hồ rất chi tiết; bản tái hiện vector đúng bố cục và màu, ảnh tiến trình thấy rõ giao diện phần mềm.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, bối cảnh ghi sai mốc Thế chiến II và còn thiếu nơi lưu giữ, phần xã hội. Thứ hai, phần ngôn ngữ nghệ thuật và cảm nhận cần cụ thể hơn. Thứ ba, bản vector mất chất sơn, nhật ký thiếu lý do chọn công cụ và phần đối chiếu. Cuối cùng, slide cần làm khổ 16:9, sửa lỗi dấu và bổ sung slide ý tưởng tái hiện.","f":["Em xác định đúng Siêu thực và giải thích phương pháp paranoiac-critical gắn với đồng hồ chảy; phần ý nghĩa rất chi tiết với kiến, ruồi, chân dung tự họa và đồng hồ. Tuy nhiên, bài ghi tranh ra đời \"giữa Thế chiến thứ 2 năm 1931\" là chưa đúng vì Thế chiến II bắt đầu năm 1939, nên phần bối cảnh và phần xã hội đều chưa đạt, bài cũng thiếu nơi lưu giữ; phần ngôn ngữ nghệ thuật mới nói đối nghịch mềm và cứng, cần thêm bố cục, ánh sáng; phần cảm nhận về thời gian có ý riêng nhưng chưa gắn chi tiết tranh và chưa có bài học cho việc thiết kế của em.","Bản tái hiện vector của em đúng bố cục, bảng màu và hoàn thành; ảnh tiến trình thấy rõ giao diện Paint và Illustrator qua các giai đoạn. Tuy nhiên, việc chuyển sang vector phẳng làm mất chất sơn của bản gốc trong khi digital vẫn có thể mô phỏng; nhật ký chưa nói lý do chọn Paint và Illustrator, và chưa tự chỉ ra chỗ bản tái hiện còn khác bản gốc.","Slide của em có phong cách riêng và có ghi nguồn tham khảo. Tuy nhiên, chữ bị lỗi dấu, trang 9 chữ chạy chéo khó đọc; file làm khổ A4 dọc thay vì 16:9, và bài còn thiếu slide ý tưởng tái hiện.","Em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; phong thái rõ ràng, tự tin; em trả lời tốt các câu hỏi phần Q&A."]},"265154073":{"g":"G02","s":[1.25,2.0,1.25,2.5],"b":0.0,"t":7.0,"fb":"Bài làm của nhóm em có một số điểm đáng ghi nhận. Bản tái hiện bằng sáp màu đúng bố cục, bảng màu và hoàn thành; slide sạch, dễ đọc, hình có chú thích.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần phân tích cần chỉ ra đặc điểm Biểu hiện trên chính bức Tiếng thét và bổ sung chất liệu, bối cảnh, phần tác phẩm và xã hội. Thứ hai, nhật ký cần nêu lý do chọn sáp màu, khó khăn và cách làm cụ thể, phân công. Thứ ba, bài cần theo đúng cấu trúc slide của đề. Cuối cùng, phần cảm nhận nên rút ra bài học cho việc vẽ của nhóm.","f":["Nhóm em nhận ra đúng Chủ nghĩa Biểu hiện, có nhắc nét xoáy và gam đỏ cam của Munch, và chọn được chi tiết nhân vật bịt tai để nói về nỗi lo âu. Tuy nhiên, phần giới thiệu còn thiếu chất liệu và bối cảnh ra đời cụ thể của bức tranh; đặc điểm Biểu hiện chưa được chỉ ra trên chính bức Tiếng thét (bầu trời đỏ uốn lượn, lan can chạy chéo, nhân vật biến dạng); phần ngôn ngữ nghệ thuật cần phân tích bố cục, cây cầu và nhân vật của tác phẩm này chứ không chỉ nói chung về tranh Munch; nhóm chưa có phần tác phẩm và xã hội, và phần cảm nhận còn chung, chưa rút ra bài học cho việc vẽ, thiết kế của mình.","Bản tái hiện bằng sáp màu của nhóm em đúng bố cục, bảng màu và hoàn thành trọn vẹn; nhật ký có ảnh các mốc 20, 50, 75, 100%. Tuy nhiên, tỉ lệ nhân vật còn lệch và nét sáp chưa gợi được chuyển động uốn lượn đặc trưng của bầu trời; nhật ký mới liệt kê dụng cụ mà chưa nói vì sao chọn sáp màu, phần khó khăn chỉ ghi \"tô chậm, tỉ mỉ\" mà chưa có kỹ thuật cụ thể và chưa đối chiếu với bản gốc, và chưa ghi phân công giữa hai bạn.","Slide của nhóm em sạch, dễ đọc, đúng tỉ lệ và các hình đều có chú thích tên, năm. Tuy nhiên, bài chưa theo cấu trúc đề: còn thiếu các slide vị trí trong lịch sử mỹ thuật, tác phẩm và xã hội, ý tưởng tái hiện và sản phẩm hoàn chỉnh; lần sau em nên đối chiếu dàn ý với đề trước khi làm slide.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"265018728":{"g":"G19","s":[1.5,2.5,0.75,2.25],"b":0.0,"t":7.0,"fb":"Bài làm của em có nhiều điểm đáng ghi nhận. Em giải thích hay ý nghĩa khoảnh khắc thoáng qua qua chi tiết váy và nắng trên cỏ; bản tái hiện bằng màu nước đúng bố cục, màu và hoàn thiện.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, thông tin năm mất của Camille bị ghi sai. Thứ hai, phần ngôn ngữ nghệ thuật còn ít và bài chưa có phần tác phẩm và xã hội. Thứ ba, phần cỏ trong tác phẩm tái hiện còn lược giản, nhật ký chưa tự đối chiếu với bản gốc. Cuối cùng, slide chưa đủ cấu trúc theo đề, còn chữ nhỏ, dày và nhiều ảnh chưa có chú thích.","f":["Em xác định được trường phái Ấn tượng và gắn với khoảnh khắc ngoảnh đầu, váy bay trong gió; giải thích tốt ý nghĩa khoảnh khắc thoáng qua qua chi tiết váy và nắng trên cỏ. Tuy nhiên, slide cuộc đời Monet ghi Camille mất năm 1897, đúng là năm 1879; phần ngôn ngữ nghệ thuật còn ít phân tích bố cục, màu và nét cọ; bài chưa có phần tác phẩm và xã hội.","Bản tái hiện bằng màu nước của em đúng bố cục, bảng màu và hoàn thiện; nhật ký có ảnh các mốc và nêu lý do chọn màu nước. Tuy nhiên, phần cỏ còn bị lược giản, chưa hoàn thiện chi tiết; phần khó khăn chưa tự chỉ ra chỗ bản tái hiện còn khác bản gốc và lý do cụ thể.","Slide của em đẹp, đúng tỉ lệ. Tuy nhiên, bài chưa có slide Ngôn ngữ nghệ thuật và Tác phẩm và xã hội riêng nên chưa đủ cấu trúc theo đề; chữ còn nhỏ và dày ở trang 4, trang 10, và nhiều ảnh chưa có chú thích tên tác phẩm, nguồn.","Thời lượng đúng khoảng 5 đến 7 phút; phong thái rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu. Tuy nhiên, phần trình bày còn ngắn, chưa đủ các phần theo đề."]},"265021619":{"g":"G02","s":[1.25,2.0,1.25,2.5],"b":0.0,"t":7.0,"fb":"Bài làm của nhóm em có một số điểm đáng ghi nhận. Bản tái hiện bằng sáp màu đúng bố cục, bảng màu và hoàn thành; slide sạch, dễ đọc, hình có chú thích.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần phân tích cần chỉ ra đặc điểm Biểu hiện trên chính bức Tiếng thét và bổ sung chất liệu, bối cảnh, phần tác phẩm và xã hội. Thứ hai, nhật ký cần nêu lý do chọn sáp màu, khó khăn và cách làm cụ thể, phân công. Thứ ba, bài cần theo đúng cấu trúc slide của đề. Cuối cùng, phần cảm nhận nên rút ra bài học cho việc vẽ của nhóm.","f":["Nhóm em nhận ra đúng Chủ nghĩa Biểu hiện, có nhắc nét xoáy và gam đỏ cam của Munch, và chọn được chi tiết nhân vật bịt tai để nói về nỗi lo âu. Tuy nhiên, phần giới thiệu còn thiếu chất liệu và bối cảnh ra đời cụ thể của bức tranh; đặc điểm Biểu hiện chưa được chỉ ra trên chính bức Tiếng thét (bầu trời đỏ uốn lượn, lan can chạy chéo, nhân vật biến dạng); phần ngôn ngữ nghệ thuật cần phân tích bố cục, cây cầu và nhân vật của tác phẩm này chứ không chỉ nói chung về tranh Munch; nhóm chưa có phần tác phẩm và xã hội, và phần cảm nhận còn chung, chưa rút ra bài học cho việc vẽ, thiết kế của mình.","Bản tái hiện bằng sáp màu của nhóm em đúng bố cục, bảng màu và hoàn thành trọn vẹn; nhật ký có ảnh các mốc 20, 50, 75, 100%. Tuy nhiên, tỉ lệ nhân vật còn lệch và nét sáp chưa gợi được chuyển động uốn lượn đặc trưng của bầu trời; nhật ký mới liệt kê dụng cụ mà chưa nói vì sao chọn sáp màu, phần khó khăn chỉ ghi \"tô chậm, tỉ mỉ\" mà chưa có kỹ thuật cụ thể và chưa đối chiếu với bản gốc, và chưa ghi phân công giữa hai bạn.","Slide của nhóm em sạch, dễ đọc, đúng tỉ lệ và các hình đều có chú thích tên, năm. Tuy nhiên, bài chưa theo cấu trúc đề: còn thiếu các slide vị trí trong lịch sử mỹ thuật, tác phẩm và xã hội, ý tưởng tái hiện và sản phẩm hoàn chỉnh; lần sau em nên đối chiếu dàn ý với đề trước khi làm slide.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"265038326":{"g":"G11","s":[2.0,2.25,0.5,2.5],"b":0.0,"t":7.25,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần ngôn ngữ nghệ thuật phân tích tốt bố cục tam giác và điểm nhìn; bản tái hiện trên ibisPaint rất sát bố cục và màu; phần xã hội liên hệ đúng thời kỳ.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần giao thoa Đông Tây, ý nghĩa và cảm nhận cần gắn với chi tiết cụ thể trên tranh. Thứ hai, slide 5 dùng nhầm hình tranh khác. Thứ ba, nhật ký cần lý do chọn công cụ, cách khắc phục cụ thể và phân công. Cuối cùng, slide chưa đủ cấu trúc theo đề, quá dày chữ và ảnh chưa có chú thích.","f":["Nhóm em giới thiệu đủ năm, chất liệu, kích thước, nơi lưu giữ và nơi sáng tác; phần ngôn ngữ nghệ thuật phân tích tốt bố cục tam giác, đường cong và thẳng, điểm nhìn dẫn qua màu áo, mỗi yếu tố đều chỉ rõ vị trí và tác dụng; phần xã hội liên hệ đúng thời thuộc địa và đời sống thị dân Hà Nội. Tuy nhiên, phần \"giao thoa Đông Tây\" chưa chỉ ra trên tranh; phần ý nghĩa mới có một chi tiết là ba nhân vật nhìn các hướng khác nhau; phần cảm nhận còn chung, nên gắn với chi tiết tranh và bài học cho việc vẽ của nhóm.","Bản tái hiện trên ibisPaint của nhóm em rất sát bố cục và màu, hoàn thiện; nhật ký có ảnh các mốc. Tuy nhiên, nhật ký mới nêu app, cọ, bảng màu mà chưa nói lý do chọn; phần khó khăn khi phối màu nền chỉ ghi cách khắc phục là \"học thêm cách pha màu\", chưa có cách làm cụ thể; nhóm chưa đối chiếu với bản gốc và chưa ghi phân công giữa hai bạn.","Slide của nhóm em đúng tỉ lệ và đủ số lượng slide. Tuy nhiên, bài chưa tách slide Tác phẩm và xã hội theo cấu trúc đề, slide tái hiện mới nêu công cụ mà chưa nêu ý tưởng; hầu hết slide là đoạn văn rất dày, chữ nhỏ, khó theo dõi khi đọc, nên rút thành ý chính và tăng hình; các ảnh trong slide chưa có chú thích.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin."]},"265027600":{"g":"G09","s":[1.5,2.25,1.25,2.5],"b":0.25,"t":7.75,"fb":"Bài làm của nhóm em có một số điểm đáng ghi nhận. Bản tái hiện trên ibisPaint rất sát ánh sáng và không gian của bản gốc; phần phân tích khung cửa, khoảng trống và chiếc ghế trắng cho thấy nhóm quan sát kỹ; phần cảm nhận rút ra bài học thiết kế về tối giản, không gian âm; slide có thiết kế mạnh.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, bài chưa xác định thời kỳ, khuynh hướng của tranh và còn thiếu chất liệu, bối cảnh. Thứ hai, phần ý nghĩa còn chung, chưa có căn cứ. Thứ ba, nhật ký thiếu lý do chọn công cụ, khó khăn, giải pháp và phân công. Cuối cùng, bài còn thiếu slide vị trí trong lịch sử mỹ thuật và ý tưởng tái hiện.","f":["Nhóm em phân tích được khung cửa nối tiếp tạo chiều sâu, khoảng trống và chiếc ghế trắng làm tiêu điểm, cho thấy nhóm quan sát tranh kỹ; nhóm liên hệ được bối cảnh đô thị hóa và quan niệm cái đẹp tối giản; phần cảm nhận gắn với bóng lưng, chiếc ghế trắng và rút ra bài học thiết kế về tối giản, không gian âm. Tuy nhiên, phần giới thiệu còn thiếu chất liệu và bối cảnh sáng tác; bài chưa xác định tranh thuộc thời kỳ, khuynh hướng nào (tranh nội thất Bắc Âu cuối thế kỷ 19, đầu thế kỷ 20) nên phần ngôn ngữ nghệ thuật cũng bị giới hạn điểm; phần ý nghĩa còn chung, chưa giải thích các chi tiết kèm căn cứ.","Bản tái hiện trên ibisPaint của nhóm em rất sát ánh sáng và không gian của bản gốc, đúng bố cục, bảng màu và hoàn thiện cao; nhật ký có ảnh các mốc kèm mô tả từng bước. Tuy nhiên, nhật ký mới nêu app, cọ, bảng màu mà chưa nói lý do chọn, chưa có phần khó khăn và giải pháp, và chưa ghi phân công giữa hai bạn.","Slide của nhóm em có thiết kế mạnh, nhất quán, đúng tỉ lệ và các hình có chú thích. Tuy nhiên, bài còn thiếu slide vị trí trong lịch sử mỹ thuật và slide ý tưởng tái hiện, mục lục có phần chuẩn bị bối cảnh và đạo cụ nhưng không có nội dung.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin."],"bn":"Điểm cộng khuyến khích do tham gia hỗ trợ sự kiện."},"265036839":{"g":"G12","s":[1.5,2.25,1.25,2.5],"b":0.0,"t":7.5,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Bản tái hiện bằng bút acrylic hoàn thiện trên khổ lớn, nhật ký có khó khăn từng giai đoạn và phân công rõ; slide đẹp, nhất quán.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, bài thiếu mục Nội dung và ý nghĩa. Thứ hai, phần ngôn ngữ nghệ thuật và cảm nhận còn ngắn, chủ yếu mô tả. Thứ ba, dáng bình và mảng hoa còn lệch, nét viền đậm không giống bản gốc. Cuối cùng, nhật ký cần nêu lý do chọn bút acrylic.","f":["Nhóm em giới thiệu đủ năm, nơi vẽ, chất liệu, kích thước và bối cảnh; xác định Hậu Ấn tượng và gắn với nét cọ trên cánh hoa, lá; phần xã hội liên hệ truyền thống tĩnh vật thế kỷ 19. Tuy nhiên, bài thiếu hẳn mục Nội dung và ý nghĩa (số mục nhảy từ 1.3 sang 1.5), ý nghĩa tác phẩm chỉ được nhắc lướt ở phần đầu; phần ngôn ngữ nghệ thuật còn ngắn, chủ yếu mô tả, nên giải thích tác dụng của bố cục và màu; phần cảm nhận về hy vọng còn chung, chưa có bài học cho việc vẽ của nhóm.","Bản tái hiện bằng bút acrylic của nhóm em đúng bảng màu, hoàn thiện trên khổ lớn; nhật ký có ảnh các mốc, mỗi giai đoạn có khó khăn và cách giải quyết cụ thể, nhóm tự nhận màu sắc và nét vẽ chưa giống bản gốc do khác chất liệu, phân công công việc rõ ràng. Tuy nhiên, dáng bình và mảng hoa còn lệch tỉ lệ, nét viền đậm là lựa chọn riêng chứ không do chất liệu; nhật ký chưa nói lý do chọn bút acrylic.","Slide của nhóm em đẹp, nhất quán, đúng tỉ lệ, đủ số lượng slide và các hình có chú thích. Tuy nhiên, bài thiếu mục 1.4 Nội dung và ý nghĩa nên chưa đủ cấu trúc theo đề.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời tốt phần Q&A."]},"265027385":{"g":"G25","s":[2.0,2.25,0.75,2.5],"b":0.0,"t":7.5,"fb":"Bài làm của em có nhiều điểm đáng ghi nhận. Em giải thích rõ ý nghĩa bầu trời và cánh đồng, và rút ra được bài học sáng tạo riêng là dám bộc lộ tiếng nói cá nhân; bản tái hiện bằng sáp dầu phủ kín, đắp màu dày; nhật ký nêu khó khăn bị lem và cách xử lý cụ thể.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần trường phái nên đặt cạnh Ấn tượng để làm rõ đặc điểm Hậu Ấn tượng, và phần ngôn ngữ nghệ thuật cần phân tích sâu hơn. Thứ hai, bản tái hiện lệch đường chân trời, màu cánh đồng và có thêm chi tiết không có trong bản gốc. Thứ ba, nhật ký cần tự chỉ ra những chỗ khác này. Cuối cùng, slide vượt số lượng, còn lỗi chính tả và hình chưa có chú thích.","f":["Em giới thiệu đủ tên, năm, chất liệu và bối cảnh ở Auvers-sur-Oise; xác định đúng Hậu Ấn tượng, nêu được đặc điểm bộc lộ nội tâm thay vì chỉ ghi lại ánh sáng thực tế, và chỉ ra trên bầu trời dông bão, cánh đồng lúa mì; giải thích rõ ý nghĩa bầu trời u tối và cánh đồng; liên hệ được cách mạng công nghiệp; phần cảm nhận gắn với những đường ngang tối giản của tranh và rút ra bài học sáng tạo cụ thể là dám bộc lộ tiếng nói cá nhân, biến cảm xúc thô ráp thành chất liệu nghệ thuật. Tuy nhiên, sự khác biệt với Ấn tượng mới được nhắc lướt trong một câu. Nếu em đặt hai trường phái cạnh nhau, ví dụ Monet dùng nét cọ ngắn để ghi lại ánh sáng thật trên cánh đồng, còn Van Gogh kéo nét dài và đẩy màu xanh chàm đậm để nói tâm trạng bất an, thì người xem sẽ thấy rõ vì sao bức tranh thuộc Hậu Ấn tượng và phần phân tích sẽ sâu, thuyết phục hơn. Phần ngôn ngữ nghệ thuật mỗi yếu tố mới có một, hai câu; em nên phân tích thêm các chi tiết như đốm hoa đỏ, hoa trắng ở tiền cảnh hay dải mây trắng sát chân trời và tác dụng của chúng. Với bài học ở phần cảm nhận, em có thể nói thêm sẽ áp dụng vào bài vẽ, thiết kế nào của mình, ví dụ dùng hướng nét và độ đậm của màu để thể hiện cảm xúc riêng.","Bản tái hiện bằng sáp dầu của em phủ kín, hoàn thiện; nhật ký có ảnh các mốc, nêu rõ lý do chọn sáp dầu để đắp dày như impasto, khó khăn bị lem và cách miết, di bằng tăm bông. Tuy nhiên, chân trời lượn sóng thay vì gần như phẳng, cánh đồng ngả vàng thiếu mảng xanh, có thêm đụn rơm và đám mây lớn không có trong bản gốc, nét trời bị di mịn; em chưa tự chỉ ra những chỗ khác này và lý do.","Slide của em đúng tỉ lệ. Tuy nhiên, bài có 15 slide, vượt mức 13; còn lỗi chính tả (“GIỚI HIỆU”, “tác phảm”); các hình chưa có chú thích tên tác phẩm và nguồn.","Em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; phong thái rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"265045369":{"g":"G04","s":[1.75,2.5,1.25,2.5],"b":0.0,"t":8.0,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần ngôn ngữ nghệ thuật và ý nghĩa được phân tích tốt; bản tái hiện digital đúng bố cục, màu, hoàn thiện và nhật ký tự chỉ ra chỗ chưa giống kèm cách khắc phục cụ thể; slide đẹp, nhất quán.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, thông tin về tác giả và niên đại còn mâu thuẫn, cần kiểm tra lại nguồn. Thứ hai, phần giao thoa Đông Tây cần chỉ ra trên tranh. Thứ ba, nhật ký cần lý do chọn công cụ và phân công. Cuối cùng, số slide vượt mức.","f":["Nhóm em phân tích tốt màu, đường nét và bố cục hai nhân vật kèm tác dụng, giải thích rõ chủ đề dâng cúng, biểu tượng bó hoa và thông điệp hoài niệm của người nghệ sĩ xa xứ. Tuy nhiên, thông tin còn mâu thuẫn: trang 4 ghi tác giả tốt nghiệp khóa đầu tiên trong khi trang 6 ghi Khóa II, và phần xã hội liên hệ thập niên 1960 trong khi tranh ghi sáng tác 1930 đến 1940; nhóm cần kiểm tra lại nguồn. Phần \"giao thoa Đông Tây\" nên chỉ ra trên tranh chỗ nào là kỹ thuật phương Tây, chỗ nào là tinh thần phương Đông, và phần cảm nhận nên có bài học cụ thể cho việc vẽ của nhóm.","Bản tái hiện digital của nhóm em đúng bố cục, bảng màu, hoàn thiện và chuyển được chất sơn mềm của bản gốc; nhật ký có ảnh các mốc 20, 50, 70, 100%, tự chỉ ra các chỗ còn khác bản gốc (vân brush lặp, nét ngũ quan, màu nền) kèm cách khắc phục cụ thể. Tuy nhiên, nhật ký nêu app, cọ, bảng màu nhưng chưa nói lý do chọn và chưa ghi phân công giữa hai bạn.","Slide của nhóm em đẹp, nhất quán, chữ dễ đọc, đúng tỉ lệ và các hình có chú thích. Tuy nhiên, bài có khoảng 16 slide nội dung, vượt mức 9 đến 13 slide.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"265043440":{"g":"G20","s":[2.25,2.25,1.5,1.75],"b":0.0,"t":7.75,"fb":"Bài làm của em có nhiều điểm đáng ghi nhận. Phần phân tích bố cục và bối cảnh tốt; bản thêu kết hợp màu nước gợi được nhịp xoáy của bầu trời; slide nhất quán, dễ đọc.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần trường phái nên so sánh với trường phái khác, phần màu sắc cần nêu tác dụng và ý nghĩa biểu tượng cần có căn cứ từ thư, tiểu sử của Van Gogh. Thứ hai, ngôi làng tái hiện chưa đúng, có màu đỏ không có trong bản gốc. Thứ ba, ảnh sản phẩm cuối bị mờ. Cuối cùng, nhật ký cần tự đối chiếu với bản gốc.","f":["Em phân tích được bố cục cân bằng động với cây bách làm điểm tựa dẫn mắt, nét xoáy cuộn làm bầu trời chuyển động; giải thích được cây bách, mặt trăng, ngôi sao; liên hệ cuối thế kỷ 19 và ảnh hưởng tới Biểu hiện, Dã thú; phần cảm nhận có ý riêng. Tuy nhiên, phần trường phái đã chỉ ra trên tranh nhưng chưa so sánh với trường phái khác (ví dụ Ấn tượng) để làm rõ đặc điểm Hậu Ấn tượng; phần màu sắc chưa nêu tác dụng; ý nghĩa các biểu tượng mới dựa trên quan niệm văn hóa chung, chưa có căn cứ từ thư của Van Gogh hay hoàn cảnh ông ở Saint-Rémy.","Bản thêu kết hợp màu nước của em đúng bố cục, bảng màu và gợi được nhịp xoáy; nhật ký có ảnh các mốc, lý do chọn vật liệu và khó khăn tạo chuyển động với giải pháp nét li ti. Tuy nhiên, phần ngôi làng tái hiện chưa đúng và có màu đỏ không có trong bản gốc, ảnh sản phẩm cuối vẫn còn trong khung và bị mờ; em chưa tự chỉ ra chỗ bản tái hiện còn khác bản gốc.","Slide của em nhất quán, dễ đọc, đúng tỉ lệ, đủ cấu trúc và các hình có chú thích. Đây là phần em làm rất tốt.","Em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu. Tuy nhiên, phần trình bày còn ngắn; phụ thuộc vào giấy ghi chú khi trình bày, chưa đủ các phần theo đề; thời lượng trình bày chưa nằm trong khoảng 5 đến 7 phút."]},"265053285":{"g":"G01","s":[2.25,2.5,1.25,2.5],"b":0.0,"t":8.5,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Mô hình Chùa Một Cột rất công phu, đúng tỉ lệ và đủ các chi tiết cột đá, mái cong, rồng chầu, hồ sen; phần giới thiệu bối cảnh triều Lý đầy đủ, phần ngôn ngữ nghệ thuật phân tích đủ năm yếu tố kèm tác dụng và phần cảm nhận gợi được cách đưa hình tượng hoa sen vào thiết kế.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần phân tích nên chỉ ra dấu ấn nghệ thuật thời Lý ở chỗ nào trên công trình. Thứ hai, phần ý nghĩa cần thêm biểu tượng và căn cứ. Thứ ba, nhật ký còn thiếu cách xử lý khó khăn và phân công. Cuối cùng, một số slide còn dày chữ.","f":["Nhóm em giới thiệu đầy đủ niên đại, chất liệu, bối cảnh triều Lý và truyền thuyết giấc mộng của vua Lý Thái Tông; phần ngôn ngữ nghệ thuật phân tích đủ năm yếu tố hình khối, đường nét, màu, không gian, chất liệu kèm tác dụng; phần liên hệ với Thăng Long và Phật giáo thời Lý hợp lý; phần cảm nhận có ý riêng và gợi được cách dùng hình tượng hoa sen, mái cong cho logo, họa tiết, bao bì. Tuy nhiên, nhóm mới nêu chung \"mang đậm dấu ấn nghệ thuật thời Lý\" mà chưa chỉ ra dấu ấn đó ở đâu trên công trình (mái cong, đầu đao, rồng chầu, tỉ lệ cột và điện); phần ý nghĩa mới giải thích một biểu tượng là đóa sen, cần thêm ít nhất một biểu tượng khác và căn cứ từ sử liệu.","Mô hình của nhóm em rất công phu: đúng bố cục, tỉ lệ, màu sắc và giữ đủ cột đá, mái cong, rồng chầu, hồ sen, cầu thang; phần mái ngói, đèn và cảnh quan làm rất kỹ. Nhật ký có ảnh các mốc 10, 30, 50, 80, 100% và nêu rõ lý do chọn bìa formex, carton vì dễ cắt ghép. Tuy nhiên, phần khó khăn mới nêu việc cắt chi tiết nhỏ \"đòi hỏi sự tỉ mỉ\" mà chưa có cách xử lý cụ thể (dụng cụ gì, làm theo thứ tự nào) và chưa tự đối chiếu mô hình với công trình thật để chỉ ra chỗ còn khác; nhật ký cũng chưa ghi phân công giữa hai bạn.","Slide của nhóm em đẹp, nhất quán tông đỏ, đúng tỉ lệ, đủ số lượng slide và các hình có chú thích. Tuy nhiên, một số trang còn dày chữ (trang 5, trang 7), nên tách ý hoặc chuyển bớt sang hình.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"265047918":{"g":"G06","s":[2.25,2.0,1.25,2.5],"b":0.0,"t":8.0,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Nhóm phân tích được bố cục và ánh mắt làm điểm nhấn, liên hệ bối cảnh Âu hóa có dẫn chứng; bản tái hiện acrylic đúng màu, đắp nhiều lớp; slide nhất quán.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, mảng đen ghi tên làm lệch bố cục và khuôn mặt còn khác bản gốc. Thứ hai, phần màu sắc và cảm nhận cần gắn với chi tiết cụ thể. Thứ ba, nhật ký cần phần đối chiếu và phân công rõ ai làm gì. Cuối cùng, ảnh trong slide cần có chú thích.","f":["Nhóm em giới thiệu đủ năm, kích thước, chất liệu và bối cảnh vẽ cháu gái; phân tích được bố cục lệch trục cân bằng nhờ ghế mây và ánh mắt làm điểm nhấn; giải thích tình cảm gia đình, vẻ đẹp thuần khiết qua váy trắng, ghế mây, và liên hệ được bối cảnh Âu hóa qua nhận định của Thái Bá Vân. Tuy nhiên, phần trường phái nên giải thích rõ hơn vì sao xếp vào hiện thực; phần màu sắc mới nói \"đơn giản, dịu mắt\" mà chưa chỉ mảng màu nào ở đâu; phần cảm nhận còn chung, nên gắn với một chi tiết cụ thể của tranh và rút ra bài học cho việc vẽ của nhóm.","Bản tái hiện acrylic của nhóm em đúng bảng màu, hoàn thiện và đắp nhiều lớp màu; nhật ký có 5 giai đoạn đánh số và nêu rõ lý do chọn acrylic vì khô nhanh. Tuy nhiên, mảng đen ghi tên ở phía dưới làm lệch bố cục so với bản gốc và khuôn mặt nhân vật còn khác bản gốc; phần khó khăn chưa nhắc chuyện canh chỉnh bố cục và chưa tự đối chiếu với bản gốc, phần phân công chỉ ghi \"phù hợp khả năng\" mà chưa nói ai làm gì.","Slide của nhóm em nhất quán, dễ đọc, đúng tỉ lệ và đủ cấu trúc. Tuy nhiên, các ảnh trong slide chưa có chú thích tên tác phẩm và nguồn.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"265010812":{"g":"G08","s":[2.5,2.75,1.25,2.5],"b":0.0,"t":9.0,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần phân tích ngôn ngữ nghệ thuật, ý nghĩa ba bông hoa và bài học phối màu rất tốt; bản đính len sáng tạo về chất liệu nhưng vẫn giữ được bố cục và hướng nét cọ; nhật ký đầy đủ, phân công rõ.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần trường phái cần chỉ ra đặc điểm trên tranh qua chi tiết, màu cụ thể. Thứ hai, ba bông hoa chưa thể hiện được ba sắc độ khác nhau. Cuối cùng, hình trong slide cần có chú thích.","f":["Nhóm em giới thiệu đủ thời gian, địa điểm Arles và chuỗi tranh trang trí Ngôi nhà vàng; phân tích tốt bố cục, màu bổ túc, nét cọ dày tạo khối; giải thích ba bông hoa ở ba giai đoạn và ý nghĩa biểu tượng hoa hướng dương; phần xã hội liên hệ Japonisme và phần cảm nhận có bài học rõ về phá quy chuẩn phối màu, tạo điểm nhấn trong thiết kế. Tuy nhiên, phần trường phái mới nêu đặc điểm Hậu Ấn tượng chung, chưa chỉ ra trên tranh qua chi tiết, màu cụ thể (ví dụ nền xanh ngọc làm nổi sắc vàng, nhát cọ dày trên cánh hoa).","Bản đính len của nhóm em đúng bố cục, len cuộn theo hướng nét cọ, đủ ba bông ở ba giai đoạn và hoàn thiện; nhật ký đầy đủ, phân công công việc rõ ràng. Tuy nhiên, màu ba bông hoa còn đều nhau, chưa lột tả được ba sắc độ như bản gốc.","Slide của nhóm em nhất quán, dễ đọc, đúng tỉ lệ và đủ cấu trúc. Tuy nhiên, các hình trong slide chưa có chú thích tên tác phẩm và nguồn.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"265388128":{"g":"G10","s":[2.25,2.5,0.5,2.5],"b":0.0,"t":7.75,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần giới thiệu, ý nghĩa và cảm nhận đầy đủ; bản tái hiện bằng gouache sát bố cục, chi tiết mặt và tay vẽ kỹ; nhật ký có phân công rõ.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần trường phái cần chỉ ra trên tranh. Thứ hai, nhật ký cần lý do chọn công cụ và phần đối chiếu với bản gốc. Thứ ba, file cần làm đúng tỉ lệ 16:9. Cuối cùng, ảnh trong slide cần có chú thích.","f":["Nhóm em giới thiệu đủ năm, chất liệu, kích thước, nơi lưu giữ và bối cảnh vẽ cháu gái; giải thích được ánh mắt ngây thơ và tình thương của họa sĩ; liên hệ thời Pháp thuộc với bức tranh tươi sáng; phần cảm nhận nêu rõ lý do chọn tác phẩm và điều học được về màu. Phần ngôn ngữ nghệ thuật phân tích bố cục lệch trái, màu nhấn và điểm nhấn môi đỏ có tác dụng. Tuy nhiên, phần trường phái mới nói chung về tả thực phương Tây và nét phương Đông, chưa chỉ ra trên tranh ở chi tiết nào; phần chất liệu còn dừng ở mô tả.","Bản tái hiện bằng gouache của nhóm em sát bố cục, tông màu, dáng nhân vật, chi tiết mặt và tay vẽ kỹ; nhật ký có ảnh từng bước, nêu khó khăn khi nhìn màu, run nét và cách xử lý, phân công công việc rõ ràng giữa các thành viên. Tuy nhiên, nhật ký mới liệt kê cọ, gouache, giấy mà chưa nói lý do chọn, và chưa tự chỉ ra chỗ bản tái hiện còn khác bản gốc.","Slide của nhóm em trang trí ấm, dễ xem. Tuy nhiên, vài trang còn dày chữ; file làm khổ A4 dọc thay vì 16:9, và nhiều ảnh chưa có chú thích tên tác phẩm, nguồn.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin."]},"265054486":{"g":"G10","s":[2.25,2.5,0.5,2.5],"b":0.0,"t":7.75,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần giới thiệu, ý nghĩa và cảm nhận đầy đủ; bản tái hiện bằng gouache sát bố cục, chi tiết mặt và tay vẽ kỹ; nhật ký có phân công rõ.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần trường phái cần chỉ ra trên tranh. Thứ hai, nhật ký cần lý do chọn công cụ và phần đối chiếu với bản gốc. Thứ ba, file cần làm đúng tỉ lệ 16:9. Cuối cùng, ảnh trong slide cần có chú thích.","f":["Nhóm em giới thiệu đủ năm, chất liệu, kích thước, nơi lưu giữ và bối cảnh vẽ cháu gái; giải thích được ánh mắt ngây thơ và tình thương của họa sĩ; liên hệ thời Pháp thuộc với bức tranh tươi sáng; phần cảm nhận nêu rõ lý do chọn tác phẩm và điều học được về màu. Phần ngôn ngữ nghệ thuật phân tích bố cục lệch trái, màu nhấn và điểm nhấn môi đỏ có tác dụng. Tuy nhiên, phần trường phái mới nói chung về tả thực phương Tây và nét phương Đông, chưa chỉ ra trên tranh ở chi tiết nào; phần chất liệu còn dừng ở mô tả.","Bản tái hiện bằng gouache của nhóm em sát bố cục, tông màu, dáng nhân vật, chi tiết mặt và tay vẽ kỹ; nhật ký có ảnh từng bước, nêu khó khăn khi nhìn màu, run nét và cách xử lý, phân công công việc rõ ràng giữa các thành viên. Tuy nhiên, nhật ký mới liệt kê cọ, gouache, giấy mà chưa nói lý do chọn, và chưa tự chỉ ra chỗ bản tái hiện còn khác bản gốc.","Slide của nhóm em trang trí ấm, dễ xem. Tuy nhiên, vài trang còn dày chữ; file làm khổ A4 dọc thay vì 16:9, và nhiều ảnh chưa có chú thích tên tác phẩm, nguồn.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin."]},"265025450":{"g":"G17","s":[2.75,1.75,1.0,2.5],"b":0.0,"t":8.0,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần phân tích rất tốt, so sánh Phục Hưng với Trung Cổ và chỉ ra trên tranh, phân tích bố cục, sfumato, biểu tượng chồn ermine có chiều sâu; nhật ký nêu khó khăn rất cụ thể và tự nhận chỗ chưa giống.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, mốc thời gian Leonardo học ở xưởng Verrocchio bị ghi sai. Thứ hai, bản tái hiện còn lệch tỉ lệ, khuôn mặt chưa giống và băng đô kéo dài quá khối đầu. Thứ ba, sản phẩm in khổ A3 thay vì A4 và hình sản phẩm trong slide bị mờ. Cuối cùng, ảnh tiến trình chưa thấy bảng màu và nhật ký chưa ghi phân công.","f":["Phần phân tích của nhóm em rất tốt: đủ thông tin tác phẩm và bối cảnh Ludovico Sforza đặt hàng; so sánh Phục Hưng với Trung Cổ và chỉ ra trên tranh qua tư thế xoay đầu, sáng tối, khớp ngón tay; phân tích bố cục kim tự tháp xoắn, contrapposto, sfumato, tương phản đỏ, lam, trắng; giải thích biểu tượng chồn ermine và liên hệ được xã hội cung đình; phần cảm nhận có bài học cho người học thiết kế. Tuy nhiên, slide giới thiệu tác giả ghi Leonardo học ở xưởng Verrocchio đến năm 1467, trong khi thực tế ông theo học khoảng từ 1466 đến 1476; nhóm cần kiểm tra lại mốc thời gian.","Bản tái hiện digital của nhóm em đúng bảng màu; nhật ký nêu rõ lý do chọn phần mềm, khó khăn từng giai đoạn rất cụ thể (tỉ lệ, phối màu, lông trắng, ánh mắt) kèm cách xử lý và tự nhận phần mắt chưa giống bản gốc. Tuy nhiên, bố cục và tỉ lệ còn lệch, khuôn mặt chưa giống, đường băng đô trên trán kéo dài quá khối đầu; sản phẩm in khổ A3 thay vì A4; ảnh tiến trình chưa thấy bảng màu; nhật ký chưa ghi phân công giữa hai bạn.","Slide của nhóm em đúng tỉ lệ, đủ cấu trúc và các hình có chú thích. Tuy nhiên, hình sản phẩm cuối bị mờ, không căng nét nên khó xem chi tiết; nên xuất ảnh ở độ phân giải cao hơn.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"265400623":{"g":"G23","s":[2.75,1.75,0.75,2.5],"b":0.0,"t":7.75,"fb":"Bài làm của em có nhiều điểm đáng ghi nhận. Phần phân tích rất tốt, có nhật ký của Munch, chỉ ra đặc điểm Biểu hiện trên tranh và rút ra ba bài học riêng về tư duy sáng tạo.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần trường phái cần so sánh rõ với trường phái khác. Thứ hai, bản tái hiện còn lệch tỉ lệ nhân vật, nét sáp chưa gợi đường uốn lượn và tô còn thô. Thứ ba, nhật ký cần lý do chọn sáp màu và phần đối chiếu. Cuối cùng, slide quá dày chữ, chữ nhỏ và cần tách đủ slide ý tưởng, sản phẩm hoàn chỉnh.","f":["Phần phân tích của em rất tốt: giới thiệu đầy đủ các phiên bản, chất liệu và nhật ký của Munch; chỉ ra đặc điểm Biểu hiện ở bầu trời, lan can, nhân vật; phân tích màu, đường nét, bố cục có tác dụng; ý nghĩa rõ; liên hệ đúng bối cảnh công nghiệp hóa; phần cảm nhận có ba bài học riêng về tư duy sáng tạo. Tuy nhiên, phần trường phái mới so sánh bằng một câu chung \"không như các trường phái trước\"; em nên đặt cạnh Ấn tượng để làm rõ cách Biểu hiện bóp méo hình, màu để diễn tả cảm xúc.","Bản tái hiện bằng sáp màu của em đúng bảng màu; nhật ký có ảnh các mốc và nêu khó khăn về màu. Tuy nhiên, nhân vật còn nhỏ và lệch tỉ lệ, nét sáp chưa gợi được đường uốn lượn, phần tô còn thô; nhật ký chưa nói lý do chọn sáp màu và chưa tự chỉ ra chỗ bản tái hiện còn khác bản gốc.","Slide của em đúng tỉ lệ và các hình có chú thích. Tuy nhiên, mỗi slide là một khối chữ dày, chữ rất nhỏ, khó theo dõi khi trình chiếu; phần tái hiện gộp vào một slide, còn thiếu slide ý tưởng và slide sản phẩm hoàn chỉnh.","Em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; phong thái rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"265034390":{"g":"G18","s":[2.25,1.75,1.0,2.5],"b":0.0,"t":7.5,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần ngôn ngữ nghệ thuật và ý nghĩa với nón lá, ánh mắt, sông Hương được phân tích tốt; nhật ký có lý do chọn màu nước và phân công rõ; slide đẹp, nhất quán.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, thông tin chất liệu còn mâu thuẫn. Thứ hai, bản tái hiện còn lệch tỉ lệ mặt, nón, màu áo nhạt và màu loang. Thứ ba, bài học trong phần cảm nhận cần áp dụng vào việc vẽ. Cuối cùng, nhật ký cần phần đối chiếu; slide cần bổ sung ý tưởng tái hiện, slide sản phẩm riêng và chú thích ảnh.","f":["Nhóm em xác định được Mỹ thuật Đông Dương và gắn với áo dài, nón lá, sông Hương; phân tích bố cục, đường nét, màu có tác dụng; giải thích chi tiết nón lá, ánh mắt, sông Hương; liên hệ được Âu hóa và quan niệm cái đẹp. Tuy nhiên, thông tin chất liệu còn mâu thuẫn (trang 3 ghi sơn mài trên toan, trang 5 và 6 ghi sơn dầu); phần trường phái nên chỉ rõ hơn chi tiết nào thể hiện tinh thần lãng mạn; phần cảm nhận có chi tiết đôi mắt, áo dài nhưng bài học mới là gìn giữ bản sắc, nên rút ra điều áp dụng được vào việc vẽ của nhóm.","Bản tái hiện bằng màu nước của nhóm em hoàn thành; nhật ký có ảnh các mốc, nêu lý do chọn màu nước, khó khăn khi lên màu áo dài và phân công rõ. Tuy nhiên, tỉ lệ mặt và nón còn lệch, màu áo nhạt hơn, chi tiết khuôn mặt khác bản gốc, màu còn loang; nhóm chưa tự chỉ ra chỗ bản tái hiện còn khác bản gốc và lý do.","Slide của nhóm em đẹp, nhất quán chủ đề, đúng tỉ lệ và đủ số lượng slide. Tuy nhiên, bài thiếu slide ý tưởng tái hiện, sản phẩm hoàn chỉnh gộp chung vào slide khó khăn thay vì có slide riêng; các ảnh trong slide chưa có chú thích tên tác phẩm và nguồn.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"265048167":{"g":"G07","s":[2.25,2.25,1.5,2.5],"b":0.0,"t":8.5,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Nhóm phân biệt rõ Ấn tượng và Hậu Ấn tượng, liên hệ Japonisme và thư Van Gogh; phần cảm nhận rút ra được bài học phối màu cho thiết kế đồ họa; nhật ký đầy đủ, phân công rõ; slide thanh lịch, nhất quán.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, slide ngôn ngữ nghệ thuật bị dán nhầm nội dung nên phần này còn thiếu. Thứ hai, phần ý nghĩa cần giải thích biểu tượng hoa diên vĩ. Cuối cùng, bản mosaic còn lệch bố cục mặt bàn, sắc độ màu và mất chi tiết lá, cánh hoa.","f":["Nhóm em giới thiệu đầy đủ năm, nơi vẽ, chất liệu, kích thước, nơi lưu giữ; phân biệt rõ Ấn tượng và Hậu Ấn tượng, chỉ ra trên tranh qua tương phản tím và vàng chanh, nét cọ ngắn dày; phần xã hội liên hệ được Japonisme và thư Van Gogh gửi Theo; phần cảm nhận gắn với sắc tím tương phản nền vàng và rút ra bài học phối màu, tổ chức hình có chủ đích cho thiết kế đồ họa. Tuy nhiên, slide ngôn ngữ nghệ thuật bị dán nhầm nội dung bối cảnh nên mới mô tả sắc tím, chưa phân tích bố cục, ánh sáng, đường nét; phần ý nghĩa chưa giải thích biểu tượng hoa diên vĩ.","Bản mosaic giấy kiếng của nhóm em hoàn thiện, đều tay; nhật ký đầy đủ ảnh các mốc, lý do chọn giấy kiếng, khó khăn và cách xử lý, có đối chiếu việc lược bỏ mảnh nhỏ, và phân công công việc rõ ràng giữa các thành viên. Tuy nhiên, ở tác phẩm tái hiện mặt bàn cao hơn bản gốc làm lệch bố cục, sắc độ màu chưa đúng nên bình hoa chìm vào nền, và việc lược bỏ mảnh nhỏ làm mất chi tiết lá, cánh hoa; nhóm có thể chồng thêm lớp giấy để ra đúng sắc độ thay vì đơn giản hóa mảng.","Slide của nhóm em thanh lịch, nhất quán, đúng tỉ lệ, đủ cấu trúc và các hình đều có chú thích. Đây là phần nhóm em làm rất tốt.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin."]},"265022970":{"g":"G17","s":[2.75,1.75,1.0,2.0],"b":0.0,"t":7.5,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần phân tích rất tốt, so sánh Phục Hưng với Trung Cổ và chỉ ra trên tranh, phân tích bố cục, sfumato, biểu tượng chồn ermine có chiều sâu; nhật ký nêu khó khăn rất cụ thể và tự nhận chỗ chưa giống.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, mốc thời gian Leonardo học ở xưởng Verrocchio bị ghi sai. Thứ hai, bản tái hiện còn lệch tỉ lệ, khuôn mặt chưa giống và băng đô kéo dài quá khối đầu. Thứ ba, sản phẩm in khổ A3 thay vì A4 và hình sản phẩm bị mờ. Cuối cùng, ảnh tiến trình chưa thấy bảng màu và nhật ký chưa ghi phân công.","f":["Phần phân tích của nhóm em rất tốt: đủ thông tin tác phẩm và bối cảnh Ludovico Sforza đặt hàng; so sánh Phục Hưng với Trung Cổ và chỉ ra trên tranh qua tư thế xoay đầu, sáng tối, khớp ngón tay; phân tích bố cục kim tự tháp xoắn, contrapposto, sfumato, tương phản đỏ, lam, trắng; giải thích biểu tượng chồn ermine và liên hệ được xã hội cung đình; phần cảm nhận có bài học cho người học thiết kế. Tuy nhiên, slide giới thiệu tác giả ghi Leonardo học ở xưởng Verrocchio đến năm 1467, trong khi thực tế ông theo học khoảng từ 1466 đến 1476; nhóm cần kiểm tra lại mốc thời gian.","Bản tái hiện digital của nhóm em đúng bảng màu; nhật ký nêu rõ lý do chọn phần mềm, khó khăn từng giai đoạn rất cụ thể (tỉ lệ, phối màu, lông trắng, ánh mắt) kèm cách xử lý và tự nhận phần mắt chưa giống bản gốc. Tuy nhiên, bố cục và tỉ lệ còn lệch, khuôn mặt chưa giống, đường băng đô trên trán kéo dài quá khối đầu; sản phẩm in khổ A3 thay vì A4; ảnh tiến trình chưa thấy bảng màu; nhật ký chưa ghi phân công công việc cụ thể giữa hai bạn.","Slide của nhóm em đúng tỉ lệ, đủ cấu trúc và các hình có chú thích. Tuy nhiên, hình sản phẩm cuối bị mờ, không căng nét nên khó xem chi tiết; nên xuất ảnh ở độ phân giải cao hơn.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trả lời đúng các câu hỏi. Tuy nhiên, phần thuyết trình của mình còn hạn chế; một vài câu trả lời còn thiếu độ sâu."]},"265021062":{"g":"G12","s":[1.5,2.25,1.25,2.5],"b":0.0,"t":7.5,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Bản tái hiện bằng bút acrylic hoàn thiện trên khổ lớn, nhật ký có khó khăn từng giai đoạn và phân công rõ; slide đẹp, nhất quán.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, bài thiếu mục Nội dung và ý nghĩa. Thứ hai, phần ngôn ngữ nghệ thuật và cảm nhận còn ngắn, chủ yếu mô tả. Thứ ba, dáng bình và mảng hoa còn lệch, nét viền đậm không giống bản gốc. Cuối cùng, nhật ký cần nêu lý do chọn bút acrylic.","f":["Nhóm em giới thiệu đủ năm, nơi vẽ, chất liệu, kích thước và bối cảnh; xác định Hậu Ấn tượng và gắn với nét cọ trên cánh hoa, lá; phần xã hội liên hệ truyền thống tĩnh vật thế kỷ 19. Tuy nhiên, bài thiếu hẳn mục Nội dung và ý nghĩa (số mục nhảy từ 1.3 sang 1.5), ý nghĩa tác phẩm chỉ được nhắc lướt ở phần đầu; phần ngôn ngữ nghệ thuật còn ngắn, chủ yếu mô tả, nên giải thích tác dụng của bố cục và màu; phần cảm nhận về hy vọng còn chung, chưa có bài học cho việc vẽ của nhóm.","Bản tái hiện bằng bút acrylic của nhóm em đúng bảng màu, hoàn thiện trên khổ lớn; nhật ký có ảnh các mốc, mỗi giai đoạn có khó khăn và cách giải quyết cụ thể, nhóm tự nhận màu sắc và nét vẽ chưa giống bản gốc do khác chất liệu, phân công rõ giữa Trâm và Vi. Tuy nhiên, dáng bình và mảng hoa còn lệch tỉ lệ, nét viền đậm là lựa chọn riêng chứ không do chất liệu; nhật ký chưa nói lý do chọn bút acrylic.","Slide của nhóm em đẹp, nhất quán, đúng tỉ lệ, đủ số lượng slide và các hình có chú thích. Tuy nhiên, bài thiếu mục 1.4 Nội dung và ý nghĩa nên chưa đủ cấu trúc theo đề.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"265041469":{"g":"G14","s":[3.0,2.25,1.25,2.5],"b":0.0,"t":9.0,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần phân tích rất tốt, chỉ ra rõ đặc điểm Siêu thực, đo trục đối xứng, trích bảng màu và có bài học sáng tạo cụ thể; nhật ký tự đối chiếu với bản gốc và phân công rõ.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, bản tái hiện tự đổi sang phong cách hoạt họa, bỏ chi tiết khuỷu tay và màu còn lệch. Thứ hai, ảnh tiến trình cần thấy giao diện Procreate, brush và bảng màu. Cuối cùng, một số slide trình bày khối chữ còn lộn xộn.","f":["Phần phân tích của nhóm em rất tốt: đủ thông tin tác phẩm, xác định đúng Siêu thực và chỉ ra qua quả táo, con mắt sau lá; phân tích bố cục, ánh sáng, màu có đo trục đối xứng và trích bảng màu; giải thích rõ quả táo, con mắt và thông điệp che giấu; liên hệ châu Âu 1960; phần cảm nhận có bài học sáng tạo cụ thể về việc che giấu để gợi tò mò.","Bản tái hiện tác phẩm của nhóm em đúng bố cục và hoàn thiện; nhật ký nêu lý do chọn Procreate, có khó khăn, cách xử lý và tự chỉ ra chi tiết khuỷu tay chưa giống bản gốc, phân công rõ giữa hai bạn. Tuy nhiên, nhóm tự đổi sang phong cách hoạt họa và bỏ chi tiết khuỷu tay bẻ ngược, màu còn lệch so với bản gốc.","Slide của nhóm em rõ, dễ đọc, đúng tỉ lệ, đủ cấu trúc và các hình có chú thích. Tuy nhiên, các khối chữ ở trang 7, 8, 11 chia cột không đều, mũi tên rời rạc nên trình bày còn lộn xộn.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời tốt các câu hỏi trong phần Q&A."]},"265043836":{"g":"G05","s":[3.0,2.5,1.0,2.0],"b":0.0,"t":8.5,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần phân tích rất tốt, chỉ ra rõ sự bóp méo thực tại qua nhân vật, bầu trời và giải thích đầy đủ các biểu tượng; bản tái hiện trên ibisPaint gần như nguyên mẫu; slide nhất quán.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, nhật ký cần ghi đúng khó khăn khi vẽ digital thay vì bột màu, sơn dầu. Thứ hai, nhóm cần tự đối chiếu bản tái hiện với bản gốc và ghi phân công. Cuối cùng, slide cần bổ sung ý tưởng tái hiện, sắp đúng thứ tự theo đề và ghi chú thích cho ảnh.","f":["Phần phân tích của nhóm em rất tốt: đủ thông tin tác phẩm, xác định đúng Biểu hiện và chỉ ra sự bóp méo thực tại qua nhân vật, bầu trời; phân tích màu đối lập tạo căng thẳng, cây cầu chạy xéo dẫn hướng nhìn, nét cong đối lập nét thẳng; giải thích được biểu tượng nhân vật, bầu trời, cầu và bóng người phía sau. Phần xã hội liên hệ đúng bối cảnh công nghiệp hóa cuối thế kỷ 19 và phần cảm nhận có bài học riêng.","Bản tái hiện trên ibisPaint của nhóm em gần như nguyên mẫu: đúng bố cục, bảng màu, đặc trưng nét và hoàn thiện; nhật ký có ảnh các mốc và nêu công cụ. Tuy nhiên, phần khó khăn ghi cách khắc phục bằng bột màu, sơn dầu trong khi nhóm vẽ trên máy, nên chưa phản ánh đúng khó khăn thật khi vẽ digital; nhóm cũng chưa đối chiếu bản tái hiện với bản gốc và chưa ghi phân công giữa hai bạn.","Slide của nhóm em nhất quán, đúng tỉ lệ và đủ số lượng slide. Tuy nhiên, bài thiếu slide ý tưởng tái hiện và slide sản phẩm hoàn chỉnh đặt trước nhật ký, chưa đúng thứ tự đề yêu cầu; nhiều ảnh trong slide chưa có chú thích tên tác phẩm và nguồn, em nên ghi ngắn dưới mỗi hình.","Thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời đúng các câu hỏi. Tuy nhiên, phần trình bày chung của nhóm còn rời rạc, chưa đủ các phần theo đề; một câu trả lời còn thiếu độ sâu."]},"265045023":{"g":"G01","s":[2.25,2.5,1.25,2.5],"b":0.0,"t":8.5,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Mô hình Chùa Một Cột rất công phu, đúng tỉ lệ và đủ các chi tiết cột đá, mái cong, rồng chầu, hồ sen; phần giới thiệu bối cảnh triều Lý đầy đủ, phần ngôn ngữ nghệ thuật phân tích đủ năm yếu tố kèm tác dụng và phần cảm nhận gợi được cách đưa hình tượng hoa sen vào thiết kế.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần phân tích nên chỉ ra dấu ấn nghệ thuật thời Lý ở chỗ nào trên công trình. Thứ hai, phần ý nghĩa cần thêm biểu tượng và căn cứ. Thứ ba, nhật ký còn thiếu cách xử lý khó khăn và phân công. Cuối cùng, một số slide còn dày chữ.","f":["Nhóm em giới thiệu đầy đủ niên đại, chất liệu, bối cảnh triều Lý và truyền thuyết giấc mộng của vua Lý Thái Tông; phần ngôn ngữ nghệ thuật phân tích đủ năm yếu tố hình khối, đường nét, màu, không gian, chất liệu kèm tác dụng; phần liên hệ với Thăng Long và Phật giáo thời Lý hợp lý; phần cảm nhận có ý riêng và gợi được cách dùng hình tượng hoa sen, mái cong cho logo, họa tiết, bao bì. Tuy nhiên, nhóm mới nêu chung \"mang đậm dấu ấn nghệ thuật thời Lý\" mà chưa chỉ ra dấu ấn đó ở đâu trên công trình (mái cong, đầu đao, rồng chầu, tỉ lệ cột và điện); phần ý nghĩa mới giải thích một biểu tượng là đóa sen, cần thêm ít nhất một biểu tượng khác và căn cứ từ sử liệu.","Mô hình của nhóm em rất công phu: đúng bố cục, tỉ lệ, màu sắc và giữ đủ cột đá, mái cong, rồng chầu, hồ sen, cầu thang; phần mái ngói, đèn và cảnh quan làm rất kỹ. Nhật ký có ảnh các mốc 10, 30, 50, 80, 100% và nêu rõ lý do chọn bìa formex, carton vì dễ cắt ghép. Tuy nhiên, phần khó khăn mới nêu việc cắt chi tiết nhỏ \"đòi hỏi sự tỉ mỉ\" mà chưa có cách xử lý cụ thể (dụng cụ gì, làm theo thứ tự nào) và chưa tự đối chiếu mô hình với công trình thật để chỉ ra chỗ còn khác; nhật ký cũng chưa ghi phân công giữa hai bạn.","Slide của nhóm em đẹp, nhất quán tông đỏ, đúng tỉ lệ, đủ số lượng slide và các hình có chú thích. Tuy nhiên, một số trang còn dày chữ (trang 5, trang 7), nên tách ý hoặc chuyển bớt sang hình.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"265020449":{"g":"G24","s":[3.0,2.5,1.5,2.25],"b":0.0,"t":9.25,"fb":"Bài làm của em có nhiều điểm đáng ghi nhận. Phần phân tích rất xuất sắc, so sánh Ấn tượng và Hậu Ấn tượng ngay trên tranh, giải thích sâu bầu trời xoáy và cây bách; bản tái hiện trên Krita mô phỏng đúng tinh thần nét cọ ở bầu trời; slide nhất quán, đủ cấu trúc.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần ngôi làng, dãy núi và cây bách còn làm sơ lược, chưa hoàn thiện đều như bầu trời. Thứ hai, ảnh tiến trình của bài vẽ digital cần thấy rõ giao diện phần mềm, brush và bảng màu đã dùng.","f":["Phần phân tích của em rất xuất sắc: so sánh Ấn tượng và Hậu Ấn tượng và chỉ ra trên tranh; phân tích bố cục, màu, đường nét, ánh sáng có tác dụng; giải thích được ý nghĩa bầu trời xoáy và cây bách gắn với tâm trạng tác giả; phần cảm nhận có bài học cụ thể cho sinh viên thiết kế về dùng màu và đường nét.","Bản tái hiện trên Krita của em đúng bố cục, bảng màu, nét xoáy digital mô phỏng đúng tinh thần nét cọ, phần bầu trời đầu tư kỹ; nhật ký nêu lý do chọn Krita, khó khăn về màu và bố cục ngôi nhà kèm cách xử lý. Tuy nhiên, phần ngôi làng, dãy núi và cây bách mới làm sơ lược (em tự ghi là \"chỉ mô phỏng sơ qua\"), cây bách thành khối đen phẳng; ảnh tiến trình chưa thấy rõ giao diện phần mềm, brush và bảng màu đã dùng.","Slide của em nhất quán, đúng tỉ lệ, đủ cấu trúc và các hình có chú thích. Đây là phần em làm rất tốt.","Em trình bày mạch lạc, đủ các phần theo đề; phong thái rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu. Tuy nhiên, thời lượng trình bày chưa nằm trong khoảng 5 đến 7 phút."]},"265043454":{"g":"G18","s":[2.25,1.75,1.0,2.5],"b":0.25,"t":7.75,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần ngôn ngữ nghệ thuật và ý nghĩa với nón lá, ánh mắt, sông Hương được phân tích tốt; nhật ký có lý do chọn màu nước và phân công rõ; slide đẹp, nhất quán.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, thông tin chất liệu còn mâu thuẫn. Thứ hai, bản tái hiện còn lệch tỉ lệ mặt, nón, màu áo nhạt và màu loang. Thứ ba, bài học trong phần cảm nhận cần áp dụng vào việc vẽ. Cuối cùng, nhật ký cần phần đối chiếu; slide cần bổ sung ý tưởng tái hiện, slide sản phẩm riêng và chú thích ảnh.","f":["Nhóm em xác định được Mỹ thuật Đông Dương và gắn với áo dài, nón lá, sông Hương; phân tích bố cục, đường nét, màu có tác dụng; giải thích chi tiết nón lá, ánh mắt, sông Hương; liên hệ được Âu hóa và quan niệm cái đẹp. Tuy nhiên, thông tin chất liệu còn mâu thuẫn (trang 3 ghi sơn mài trên toan, trang 5 và 6 ghi sơn dầu); phần trường phái nên chỉ rõ hơn chi tiết nào thể hiện tinh thần lãng mạn; phần cảm nhận có chi tiết đôi mắt, áo dài nhưng bài học mới là gìn giữ bản sắc, nên rút ra điều áp dụng được vào việc vẽ của nhóm.","Bản tái hiện bằng màu nước của nhóm em hoàn thành; nhật ký có ảnh các mốc, nêu lý do chọn màu nước, khó khăn khi lên màu áo dài và phân công rõ. Tuy nhiên, tỉ lệ mặt và nón còn lệch, màu áo nhạt hơn, chi tiết khuôn mặt khác bản gốc, màu còn loang; nhóm chưa tự chỉ ra chỗ bản tái hiện còn khác bản gốc và lý do.","Slide của nhóm em đẹp, nhất quán chủ đề, đúng tỉ lệ và đủ số lượng slide. Tuy nhiên, bài thiếu slide ý tưởng tái hiện, sản phẩm hoàn chỉnh gộp chung vào slide khó khăn thay vì có slide riêng; các ảnh trong slide chưa có chú thích tên tác phẩm và nguồn.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"265143254":{"g":"G03","s":[2.75,2.5,1.5,2.5],"b":0.0,"t":9.25,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần phân tích rất đầy đủ, chỉ ra đúng đặc điểm Hậu Ấn tượng trên bầu trời, giải thích chi tiết cây bách và ngôi làng; bản tái hiện bằng bút acrylic chuyển được nhịp xoáy và hoàn thiện kỹ; slide nhất quán, thẩm mỹ tốt.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần cảm nhận nên rút ra bài học cụ thể cho việc vẽ, thiết kế. Thứ hai, nhật ký cần tự đối chiếu bản tái hiện với bản gốc. Cuối cùng, nhật ký cần ghi phân công giữa hai bạn.","f":["Nhóm em giới thiệu rất đầy đủ năm, nơi vẽ ở Saint-Rémy, chất liệu, kích thước và nơi lưu giữ; xác định đúng Hậu Ấn tượng và chỉ ra qua nét cọ xoắn, màu trên bầu trời. Phần ngôn ngữ nghệ thuật phân tích đường nét, màu, ánh sáng có tác dụng; phần ý nghĩa giải thích rất chi tiết cây bách, ngôi làng và thông điệp hy vọng, phần xã hội liên hệ được tư tưởng, tôn giáo và quan niệm cái đẹp. Tuy nhiên, phần cảm nhận mới dừng ở suy nghĩ về cuộc sống; nhóm nên rút ra một bài học cụ thể cho việc vẽ hay thiết kế của mình, ví dụ cách dùng nét lặp để tạo chuyển động.","Bản tái hiện của nhóm em rất tốt: đúng bố cục, bảng màu, nét bút ngắn chuyển được nhịp xoáy, đủ cây bách, sao và ngôi làng, tô kỹ toàn khổ. Nhật ký có ảnh các mốc và nêu vật liệu. Tuy nhiên, phần khó khăn chưa tự đối chiếu bản tái hiện với bản gốc để chỉ ra chỗ còn khác và lý do, và nhật ký chưa ghi phân công giữa hai bạn.","Slide của nhóm em nhất quán chủ đề, thẩm mỹ tốt, đúng tỉ lệ, đủ cấu trúc và các hình đều có chú thích. Đây là phần nhóm em làm rất tốt.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"265400187":{"g":"G03","s":[2.75,2.5,1.5,2.5],"b":0.0,"t":9.25,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Phần phân tích rất đầy đủ, chỉ ra đúng đặc điểm Hậu Ấn tượng trên bầu trời, giải thích chi tiết cây bách và ngôi làng; bản tái hiện bằng bút acrylic chuyển được nhịp xoáy và hoàn thiện kỹ; slide nhất quán, thẩm mỹ tốt.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần cảm nhận nên rút ra bài học cụ thể cho việc vẽ, thiết kế. Thứ hai, nhật ký cần tự đối chiếu bản tái hiện với bản gốc. Cuối cùng, nhật ký cần ghi phân công giữa hai bạn.","f":["Nhóm em giới thiệu rất đầy đủ năm, nơi vẽ ở Saint-Rémy, chất liệu, kích thước và nơi lưu giữ; xác định đúng Hậu Ấn tượng và chỉ ra qua nét cọ xoắn, màu trên bầu trời. Phần ngôn ngữ nghệ thuật phân tích đường nét, màu, ánh sáng có tác dụng; phần ý nghĩa giải thích rất chi tiết cây bách, ngôi làng và thông điệp hy vọng, phần xã hội liên hệ được tư tưởng, tôn giáo và quan niệm cái đẹp. Tuy nhiên, phần cảm nhận mới dừng ở suy nghĩ về cuộc sống; nhóm nên rút ra một bài học cụ thể cho việc vẽ hay thiết kế của mình, ví dụ cách dùng nét lặp để tạo chuyển động.","Bản tái hiện của nhóm em rất tốt: đúng bố cục, bảng màu, nét bút ngắn chuyển được nhịp xoáy, đủ cây bách, sao và ngôi làng, tô kỹ toàn khổ. Nhật ký có ảnh các mốc và nêu vật liệu. Tuy nhiên, phần khó khăn chưa tự đối chiếu bản tái hiện với bản gốc để chỉ ra chỗ còn khác và lý do, và nhật ký chưa ghi phân công giữa hai bạn.","Slide của nhóm em nhất quán chủ đề, thẩm mỹ tốt, đúng tỉ lệ, đủ cấu trúc và các hình đều có chú thích. Đây là phần nhóm em làm rất tốt.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."]},"265042760":{"g":"G22","s":[1.5,2.5,1.0,2.5],"b":0.25,"t":7.75,"fb":"Bài làm của nhóm em có nhiều điểm đáng ghi nhận. Bản tái hiện bằng acrylic khá sát với tác phẩm gốc; phần phân tích tương phản kích thước có tác dụng; slide rõ, hình có chú thích.\n\nBên cạnh đó, bài còn một số điểm chưa đạt. Thứ nhất, phần trường phái cần nêu dòng tranh ukiyo-e và chỉ ra trên tranh. Thứ hai, phần ý nghĩa, xã hội và cảm nhận còn ngắn, chung. Thứ ba, nhật ký cần ghi rõ phân công công việc của các thành viên. Cuối cùng, slide chưa đủ cấu trúc theo đề và một vài slide còn dày chữ.","f":["Nhóm em giới thiệu đủ niên đại, chất liệu khắc gỗ và bộ 36 cảnh núi Phú Sĩ; phân tích được sóng tiền cảnh, tương phản kích thước và màu có tác dụng. Tuy nhiên, phần trường phái mới nêu thời kỳ Edo, cần nêu dòng tranh khắc gỗ ukiyo-e và chỉ ra đặc điểm đó trên tranh; phần ý nghĩa về sức mạnh thiên nhiên còn ngắn; bài chưa có phần tác phẩm và xã hội; phần cảm nhận có chi tiết sóng và núi Phú Sĩ nhưng phần bài học liên hệ còn chung.","Bản tái hiện bằng acrylic của nhóm em gần giống với tác phẩm gốc, đúng bố cục, màu và hoàn thiện; nhật ký có ảnh các mốc và lý do vẽ tay. Tuy nhiên, phần nhật ký chưa ghi phân công công việc cụ thể giữa hai bạn.","Slide của nhóm em rõ, đọc được, đúng tỉ lệ và các hình có chú thích. Tuy nhiên, bài chưa có slide riêng cho Vị trí trong lịch sử mỹ thuật, Tác phẩm và xã hội; slide 5 và 6 còn dày chữ.","Nhóm em trình bày mạch lạc, đủ các phần theo đề; thời lượng đúng khoảng 5 đến 7 phút; em trình bày phần của mình rõ ràng, tự tin; em trả lời chính xác, có căn cứ các câu hỏi, kể cả câu hỏi đào sâu."],"bn":"Điểm cộng khuyến khích do tham gia hỗ trợ sự kiện."}};
var CKR=[["Phân tích và cảm nhận tác phẩm gốc",3,["Xác định đúng và phân tích sâu sắc bối cảnh sáng tác, vị trí trong lịch sử mỹ thuật, ngôn ngữ nghệ thuật và nội dung/ý nghĩa của tác phẩm; liên hệ chặt chẽ với xã hội; thể hiện cảm nhận và góc nhìn cá nhân rõ nét, có chiều sâu.","Phân tích đúng và khá đầy đủ các khía cạnh về bối cảnh, thời kỳ/trường phái, ngôn ngữ nghệ thuật và ý nghĩa của tác phẩm; có liên hệ xã hội và cảm nhận cá nhân tương đối rõ ràng.","Có đề cập các khía cạnh phân tích nhưng còn thiên về mô tả; một số nội dung (bối cảnh, đặc điểm nghệ thuật, ý nghĩa) chưa được khai thác sâu; cảm nhận cá nhân còn sơ lược.","Nội dung phân tích sơ sài, nhầm lẫn hoặc thiếu chính xác về thời kỳ/trường phái; không làm rõ đặc điểm nghệ thuật hay ý nghĩa tác phẩm; không thể hiện cảm nhận cá nhân."]],["Tái hiện/mô phỏng tác phẩm và nhật ký quá trình",3,["Sản phẩm thể hiện rõ mối liên hệ với tác phẩm gốc; vận dụng tinh tế bố cục, màu sắc, hình khối, ánh sáng; hoàn thiện kỹ lưỡng, nghiêm túc và có dấu ấn cá nhân rõ nét; nhật ký đầy đủ hình ảnh các giai đoạn thực hiện, mô tả rõ vật liệu/công cụ, khó khăn và giải pháp, và thể hiện rõ sự phối hợp nhịp nhàng của hai thành viên.","Sản phẩm thể hiện được mối liên hệ với tác phẩm gốc; vận dụng phù hợp một số đặc điểm nghệ thuật; mức độ hoàn thiện khá tốt; nhật ký có hình ảnh các giai đoạn và mô tả tương đối đầy đủ về vật liệu, khó khăn và sự phối hợp nhóm.","Sản phẩm có liên hệ với tác phẩm gốc nhưng còn mờ nhạt; việc vận dụng đặc điểm nghệ thuật còn đơn giản hoặc chưa rõ; nhật ký còn thiếu một vài giai đoạn, mô tả về vật liệu/khó khăn/phối hợp còn sơ lược.","Sản phẩm ít hoặc không thể hiện mối liên hệ với tác phẩm gốc; thiếu sự đầu tư, hoàn thiện sơ sài; nhật ký thiếu hình ảnh quá trình, không mô tả vật liệu, khó khăn hoặc sự phối hợp nhóm."]],["Hình thức trình bày slide",1.5,["Slide bố cục rõ ràng, logic, thẩm mỹ cao; hình ảnh và chữ sắp xếp hài hòa, nhất quán xuyên suốt toàn bộ slide, hình ảnh có chú thích đầy đủ.","Slide trình bày rõ ràng, khá thẩm mỹ, bố cục hợp lý; còn một vài điểm chưa thật nhất quán.","Slide trình bày được nhưng còn một số lỗi về bố cục, font chữ hoặc hình ảnh chưa cân đối.","Slide trình bày cẩu thả, thiếu thẩm mỹ, bố cục lộn xộn hoặc thiếu nhất quán."]],["Nội dung, kỹ năng thuyết trình và giải thích/Q&A",2.5,["Trình bày đúng trọng tâm, mạch lạc, có cấu trúc rõ ràng, phân bổ thời gian hợp lý, cả hai thành viên tham gia trình bày chủ động và cân đối; giải thích rõ ràng, thuyết phục về ý tưởng tái hiện, trả lời chính xác và tự tin các câu hỏi, thể hiện sự hiểu biết thực sự và phối hợp nhịp nhàng.","Trình bày rõ ràng, có cấu trúc; sử dụng slide phù hợp; thời gian trình bày tương đối hợp lý; cả hai thành viên đều tham gia; giải thích được ý tưởng tái hiện, trả lời khá tốt các câu hỏi, hai thành viên có sự phối hợp.","Trình bày còn rời rạc hoặc lệch trọng tâm ở một số phần; thời gian phân bổ chưa hợp lý; một thành viên tham gia ít hơn; giải thích ý tưởng còn chung chung, trả lời câu hỏi chưa đầy đủ hoặc còn lúng túng.","Trình bày thiếu mạch lạc, không bám sát nội dung; vượt hoặc thiếu nhiều so với thời lượng quy định; một thành viên không tham gia trình bày; không giải thích được ý tưởng tái hiện, không trả lời được hoặc trả lời sai các câu hỏi cơ bản."]]];
var BANDS=[["Xuất sắc","90–100%"],["Tốt","70–89%"],["Trung bình","50–69%"],["Yếu","0–49%"]];
var CKC=[["--red","--red"],["--gold","--goldt"],["--blu","--blut"],["--teal","--tealt"]];
function ckLv(p,max){var r=p/max;return r>=0.9-1e-9?0:(r>=0.7-1e-9?1:(r>=0.5-1e-9?2:3))}
function ckHTML(st){
 var c=CKS[st.m];
 if(c&&c.none)return'<div class="msg">SV vắng buổi báo cáo cuối kỳ nên chưa có điểm báo cáo cuối kỳ. SV liên hệ giảng viên để được hướng dẫn.</div>';
 if(!c)return'<div class="msg">SV chưa có điểm báo cáo cuối kỳ. SV liên hệ giảng viên để được hướng dẫn.</div>';
 var h='<div class="topic"><b>Nhóm '+esc(c.g)+'</b> · Báo cáo cuối kỳ: phân tích và tái hiện/mô phỏng tác phẩm mỹ thuật</div>';
 h+='<div class="cm"><h3>Nhận xét chung</h3>'+esc(c.fb).split("\n\n").map(function(x){return'<p>'+x+'</p>'}).join("")+'</div>';
  h+='<section class="sec" style="--c:var(--red);--ct:var(--red)"><h3><span>Điểm từng tiêu chí</span><em>'+f2(c.s.reduce(function(a,b){return a+b},0))+' / 10</em></h3>';
 CKR.forEach(function(k,i){var lost=c.s[i]<k[1]-1e-9,l=ckLv(c.s[i],k[1]);
  h+='<div class="it'+(lost?' lost':'')+'"><span class="cd">TC'+(i+1)+'</span><span class="nm">'+esc(k[0])+'<span class="ds">Mức đạt: '+BANDS[l][0]+' ('+BANDS[l][1]+')</span></span><span class="sc">'+f2(c.s[i])+' / '+f2(k[1])+'</span><span class="fb">'+(lost?'':'✓ ')+esc((c.f&&c.f[i])||(lost?'Xem mô tả các mức đạt trong rubric bên dưới.':'Đạt mức tối đa.'))+'</span></div>'});
 h+='</section>';
 if(c.b>0)h+='<section class="sec" style="--c:var(--cam);--ct:var(--camt)"><h3><span>Điều chỉnh của giảng viên</span><em>+'+f2(c.b)+'</em></h3><div class="adjrow"><span class="nm">Điểm cộng</span><span class="sc">+'+f2(c.b)+'</span><span class="fb">'+esc(c.bn||'Điểm cộng cho phần làm nổi bật của bài.')+'</span></div></section>';
 h+='<div class="sum"><span>Các tiêu chí '+f2(c.t-c.b)+(c.b?' + điểm cộng '+f2(c.b):'')+'</span><b>Điểm báo cáo cuối kỳ: '+f2(c.t)+' / 10</b></div>';
 h+='<div class="legend"><b>Cách đọc:</b> dòng chữ nâu đỏ là tiêu chí chưa đạt điểm tối đa, kèm lý do. Dòng có dấu ✓ đã đạt mức tối đa. Mức đạt của từng tiêu chí được tô nền trong rubric bên dưới.</div>';
 return h}
function rubricCK(sc){
 var h='<section class="sec" style="--c:var(--gold);--ct:var(--goldt)"><h3><span>Rubric chấm báo cáo cuối kỳ</span><em>10 điểm</em></h3><p class="rubnote">Báo cáo gồm 4 tiêu chí (3 + 3 + 1,5 + 2,5 điểm). Mỗi tiêu chí chia 4 mức theo tỉ lệ điểm tối đa.'+(sc?' Mức đạt của em được tô nền.':'')+'</p>';
 CKR.forEach(function(k,i){var l=sc?ckLv(sc[i],k[1]):-1;
  h+='<div class="rubc ck" style="--c:var('+CKC[i][0]+');--ct:var('+CKC[i][1]+')"><h4><span>'+esc((i+1)+'. '+k[0])+'</span><em>'+f2(k[1])+' điểm</em></h4><ol>'+k[2].map(function(d,j){return'<li'+(l===j?' class="on"':'')+'><b>'+BANDS[j][1]+'</b><span><u>'+BANDS[j][0]+'.</u> '+esc(d)+'</span></li>'}).join("")+'</ol></div>'});
 return h+'</section>'}
var VIEW="";
function render(st,view){
 var out=document.getElementById("out"),d=st.d,p=PM[st.m];
 var ck=CKS[st.m],ckv=!!(ck&&ck.none);if(ckv)ck=null;
 view=view||(!d.none?"th":(p?"tt":(ck?"ck":"th")));VIEW=view;
 var h='<div class="stack"><div class="who"><h2>'+esc(st.name)+'</h2><p>MSSV '+esc(st.m)+' · Điểm GPD1101</p></div>';
 h+='<div class="two">'
  +'<button type="button" class="col'+(view==="th"?" on":"")+'" data-v="th" style="--c:var(--red);--ct:var(--red)"><span class="lb">'+ICO.user+'Bài thu hoạch cá nhân</span><div class="num">'+(d.none?"–":f2(d.fin))+'<span> / 10</span></div><span class="sub">Tham quan Bảo tàng Mỹ thuật TP.HCM</span><span class="see">'+(view==="th"?"Đang xem chi tiết":"Bấm để xem chi tiết")+'</span></button>'
  +'<button type="button" class="col'+(view==="tt"?" on":"")+'" data-v="tt" style="--c:var(--blu);--ct:var(--blut)"><span class="lb">'+ICO.book+'Thuyết trình nhóm</span><div class="num">'+(p?f2(p.ind):"–")+'<span> / 10</span></div><span class="sub">'+(p?"Điểm nhóm "+f2(PGR[p.g].fin)+" · "+esc(PGR[p.g].n):"Chưa có điểm")+'</span><span class="see">'+(view==="tt"?"Đang xem chi tiết":"Bấm để xem chi tiết")+'</span></button>'
  +'<button type="button" class="col'+(view==="ck"?" on":"")+'" data-v="ck" style="--c:var(--pur);--ct:var(--purt)"><span class="lb">'+ICO.lay+'Báo cáo cuối kỳ</span><div class="num">'+(ck?f2(ck.t)+'<span> / 10</span>':(ckv?"Vắng":"–"+'<span> / 10</span>'))+'</div><span class="sub">'+(ck?"Nhóm "+esc(ck.g)+" · phân tích và tái hiện tác phẩm":(ckv?"Vắng buổi báo cáo cuối kỳ":"Chưa có điểm"))+'</span><span class="see">'+(view==="ck"?"Đang xem chi tiết":"Bấm để xem chi tiết")+'</span></button></div>';
 h+=view==="tt"?ttHTML(st):(view==="ck"?ckHTML(st):thHTML(st));
 h+='</div>'+(view==="tt"?rubricTT(p?PGR[p.g].lv:null):(view==="ck"?rubricCK(ck?ck.s:null):rubric()));
 out.innerHTML=h;
 Array.prototype.forEach.call(out.querySelectorAll("button.col"),function(b){b.onclick=function(){render(st,b.getAttribute("data-v"))}})}
function show(v){
 var out=document.getElementById("out"),raw=(v||"").trim();
 if(!raw){out.innerHTML='<div class="msg">Nhập MSSV hoặc họ tên rồi bấm "Tra điểm" để xem điểm bài thu hoạch cá nhân, điểm thuyết trình nhóm và điểm báo cáo cuối kỳ, nhận xét từng tiêu chí và nhận xét chung. Rubric chấm điểm ở bên dưới.</div>'+rubric()+rubricTT(null)+rubricCK(null);return}
 var d=raw.replace(/\D/g,"");
 if(d.length>=6){var hit=ST.filter(function(s){return s.m===d})[0];if(hit){render(hit);return}}
 var q=nrm(raw).split(" ").filter(Boolean),hits=[];
 if(q.length&&!d){ST.forEach(function(s){var t=nrm(s.name).split(" ");
   var ok=q.every(function(w){return t.indexOf(w)>=0});
   if(ok&&(q.length>=2||t[t.length-1]===q[0]))hits.push(s)})}
 if(hits.length===1){render(hits[0]);return}
 if(hits.length>1){out.innerHTML='<div class="msg">Có nhiều kết quả, SV chọn đúng tên của mình:<div class="pick">'+hits.map(function(h,i){return'<button type="button" data-i="'+i+'">'+esc(h.name)+'</button>'}).join("")+'</div></div>';
  Array.prototype.forEach.call(out.querySelectorAll("button"),function(b){b.onclick=function(){render(hits[+b.getAttribute("data-i")])}});return}
 out.innerHTML='<div class="msg">Không tìm thấy <b>'+esc(raw)+'</b>, hoặc điểm chưa được công bố. SV kiểm tra lại MSSV, nhập đầy đủ họ tên (ví dụ: Nguyễn Văn An) hoặc liên hệ giảng viên.</div>'+rubric()+rubricTT(null)+rubricCK(null);
}
(function(){var q=document.getElementById("q"),f=document.getElementById("f");
function go(e){if(e&&e.preventDefault)e.preventDefault();show(q.value);return false}
f.onsubmit=go;q.onkeyup=function(e){if(e.key!=="Enter"&&q.value.replace(/\D/g,"").length>=9)show(q.value)};})();
show("");
</script>
